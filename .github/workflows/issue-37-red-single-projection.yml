name: Issue 37 RED single-projection regression

on:
  push:
    branches:
      - issue-37-shared-display-projection

permissions:
  contents: write

jobs:
  red:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-37-shared-display-projection
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add projection diagnostic and suite wiring
        shell: python
        run: |
          from pathlib import Path

          client = Path('AgentPanelSpeaker/AIConversationCoreClient.cs')
          text = client.read_text(encoding='utf-8')
          anchor = '''  private static readonly Encoding Utf8NoBom =
              new UTF8Encoding(encoderShouldEmitUTF8Identifier: false, throwOnInvalidBytes: true);
          '''
          replacement = '''  private static readonly Encoding Utf8NoBom =
              new UTF8Encoding(encoderShouldEmitUTF8Identifier: false, throwOnInvalidBytes: true);
            private static long _projectRequestCount;

            /// <summary>
            /// Gets the process-wide count of compatibility whole-session projection
            /// requests. Used by preparation diagnostics/regressions to detect repeated
            /// canonical work at the consumer boundary.
            /// </summary>
            internal static long ProjectRequestCount =>
              Interlocked.Read(ref _projectRequestCount);
          '''
          if text.count(anchor) != 1:
            raise SystemExit('AIConversationCoreClient counter anchor mismatch.')
          text = text.replace(anchor, replacement, 1)

          anchor = '''    ArgumentNullException.ThrowIfNull(jsonLines);
              AIConversationCoreProjectOptions effective = options ?? new();
          '''
          replacement = '''    ArgumentNullException.ThrowIfNull(jsonLines);
              Interlocked.Increment(ref _projectRequestCount);
              AIConversationCoreProjectOptions effective = options ?? new();
          '''
          if text.count(anchor) != 1:
            raise SystemExit('AIConversationCoreClient Project anchor mismatch.')
          text = text.replace(anchor, replacement, 1)
          client.write_text(text, encoding='utf-8')

          program = Path('AgentPanelSpeaker/Program.cs')
          text = program.read_text(encoding='utf-8')
          anchor = '''      if (args.Length == 2 &&
                  string.Equals(args[1], "independent-oracles", StringComparison.OrdinalIgnoreCase))
              {
                Environment.ExitCode = RunNamedSuite(
                  "independent-oracles",
                  () => RunWithWinFormsMessageLoop(
                    Issue46IndependentRegressionOracleTestRunner.Run));
                return;
              }
          '''
          replacement = anchor + '''
              if (args.Length == 2 &&
                  string.Equals(args[1], "preparation", StringComparison.OrdinalIgnoreCase))
              {
                Environment.ExitCode = RunNamedSuite(
                  "preparation",
                  () => RunWithWinFormsMessageLoop(
                    Issue37PreparationRegressionTestRunner.Run));
                return;
              }
          '''
          if text.count(anchor) != 1:
            raise SystemExit('Program named-suite anchor mismatch.')
          text = text.replace(anchor, replacement, 1)

          anchor = '''      int independentOutputOracle = RunIsolatedTestSuite("output-oracle");
              int independentOracles = RunIsolatedTestSuite("independent-oracles");
          '''
          replacement = anchor + '''      int preparation = RunIsolatedTestSuite("preparation");
          '''
          if text.count(anchor) != 1:
            raise SystemExit('Program isolated-suite anchor mismatch.')
          text = text.replace(anchor, replacement, 1)

          anchor = '''                             independentOutputOracle == 0 &&
                                         independentOracles == 0
          '''
          replacement = '''                             independentOutputOracle == 0 &&
                                         independentOracles == 0 &&
                                         preparation == 0
          '''
          if text.count(anchor) != 1:
            raise SystemExit('Program completion-condition anchor mismatch.')
          text = text.replace(anchor, replacement, 1)
          program.write_text(text, encoding='utf-8')

      - name: Commit RED regression wiring
        shell: bash
        run: |
          git rm .github/workflows/issue-37-red-single-projection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/AIConversationCoreClient.cs AgentPanelSpeaker/Program.cs AgentPanelSpeaker/Issue37PreparationRegressionTestRunner.cs
          git diff --check --cached
          git commit -m 'test: expose duplicate display Core projection'
          git push origin HEAD:issue-37-shared-display-projection

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build RED regression
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run RED preparation regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite preparation
