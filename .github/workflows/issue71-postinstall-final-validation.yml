name: Issue 71 atomic repair final validation

on:
  push:
    branches:
      - issue-71-stale-find-materialization

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[issue71-postinstall-finalized]') }}
    runs-on: windows-2025
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify validated production parent and Core pin
        shell: pwsh
        run: |
          $expectedParent = '5360eefe1740980f6fed46f81ff195206df1288c'
          $parent = (git rev-parse HEAD^).Trim()
          if ($parent -ne $expectedParent) {
            throw "Unexpected validation parent: $parent"
          }
          $expectedCore = '6c92799c1b14693001e8b913465f4a12b0b1e1ab'
          $actualCore = (git -C dependencies/AIConversationCore rev-parse HEAD).Trim()
          if ($actualCore -ne $expectedCore) {
            throw "Unexpected Core pin: $actualCore"
          }
          $headTree = (git rev-parse HEAD:AgentPanelSpeaker).Trim()
          $parentTree = (git rev-parse HEAD^:AgentPanelSpeaker).Trim()
          if ($headTree -ne $parentTree) {
            throw "Validation workflow commit changed AgentPanelSpeaker: $parentTree -> $headTree"
          }

      - name: Install Core dependencies
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Run Core regressions
        run: npm test --prefix dependencies/AIConversationCore

      - name: Validate Phase 2 baseline
        run: python dependencies/AIConversationCore/tests/validate-phase2-baseline.py

      - name: Build Release
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run exact issue 71 real-session suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite real-session-fixes

      - name: Run Find-origin regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite find-origin

      - name: Verify test-runner completion guard
        shell: pwsh
        run: '& tools/Invoke-TestSuite.ps1 -SelfTest'

      - name: Run complete built suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and run complete deployed suite
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          & tools/Invoke-TestSuite.ps1 -Executable (Join-Path $publish 'AgentPanelSpeaker.exe') -Suite all

      - name: Verify bundled runtime
        shell: pwsh
        run: |
          Remove-Item Env:AI_CONVERSATION_CORE -ErrorAction SilentlyContinue
          $tools = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\tools'
          $worker = Join-Path $tools 'AIConversationCore-worker.mjs'
          $marker = Join-Path $tools 'AIConversationCore-runtime\CORE_COMMIT'
          if (-not (Test-Path $worker)) { throw "Built worker missing: $worker" }
          if (-not (Test-Path $marker)) { throw "Core marker missing: $marker" }
          if ((Get-Content $marker -Raw).Trim() -ne '6c92799c1b14693001e8b913465f4a12b0b1e1ab') {
            throw 'Bundled Core pin mismatch.'
          }
          $request = '{"operation":"ping"}'
          $decoded = ($request | node $worker) | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Bundled worker ping failed: $($decoded.error)" }

      - name: Build DisplayParity
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release

      - name: Validate canonical display
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Validate whitespace and clean worktree
        shell: pwsh
        run: |
          git diff --check HEAD^
          if ((git status --porcelain).Count -ne 0) {
            git status --short
            throw 'Validation left an unexpected dirty worktree.'
          }

      - name: Remove temporary issue 71 second-round scaffolding
        shell: pwsh
        run: |
          $beforeApp = (git rev-parse HEAD:AgentPanelSpeaker).Trim()
          Remove-Item .github/workflows/issue71-postinstall-red.yml
          Remove-Item .github/workflows/issue71-postinstall-green.yml
          Remove-Item .github/workflows/issue71-postinstall-final-validation.yml
          Remove-Item scripts/apply-issue71-postinstall-red.py
          Remove-Item scripts/apply-issue71-postinstall-fix.py
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clean issue 71 atomic-repair scaffolding [issue71-postinstall-red] [issue71-postinstall-green] [issue71-postinstall-finalized]'
          $afterApp = (git rev-parse HEAD:AgentPanelSpeaker).Trim()
          if ($beforeApp -ne $afterApp) {
            throw "Cleanup changed AgentPanelSpeaker tree: $beforeApp -> $afterApp"
          }
          git diff --check HEAD^
          git push origin HEAD:issue-71-stale-find-materialization
