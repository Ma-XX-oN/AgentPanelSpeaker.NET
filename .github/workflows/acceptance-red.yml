# RED capture iteration: active gate aligned with the existing issue #35 test.
name: Acceptance regression RED capture

on:
  push:
    branches:
      - acceptance-regressions-20260912
    paths:
      - '.github/workflows/acceptance-red.yml'

permissions:
  contents: write

jobs:
  capture-red:
    runs-on: windows-latest

    steps:
      - name: Check out working branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Apply RED-only acceptance edits
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $issue54 = 'AgentPanelSpeaker/Issue54RealSessionRegressionTestRunner.cs'
          $text = Get-Content $issue54 -Raw
          $old = '  /// Reproduces issue #58 without splitting Core atomic units. A final turn can'
          $new = "  /// Reproduces issue #58 without splitting Core atomic units.`r`n  /// A final turn can"
          if (-not $text.Contains($old)) {
            throw 'Issue #58 comment anchor did not match expected source.'
          }
          Set-Content $issue54 ($text.Replace($old, $new)) -NoNewline

          python .tmp/apply-acceptance-red.py
          if ($LASTEXITCODE -ne 0) { throw 'RED edit generator failed.' }
          python .tmp/apply-webview-wheel-red.py
          if ($LASTEXITCODE -ne 0) { throw 'WebView wheel RED generator failed.' }
          python .tmp/fix-user-context-red.py
          if ($LASTEXITCODE -ne 0) { throw 'User Context RED generator failed.' }

          $generated = Get-Content $issue54 -Raw
          $malformed = "      using var dialog = new PronunciationDialog(`r`n      dialog = new PronunciationDialog(`r`n"
          $correct = "      dialog = new PronunciationDialog(`r`n"
          $occurrences = ([regex]::Matches(
            $generated,
            [regex]::Escape($malformed))).Count
          if ($occurrences -ne 1) {
            throw "Expected one malformed editor constructor pair, found $occurrences."
          }
          Set-Content $issue54 ($generated.Replace($malformed, $correct)) -NoNewline

          $issue26 = 'AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs'
          $generated26 = Get-Content $issue26 -Raw
          $liveCleanup = "      form.Dispose();"
          $liveCleanupCount = ([regex]::Matches(
            $generated26,
            [regex]::Escape($liveCleanup))).Count
          if ($liveCleanupCount -ne 2) {
            throw "Expected active and live-monitor MainForm cleanup sites, found $liveCleanupCount."
          }
          $activeCleanup = "      Application.RemoveMessageFilter(form);`r`n      form.Dispose();"
          if (-not $generated26.Contains($activeCleanup)) {
            throw 'Active User Context cleanup was not generated correctly.'
          }
          $remainingDispose = $generated26.IndexOf(
            $liveCleanup,
            $generated26.IndexOf($activeCleanup) + $activeCleanup.Length)
          if ($remainingDispose -lt 0) {
            $remainingDispose = $generated26.IndexOf($liveCleanup)
          }
          if ($remainingDispose -ge 0) {
            $generated26 = $generated26.Remove($remainingDispose, $liveCleanup.Length)
            $generated26 = $generated26.Insert(
              $remainingDispose,
              "      Application.RemoveMessageFilter(form);`r`n      form.Dispose();")
          }
          Set-Content $issue26 $generated26 -NoNewline

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'RED edit whitespace validation failed.' }
          $changed = @(git diff --name-only)
          $expected = @(
            'AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs',
            'AgentPanelSpeaker/Issue54RealSessionRegressionTestRunner.cs',
            'AgentPanelSpeaker/Issue75CoreWordIdMigrationRegressionTestRunner.cs'
          )
          if (@(Compare-Object $changed $expected).Count -ne 0) {
            throw "Unexpected RED changed files: $($changed -join ', ')"
          }

      - name: Compile RED regressions before recording them
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Verify exact expected RED failures
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'

          function Assert-ExpectedRed {
            param(
              [string]$Suite,
              [string[]]$Expected
            )

            $output = & $exe --test $Suite 2>&1 | Out-String
            $exit = $LASTEXITCODE
            Write-Host $output
            if ($exit -eq 0) {
              throw "Suite '$Suite' unexpectedly passed; RED was not reproduced."
            }

            $failures = @($output -split "`r?`n" | Where-Object { $_ -like 'FAIL  *' })
            foreach ($name in $Expected) {
              $line = "FAIL  $name"
              if ($failures -notcontains $line) {
                throw "Suite '$Suite' did not reproduce expected RED '$name'. Failures: $($failures -join '; ')"
              }
            }
            if ($failures.Count -ne $Expected.Count) {
              throw "Suite '$Suite' produced unexpected extra REDs: $($failures -join '; ')"
            }
          }

          Assert-ExpectedRed 'user-context-speech' @(
            'user-context-speech/active-checkbox-cancels-ineligible-utterance'
          )
          Assert-ExpectedRed 'core-word-id-migration' @(
            'core-word-id/attached-identifier-period-preserves-one-speech-fragment',
            'core-word-id/attached-identifier-period-synthesizes-dot'
          )
          Assert-ExpectedRed 'real-session-fixes' @(
            'real-session/pending-manual-scroll-converges-after-replacement',
            'real-session/owned-editor-retains-bare-transport-keys',
            'real-session/webview-wheel-input-is-logged-and-correlated'
          )

      - name: Commit and push verified RED regressions
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs
          git add AgentPanelSpeaker/Issue54RealSessionRegressionTestRunner.cs
          git add AgentPanelSpeaker/Issue75CoreWordIdMigrationRegressionTestRunner.cs
          git commit -m 'test: reproduce real-machine acceptance regressions'
          $red = git rev-parse HEAD
          "Verified RED commit: $red" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          git push origin HEAD:acceptance-regressions-20260912

      - name: Mark this run as RED evidence
        shell: pwsh
        run: |
          Write-Error 'Expected RED regressions were reproduced, committed, and pushed. This failure is intentional RED evidence.'
