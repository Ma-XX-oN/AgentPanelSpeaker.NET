name: Issue 71 playback-regression correction

on:
  push:
    branches:
      - issue-71-stale-find-materialization

permissions:
  contents: write

jobs:
  green:
    if: ${{ !contains(github.event.head_commit.message, '[issue71-playback-green]') }}
    runs-on: windows-2025
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply playback regression correction
        run: python scripts/apply-issue71-playback-regression-fix.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit corrected production candidate
        shell: pwsh
        run: |
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add AgentPanelSpeaker/TranscriptView.cs
          git commit -m 'fix: correct Find-only scroll behavior [issue71-postinstall-red] [issue71-postinstall-green] [issue71-postinstall-finalized] [issue71-playback-green]'

      - name: Build Release
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run independent regression oracles
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite independent-oracles

      - name: Run exact issue 71 real-session regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite real-session-fixes

      - name: Run Find-origin regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite find-origin

      - name: Run virtual-window regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite virtual-window

      - name: Verify clean committed candidate
        shell: pwsh
        run: |
          if ((git status --porcelain).Count -ne 0) {
            git status --short
            throw 'Candidate repair left an unexpected dirty worktree.'
          }
          git diff --check HEAD^

      - name: Push corrected candidate
        shell: pwsh
        run: git push origin HEAD:issue-71-stale-find-materialization
