name: Issue 73 Real-machine GREEN

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer

permissions:
  contents: write

jobs:
  green:
    if: ${{ contains(github.event.head_commit.message, '[issue73-realmachine-green]') }}
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply production repairs
        shell: pwsh
        run: python scripts/apply-issue73-realmachine-fix.py

      - name: Verify production diff scope
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Production git diff --check failed.' }
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) } | Sort-Object)
          $expected = @(
            'AgentPanelSpeaker/MainForm.cs',
            'AgentPanelSpeaker/SpeechService.cs',
            'AgentPanelSpeaker/TranscriptView.cs'
          )
          if (($changed -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected production changes: $($changed -join ', ')"
          }

      - name: Build Release
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run exact repaired regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          function Invoke-Suite([string]$suite) {
            $stdout = Join-Path $env:RUNNER_TEMP ($suite + '-green-stdout.txt')
            $stderr = Join-Path $env:RUNNER_TEMP ($suite + '-green-stderr.txt')
            $process = Start-Process -FilePath $exe -ArgumentList @('--test', $suite) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $text = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
            Write-Host $text
            if ($process.ExitCode -ne 0 -or $text -notmatch [regex]::Escape("TEST-SUITE-COMPLETE $suite exit=0")) {
              throw "$suite regression failed or lacked its completion marker."
            }
          }
          Invoke-Suite 'ctrl-click-voice-pointer'
          Invoke-Suite 'user-context-speech'

      - name: Run focused navigation and playback regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          foreach ($suite in @('find-origin', 'virtual-window', 'word-materialization', 'speech-ordinals', 'rolled-back-speech')) {
            & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite $suite
            if ($LASTEXITCODE -ne 0) { throw "$suite regression failed." }
          }

      - name: Commit production repairs
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/MainForm.cs AgentPanelSpeaker/SpeechService.cs AgentPanelSpeaker/TranscriptView.cs
          git commit -m 'fix: align Ctrl-click ordinals and revalidate paused eligibility (#73) [issue73-realmachine-green-recorded]'
          git push origin HEAD:issue-73-ctrl-click-voice-pointer
