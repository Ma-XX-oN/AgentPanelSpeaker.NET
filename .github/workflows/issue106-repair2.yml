name: Issue 106 corrected fragment-list repair

on:
  push:
    branches:
      - issue-106-fragment-list-structure
    paths:
      - .github/workflows/issue106-repair2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Check out issue branch and Core
        uses: actions/checkout@v4
        with:
          ref: issue-106-fragment-list-structure
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply non-destructive fragment repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('AgentPanelSpeaker/TranscriptView.cs')
          source = path.read_text(encoding='utf-8')

          declaration = 'let currentFragmentPlaybackElement = null;'
          if source.count(declaration) != 1:
            raise SystemExit('Expected exactly one fragment playback element declaration.')
          source = source.replace(
            declaration,
            'let currentFragmentPlaybackElements = [];',
            1)

          wrap_start = source.index('function wrapSpeechFragments() {')
          wrap_end = source.index('\nfunction retireFragmentPlayback', wrap_start)
          wrap_replacement = r'''function fragmentRangeHasPartialNonTextNode(range) {
            const startAncestors = new Set();
            const endAncestors = new Set();
            for (let node = range.startContainer; node; node = node.parentNode) {
              startAncestors.add(node);
            }
            for (let node = range.endContainer; node; node = node.parentNode) {
              endAncestors.add(node);
            }
            for (const node of startAncestors) {
              if (node.nodeType !== Node.TEXT_NODE && !endAncestors.has(node)) {
                return true;
              }
            }
            for (const node of endAncestors) {
              if (node.nodeType !== Node.TEXT_NODE && !startAncestors.has(node)) {
                return true;
              }
            }
            return false;
          }

          function fragmentPlaybackTargets(fragment) {
            const wrapper = document.getElementById('frag-' + fragment.fragmentId);
            if (wrapper) return [wrapper];
            const owners = fragment.wordIds.map(wordId =>
              document.getElementById('word-' + wordId));
            if (owners.some(owner => !owner)) return [];
            const firstBlock = fragmentBlockOwner(owners[0]);
            const lastBlock = fragmentBlockOwner(owners[owners.length - 1]);
            if (firstBlock && firstBlock === lastBlock &&
                (owners[0] === firstBlock ||
                 owners[owners.length - 1] === firstBlock)) {
              return [firstBlock];
            }
            return canonicalPlaybackElements(fragment.wordIds);
          }

          function wrapSpeechFragments() {
            for (const fragment of speechFragments) {
              const id = 'frag-' + fragment.fragmentId;
              if (document.getElementById(id)) continue;
              const owners = fragment.wordIds.map(wordId =>
                document.getElementById('word-' + wordId));
              if (owners.some(owner => !owner)) continue;
              const first = owners[0];
              const last = owners[owners.length - 1];
              if (fragmentBlockOwner(first) !== fragmentBlockOwner(last)) {
                chrome.webview.postMessage({
                  type:'fragment-wrap-failed',
                  fragmentId:fragment.fragmentId,
                  reason:'fragment-crosses-rendered-blocks'
                });
                continue;
              }
              const range = document.createRange();
              range.setStartBefore(first);
              range.setEndAfter(last);
              if (fragmentRangeHasPartialNonTextNode(range)) {
                chrome.webview.postMessage({
                  type:'fragment-wrap-skipped',
                  fragmentId:fragment.fragmentId,
                  reason:'partial-non-text-node'
                });
                continue;
              }
              const wrapper = document.createElement('span');
              wrapper.id = id;
              wrapper.className = 'speech-fragment';
              try {
                range.surroundContents(wrapper);
              } catch (error) {
                chrome.webview.postMessage({
                  type:'fragment-wrap-failed',
                  fragmentId:fragment.fragmentId,
                  reason:'surround-rejected-after-preflight',
                  error:String(error)
                });
              }
            }
          }
          '''
          source = source[:wrap_start] + wrap_replacement + source[wrap_end:]

          retire_start = source.index('function retireFragmentPlayback(useFade) {')
          canonical_start = source.index('\nfunction canonicalPlaybackElements', retire_start)
          playback_replacement = r'''function retireFragmentPlayback(useFade) {
            if (!currentFragmentPlaybackElements.length) return;
            const elements = currentFragmentPlaybackElements;
            currentFragmentPlaybackElements = [];
            const highlight = getComputedStyle(document.documentElement)
              .getPropertyValue('--highlight').trim();
            for (const element of elements) {
              element.classList.remove('active', 'paused');
              cancelFade(element);
              if (useFade && fadeMs > 0) {
                const animation = element.animate(
                  [
                    {backgroundColor: highlight},
                    {backgroundColor: 'transparent'}
                  ],
                  {duration: fadeMs, easing: 'linear'});
                fadingAnimations.set(element, animation);
                animation.onfinish = () => fadingAnimations.delete(element);
                animation.oncancel = () => fadingAnimations.delete(element);
              }
            }
          }

          function setFragmentPlayback(state, fragmentId) {
            retireCurrentWord(true);
            retireCanonicalPlayback(true);
            retireFragmentPlayback(true);
            wrapSpeechFragments();
            const id = Number(fragmentId);
            const descriptor = Number.isSafeInteger(id) && id >= 0
              ? speechFragments.find(item => item.fragmentId === id)
              : null;
            const elements = descriptor
              ? fragmentPlaybackTargets(descriptor)
              : [];
            if (!elements.length) {
              if (descriptor?.wordIds?.length) {
                requestCanonicalPlaybackWindow(descriptor.wordIds[0]);
              }
              return;
            }
            currentFragmentPlaybackElements = elements;
            const className = state === 'paused' ? 'paused' : 'active';
            for (const element of elements) {
              cancelFade(element);
              element.classList.add(className);
            }
            const target = elements[0];
            if (followSpeech) openAncestors(target);
            reveal(target);
            maybePrefetchVoiceCursor(target);
          }
          '''
          source = source[:retire_start] + playback_replacement + source[canonical_start:]

          marker_old = '''markerVisible: currentFragmentPlaybackElement
                ? (() => {
                    const rect = currentFragmentPlaybackElement.getBoundingClientRect();
                    return rect.bottom > 0 && rect.top < window.innerHeight;
                  })()
                : currentCanonicalPlaybackElements.length > 0'''
          marker_new = '''markerVisible: currentFragmentPlaybackElements.length > 0
                ? currentFragmentPlaybackElements.some(element => {
                    const rect = element.getBoundingClientRect();
                    return rect.bottom > 0 && rect.top < window.innerHeight;
                  })
                : currentCanonicalPlaybackElements.length > 0'''
          if source.count(marker_old) != 1:
            raise SystemExit('Could not isolate fragment marker visibility expression.')
          source = source.replace(marker_old, marker_new, 1)

          reset_start = source.index('function resetPlaybackProjectionState() {')
          reset_end = source.index('\n}', reset_start)
          reset_block = source[reset_start:reset_end]
          reset_marker = '  currentSpeechListItem = null;\n'
          if reset_marker not in reset_block:
            raise SystemExit('Could not locate playback reset insertion point.')
          reset_block = reset_block.replace(
            reset_marker,
            reset_marker + '  currentFragmentPlaybackElements = [];\n',
            1)
          source = source[:reset_start] + reset_block + source[reset_end:]

          fragment_block = source[
            source.index('function wrapSpeechFragments() {'):
            source.index('\nfunction retireFragmentPlayback')]
          if 'extractContents()' in fragment_block:
            raise SystemExit('Destructive extractContents recovery remains.')
          if 'currentFragmentPlaybackElement = ' in source:
            raise SystemExit('Singular fragment playback state remains.')
          path.write_text(source, encoding='utf-8')

          project = Path('AgentPanelSpeaker/AgentPanelSpeaker.csproj')
          csproj = project.read_text(encoding='utf-8')
          if csproj.count('<Version>1.0.0</Version>') != 1:
            raise SystemExit('Expected AgentPanelSpeaker release baseline 1.0.0.')
          project.write_text(
            csproj.replace(
              '<Version>1.0.0</Version>',
              '<Version>1.0.0-issue.106.1</Version>',
              1),
            encoding='utf-8')

      - name: Validate patch shape
        shell: pwsh
        run: |
          git diff --check
          if (Select-String -Path AgentPanelSpeaker/TranscriptView.cs -SimpleMatch 'extractContents()') {
            throw 'TranscriptView still contains destructive Range.extractContents() recovery.'
          }

      - name: Verify Core pin and install dependencies
        shell: pwsh
        run: |
          $expected = '74a96db899acacf2be7eec42a1175b733b6e7cfb'
          $actual = git -C dependencies/AIConversationCore rev-parse HEAD
          if ($actual.Trim() -ne $expected) { throw "Unexpected AIConversationCore pin: $actual" }
          npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Run pinned Core regressions
        shell: pwsh
        run: |
          npm test --prefix dependencies/AIConversationCore
          python dependencies/AIConversationCore/tests/validate-phase2-baseline.py

      - name: Build development identity
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Verify development version consistency
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Verify-VersionConsistency.ps1 -Executable $exe

      - name: GREEN exact issue 106 regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite core-word-id-migration

      - name: Verify test completion guard
        shell: pwsh
        run: '& tools/Invoke-TestSuite.ps1 -SelfTest'

      - name: Run complete built suite on development identity
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and test development identity
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-dev-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'Development publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          & tools/Verify-VersionConsistency.ps1 -Executable $exe
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Verify bundled Core runtime
        shell: pwsh
        run: |
          Remove-Item Env:AI_CONVERSATION_CORE -ErrorAction SilentlyContinue
          $outputTools = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\tools'
          $worker = Join-Path $outputTools 'AIConversationCore-worker.mjs'
          $marker = Join-Path $outputTools 'AIConversationCore-runtime\CORE_COMMIT'
          $package = Join-Path $outputTools 'AIConversationCore-runtime\package.json'
          if (-not (Test-Path $worker)) { throw "Built worker missing: $worker" }
          if (-not (Test-Path $marker)) { throw "Core marker missing: $marker" }
          if (-not (Test-Path $package)) { throw "Core package metadata missing: $package" }
          $corePackage = Get-Content -LiteralPath $package -Raw | ConvertFrom-Json
          $request = '{"operation":"ping"}'
          $response = $request | node $worker
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Bundled worker ping failed: $($decoded.error)" }
          if ($decoded.core_commit -ne '74a96db899acacf2be7eec42a1175b733b6e7cfb') {
            throw "Unexpected bundled Core commit: $($decoded.core_commit)"
          }
          if ($decoded.core_version -ne $corePackage.version) {
            throw "Unexpected bundled Core version: $($decoded.core_version)"
          }

      - name: Build display validation harness
        shell: pwsh
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release

      - name: Verify structured provider projections and canonical display
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE 'dependencies\AIConversationCore\package.json'
          $corePackage = Get-Content -LiteralPath $package -Raw | ConvertFrom-Json
          $ping = '{"operation":"ping"}' | node tools/AIConversationCore-worker.mjs | ConvertFrom-Json
          if (-not $ping.ok) { throw "Worker ping failed: $($ping.error)" }
          if ($ping.core_commit -ne '74a96db899acacf2be7eec42a1175b733b6e7cfb') { throw 'Worker pin changed.' }
          if ($ping.core_version -ne $corePackage.version) { throw 'Worker Core version changed.' }

          $claude = @{ type = 'user'; uuid = 'ci-user'; timestamp = '2026-09-05T00:00:00Z'; message = @{ role = 'user'; content = @(@{ type = 'text'; text = '<system-reminder>generated</system-reminder>CI projection check' }) } }
          $request = @{ operation = 'project'; provider = 'claude'; records = @($claude) } | ConvertTo-Json -Depth 10 -Compress
          $decoded = ($request | node tools/AIConversationCore-worker.mjs) | ConvertFrom-Json
          if (-not $decoded.ok -or $decoded.projection.units[0].block.text -ne 'CI projection check') { throw 'Claude projection failed.' }

          $records = @(
            @{ type = 'event_msg'; timestamp = '2026-09-05T00:00:00Z'; payload = @{ type = 'user_message'; message = "context`n## My request for Codex:`nActual request" } },
            @{ type = 'event_msg'; timestamp = '2026-09-05T00:00:01Z'; payload = @{ type = 'task_complete' } }
          )
          $request = @{ operation = 'project'; provider = 'codex'; records = $records } | ConvertTo-Json -Depth 10 -Compress
          $decoded = ($request | node tools/AIConversationCore-worker.mjs) | ConvertFrom-Json
          if (-not $decoded.ok) { throw 'Codex projection failed.' }
          if (($decoded.projection.events | Where-Object { $_.content_type -eq 'task_complete' }).lifecycle.timestamp -ne '2026-09-05T00:00:01Z') { throw 'Codex lifecycle changed.' }

          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Promote final 1.0.0 identity
        shell: python
        run: |
          from pathlib import Path
          path = Path('AgentPanelSpeaker/AgentPanelSpeaker.csproj')
          source = path.read_text(encoding='utf-8')
          if source.count('<Version>1.0.0-issue.106.1</Version>') != 1:
            raise SystemExit('Development version identity is missing.')
          path.write_text(
            source.replace(
              '<Version>1.0.0-issue.106.1</Version>',
              '<Version>1.0.0</Version>',
              1),
            encoding='utf-8')

      - name: Rebuild final identity
        shell: pwsh
        run: |
          dotnet clean AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Verify-VersionConsistency.ps1 -Executable $exe
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and test final identity
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-final-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'Final publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          & tools/Verify-VersionConsistency.ps1 -Executable $exe
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Validate final patch integrity
        shell: pwsh
        run: |
          git diff --check
          git fetch origin feature/aiconversationcore-integration --depth=1
          git diff --check FETCH_HEAD -- AgentPanelSpeaker/TranscriptView.cs AgentPanelSpeaker/AgentPanelSpeaker.csproj

      - name: Commit verified issue 106 repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AgentPanelSpeaker/TranscriptView.cs AgentPanelSpeaker/AgentPanelSpeaker.csproj
          git diff --cached --check
          git commit -m "fix: preserve canonical DOM for fragment highlighting (#106)"
          git push origin HEAD:issue-106-fragment-list-structure
