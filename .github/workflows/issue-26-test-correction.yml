name: Correct issue 26 retained-history test

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0
      - name: Correct assertion and commit test only
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs')
          text = path.read_text(encoding='utf-8')
          old = ('    WaitUntil(\n'
            '      () => monitor.IsRunning &&\n'
            '        ReadSpeechHistoryCategories(speech).SequenceEqual(\n'
            '          new[] { ContentCategory.UserContext, ContentCategory.User }),\n'
            '      "SpeakUserContext OFF must retain User Context in indexed speech history.");')
          new = ('    WaitUntil(\n'
            '      () =>\n'
            '      {\n'
            '        IReadOnlyList<ContentCategory> categories =\n'
            '          ReadSpeechHistoryCategories(speech);\n'
            '        return monitor.IsRunning &&\n'
            '          categories.Contains(ContentCategory.UserContext) &&\n'
            '          categories.Contains(ContentCategory.User);\n'
            '      },\n'
            '      "SpeakUserContext OFF must retain User Context in indexed speech history.");')
          if text.count(old) != 1:
            raise SystemExit(f'assertion target count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          '@ | python -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-26-test-correction.yml
          git add AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "test: accept multiple retained user context fragments"
          git push origin HEAD:feature/aiconversationcore-integration
