name: Apply issue 46 history-oracle fix

on:
  push:
    branches:
      - issue-46-independent-regression-oracles

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-46-independent-regression-oracles
          fetch-depth: 0

      - name: Replace preview-generation proxy with direct retained-history mutation sentinel
        shell: python
        run: |
          from pathlib import Path

          path = Path('AgentPanelSpeaker/Issue46IndependentRegressionOracleTestRunner.cs')
          text = path.read_text(encoding='utf-8')

          anchor = 'internal static class Issue46IndependentRegressionOracleTestRunner\n{\n'
          addition = '''internal static class Issue46IndependentRegressionOracleTestRunner
          {
            private static readonly Dictionary<SpeechService, IEnumerator<SpeechFragment>>
              SpeechHistoryMutationSentinels = new();
          '''
          if text.count(anchor) != 1:
            raise SystemExit('Unexpected issue46 runner class anchor count.')
          text = text.replace(anchor, addition, 1)

          generation_line = '      int generation = ReadField<int>(form, "_historyPreviewGeneration");\n'
          if text.count(generation_line) != 2:
            raise SystemExit('Unexpected history-preview generation declaration count.')
          text = text.replace(generation_line, '')

          generation_arg = '        generation,\n'
          if text.count(generation_arg) != 4:
            raise SystemExit('Unexpected history-preview generation argument count.')
          text = text.replace(generation_arg, '')

          signature = '''  private static void RequireUnchangedSessionState(
              MainForm form,
              int generation,
              int monitorSession,
          '''
          replacement_signature = '''  private static void RequireUnchangedSessionState(
              MainForm form,
              int monitorSession,
          '''
          if text.count(signature) != 1:
            raise SystemExit('Unexpected unchanged-session helper signature count.')
          text = text.replace(signature, replacement_signature, 1)

          proxy = '''    Require(
                ReadField<int>(form, "_historyPreviewGeneration") == generation,
                $"{description} rebuilt canonical history.");
          '''
          direct = '''    RequireSpeechHistoryUnmodified(speech, description);
          '''
          if text.count(proxy) != 1:
            raise SystemExit('Unexpected preview-generation proxy assertion count.')
          text = text.replace(proxy, direct, 1)

          old_read = '''    if (field.GetValue(speech) is not IEnumerable history)
              {
                throw new InvalidOperationException("SpeechService history is not enumerable.");
              }
              return history.Cast<SpeechFragment>().ToArray();
            }
          '''
          new_read = '''    if (field.GetValue(speech) is not List<SpeechFragment> history)
              {
                throw new InvalidOperationException("SpeechService history had an unexpected type.");
              }
              SpeechHistoryMutationSentinels.TryAdd(speech, history.GetEnumerator());
              return history.ToArray();
            }

            /// <summary>
            /// Proves that the retained speech-history collection itself was not
            /// cleared/repopulated while a settings event ran. A List enumerator
            /// captures the collection version at baseline and throws if any later
            /// mutation occurred, even when the rebuilt items are value-identical.
            /// </summary>
            private static void RequireSpeechHistoryUnmodified(
              SpeechService speech,
              string description)
            {
              if (!SpeechHistoryMutationSentinels.TryGetValue(
                    speech,
                    out IEnumerator<SpeechFragment>? sentinel))
              {
                throw new InvalidOperationException(
                  "Speech-history mutation sentinel was not initialized.");
              }

              try
              {
                _ = sentinel.MoveNext();
              }
              catch (InvalidOperationException)
              {
                throw new InvalidOperationException(
                  $"{description} rebuilt retained speech history.");
              }
            }
          '''
          if text.count(old_read) != 1:
            raise SystemExit('Unexpected ReadSpeechHistory implementation count.')
          text = text.replace(old_read, new_read, 1)

          path.write_text(text, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/issue-46-apply-test-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue46IndependentRegressionOracleTestRunner.cs
          git diff --check --cached
          git commit -m 'test: detect actual history rebuilds in settings oracles'
          git push origin HEAD:issue-46-independent-regression-oracles
