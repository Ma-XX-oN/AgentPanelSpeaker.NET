name: Repair issue 94 workflow parser

on:
  push:
    branches:
      - issue-94-system-speech-sample-rate

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-94-system-speech-sample-rate
          fetch-depth: 0
      - name: Repair workflows and retrigger implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          implementation = Path('.github/workflows/issue-94-rate-match-toggle.yml')
          text = implementation.read_text(encoding='utf-8')
          bad_if = "    if: github.event.head_commit.message == 'chore: apply issue 94 rate-match toggle'\n"
          bad_shell = '        shell: python\n'
          if text.count(bad_if) != 1:
            raise SystemExit(f'expected one invalid if line, found {text.count(bad_if)}')
          if text.count(bad_shell) != 1:
            raise SystemExit(f'expected one python shell line, found {text.count(bad_shell)}')
          text = text.replace(bad_if, '')
          text = text.replace(bad_shell, '        shell: python {0}\n')
          implementation.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-issue-94-rate-workflow.yml').unlink()
          Path('.github/workflows/repair-issue-94-workflows.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply issue 94 rate-match toggle"
          git push origin HEAD:issue-94-system-speech-sample-rate
