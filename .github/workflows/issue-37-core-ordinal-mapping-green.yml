name: Issue 37 Core ordinal mapping GREEN

on:
  push:
    branches:
      - issue-37-vwindow-convergence-containment
    paths:
      - '.github/workflows/issue-37-core-ordinal-mapping-green.yml'
      - 'scripts/issue-37-core-ordinal-mapping-fix.py'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-37-vwindow-convergence-containment
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Apply Core ordinal mapping fix
        shell: pwsh
        run: |
          python scripts/issue-37-core-ordinal-mapping-fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build patched application
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require same speech-ordinal RED regressions GREEN
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite speech-ordinals-focused
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite speech-ordinals-production
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite independent-oracles

      - name: Recheck issue 37 focused regressions
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite virtual-window
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite word-materialization
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite core
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite output-oracle
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite rolled-back-visibility

      - name: Validate patch integrity
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- AgentPanelSpeaker/TranscriptSearchIndex.cs AgentPanelSpeaker/TranscriptView.cs AgentPanelSpeaker/Issue24ProductionPathRegressionTestRunner.cs

      - name: Commit verified ordinal mapping fix
        shell: pwsh
        run: |
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add AgentPanelSpeaker/TranscriptSearchIndex.cs AgentPanelSpeaker/TranscriptView.cs AgentPanelSpeaker/Issue24ProductionPathRegressionTestRunner.cs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'fix: map Core list ordinals into speech highlighting (#37)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:issue-37-vwindow-convergence-containment
