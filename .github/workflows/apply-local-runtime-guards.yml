name: Apply runtime retry guard and CI coverage

on:
  push:
    branches:
      - feature/aiconversationcore-integration
    paths:
      - .github/workflows/apply-local-runtime-guards.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration

      - name: Apply exact edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          view = Path('AgentPanelSpeaker/TranscriptView.cs')
          text = view.read_text(encoding='utf-8')
          needle = '''    if (generation != _renderGeneration)
              {
                return;
              }

              var cancellation = new CancellationTokenSource();
          '''
          replacement = '''    if (generation != _renderGeneration)
              {
                return;
              }

              // Record the exact file generation before preparation starts. If
              // preparation fails, the timer must not retry identical bytes in
              // a tight loop; a real file change or forced refresh can retry.
              _lastWriteUtc = info.LastWriteTimeUtc;
              _lastLength = info.Length;

              var cancellation = new CancellationTokenSource();
          '''
          if text.count(needle) != 1:
            # Match independent of indentation drift while still asserting one site.
            needle = '''    if (generation != _renderGeneration)
    {
      return;
    }

    var cancellation = new CancellationTokenSource();
'''
            replacement = '''    if (generation != _renderGeneration)
    {
      return;
    }

    // Record the exact file generation before preparation starts. If
    // preparation fails, the timer must not retry identical bytes in a tight
    // loop; a real file change or forced refresh can retry.
    _lastWriteUtc = info.LastWriteTimeUtc;
    _lastLength = info.Length;

    var cancellation = new CancellationTokenSource();
'''
          if text.count(needle) != 1:
            raise SystemExit(f'TranscriptView retry guard site count={text.count(needle)}')
          view.write_text(text.replace(needle, replacement, 1), encoding='utf-8', newline='\n')

          workflow = Path('.github/workflows/core-integration-validation.yml')
          text = workflow.read_text(encoding='utf-8')
          needle = '''      - name: Build display validation harness
        shell: pwsh
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release
'''
          replacement = '''      - name: Verify bundled runtime from built output
        shell: pwsh
        run: |
          Remove-Item Env:AI_CONVERSATION_CORE -ErrorAction SilentlyContinue
          $outputTools = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\\bin\\Release\\net10.0-windows10.0.22621.0\\tools'
          $worker = Join-Path $outputTools 'AIConversationCore-worker.mjs'
          $marker = Join-Path $outputTools 'AIConversationCore-runtime\\CORE_COMMIT'
          if (-not (Test-Path $worker)) { throw "Built worker missing: $worker" }
          if (-not (Test-Path $marker)) { throw "Bundled core marker missing: $marker" }
          $request = '{"operation":"ping"}'
          $response = $request | node $worker
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Bundled worker ping failed: $($decoded.error)" }
          if ($decoded.core_commit -ne 'a6fd322aece692cd0c90bc89f11228b3a4e83520') {
            throw "Unexpected bundled core commit: $($decoded.core_commit)"
          }

      - name: Build display validation harness
        shell: pwsh
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release
'''
          if text.count(needle) != 1:
            raise SystemExit(f'CI insertion site count={text.count(needle)}')
          workflow.write_text(text.replace(needle, replacement, 1), encoding='utf-8', newline='\n')
          PY

      - name: Commit and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-local-runtime-guards.yml
          git rm -f .github/workflows/fix-bundled-core-runtime.yml
          git add AgentPanelSpeaker/TranscriptView.cs .github/workflows/core-integration-validation.yml
          git commit -m "guard failed transcript renders and test bundled runtime"
          git push origin HEAD:feature/aiconversationcore-integration
