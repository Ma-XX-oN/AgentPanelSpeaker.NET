name: Issue 37 selective word materialization RED v3

on:
  push:
    branches:
      - issue-37-selective-word-materialization
    paths:
      - '.github/workflows/issue-37-word-materialization-red3.yml'

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-37-selective-word-materialization
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Keep behavioural fixture fast
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('AgentPanelSpeaker/Issue37WordMaterializationRegressionTestRunner.cs')
          text = path.read_text(encoding='utf-8')
          old = '  private const int FillerRepeats = 12000;'
          new = '  private const int FillerRepeats = 1000;'
          if old in text:
            text = text.replace(old, new, 1)
            path.write_text(text, encoding='utf-8')
          elif new not in text:
            raise SystemExit('FillerRepeats anchor not found')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue37WordMaterializationRegressionTestRunner.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m 'test: bound issue 37 word-materialization fixture size (#37)'
            git push origin HEAD:issue-37-selective-word-materialization
          }

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build RED regression
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require meaningful RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'issue37-word-red-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'issue37-word-red-err.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--test','word-materialization' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(45000)) {
            try { $process.Kill($true) } catch {}
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Issue #37 RED process did not exit within 45 seconds.'
          }
          $text = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          Write-Host $text
          if ($process.ExitCode -eq 0) { throw 'Regression unexpectedly passed before fix.' }
          if ($text -notmatch 'Large unvoiced record was eagerly expanded into word spans') {
            throw 'Issue #37 RED failed for an unexpected reason.'
          }
          if ($text -notmatch 'TEST-SUITE-COMPLETE word-materialization exit=1') {
            throw 'Issue #37 RED did not reach completion sentinel.'
          }
