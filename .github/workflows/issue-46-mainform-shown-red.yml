name: Issue 46 MainForm Shown RED

on:
  push:
    branches:
      - issue-46-published-toggle-isolation
    paths:
      - '.github/workflows/issue-46-mainform-shown-red.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Stage deterministic lifecycle regression
        shell: pwsh
        run: |
          python tools/apply_issue46_mainform_shown_regression.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check

      - name: Build Release
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Prove MainForm lease lifecycle RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'red.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'red.err'
          $p = Start-Process -FilePath $exe -ArgumentList '--test','independent-oracles' -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -Wait
          $text = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          Write-Host $text
          if ($p.ExitCode -eq 0) { throw 'Expected lifecycle regression to be RED before lease fix.' }
          if (-not $text.Contains('FAIL  independent-oracle/mainform-lease-completes-shown-before-return')) {
            throw 'Deterministic lifecycle regression did not fail.'
          }
          if (-not $text.Contains('MainFormTestLease returned before the production MainForm Shown lifecycle completed.')) {
            throw 'Lifecycle regression failed for the wrong reason.'
          }
          Write-Host 'RED-PROVEN issue-46 MainForm lease returns before Shown lifecycle completion.'

      - name: Commit proven RED regression
        shell: pwsh
        run: |
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue46IndependentRegressionOracleTestRunner.cs
          if (git diff --cached --quiet) { throw 'No regression change to commit.' }
          git commit -m 'test: require MainForm test lease to drain Shown lifecycle (#46) [skip ci]'
          git push origin HEAD:issue-46-published-toggle-isolation
