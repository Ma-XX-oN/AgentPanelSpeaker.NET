name: Issue 73 Final Validation

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer

permissions:
  contents: write

jobs:
  final:
    if: ${{ contains(github.event.head_commit.message, '[issue73-final-validate]') }}
    runs-on: windows-latest
    steps:
      - name: Check out candidate and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify exact production candidate
        shell: pwsh
        run: |
          $production = '6532c204226835bb5b561122a0a91efc5287e911'
          $integration = '2ad246ea0285d83fb98a44da5c2f269f1958279f'
          git merge-base --is-ancestor $production HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Validated production commit is not an ancestor of HEAD.' }
          git merge-base --is-ancestor $integration HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Integration base is not an ancestor of HEAD.' }
          $productChanges = @(git diff --name-only $production HEAD -- AgentPanelSpeaker)
          if ($productChanges.Count -ne 0) {
            throw "AgentPanelSpeaker changed after focused GREEN production commit: $($productChanges -join ', ')"
          }
          $expectedCore = '6c92799c1b14693001e8b913465f4a12b0b1e1ab'
          $actualCore = (git -C dependencies/AIConversationCore rev-parse HEAD).Trim()
          if ($actualCore -ne $expectedCore) {
            throw "Unexpected AIConversationCore submodule revision: $actualCore"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install pinned AIConversationCore dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Run pinned AIConversationCore regression tests
        shell: pwsh
        run: npm test --prefix dependencies/AIConversationCore

      - name: Validate Phase 2 fixture and baseline inventory
        shell: pwsh
        run: python dependencies/AIConversationCore/tests/validate-phase2-baseline.py

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run exact issue 73 regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & $exe --test ctrl-click-voice-pointer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify test-runner completion guard
        shell: pwsh
        run: '& tools/Invoke-TestSuite.ps1 -SelfTest'

      - name: Run complete built application suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and run complete deployed application suite
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'AgentPanelSpeaker publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          if (-not (Test-Path $exe)) {
            throw "Published application missing: $exe"
          }
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Verify bundled runtime from built output
        shell: pwsh
        run: |
          Remove-Item Env:AI_CONVERSATION_CORE -ErrorAction SilentlyContinue
          $outputTools = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\tools'
          $worker = Join-Path $outputTools 'AIConversationCore-worker.mjs'
          $marker = Join-Path $outputTools 'AIConversationCore-runtime\CORE_COMMIT'
          $package = Join-Path $outputTools 'AIConversationCore-runtime\package.json'
          if (-not (Test-Path $worker)) { throw "Built worker missing: $worker" }
          if (-not (Test-Path $marker)) { throw "Bundled core marker missing: $marker" }
          if (-not (Test-Path $package)) { throw "Bundled core package metadata missing: $package" }
          $probe = 'Bundled runtime check — café 東京 😀'
          $record = @{ type = 'user'; uuid = 'bundled-ci'; timestamp = '2026-09-05T00:00:00Z'; message = @{ role = 'user'; content = @(@{ type = 'text'; text = $probe }) } }
          $request = @{ operation = 'project'; provider = 'claude'; records = @($record) } | ConvertTo-Json -Depth 10 -Compress
          $response = $request | node $worker
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Bundled worker projection failed: $($decoded.error)" }
          if ($decoded.core_commit -ne '6c92799c1b14693001e8b913465f4a12b0b1e1ab') {
            throw "Unexpected bundled core commit: $($decoded.core_commit)"
          }
          if ($decoded.projection.units[0].block.text -ne $probe) {
            throw 'Bundled projection corrupted Unicode text.'
          }
          if ($decoded.projection.presentation.schema_version -ne 2) {
            throw 'Bundled projection returned unexpected presentation schema.'
          }
          if ($decoded.projection.presentation.split_policy -ne 'presentation-tree') {
            throw 'Bundled projection returned unexpected presentation split policy.'
          }

      - name: Build display validation harness
        shell: pwsh
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release

      - name: Verify AIConversationCore worker pin
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          $request = '{"operation":"ping"}'
          $response = $request | node tools/AIConversationCore-worker.mjs
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Worker ping failed: $($decoded.error)" }
          if ($decoded.core_commit -ne '6c92799c1b14693001e8b913465f4a12b0b1e1ab') {
            throw "Unexpected core commit: $($decoded.core_commit)"
          }

      - name: Verify structured Claude projection
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          $record = @{ type = 'user'; uuid = 'ci-user'; timestamp = '2026-09-05T00:00:00Z'; message = @{ role = 'user'; content = @(@{ type = 'text'; text = '<system-reminder>generated</system-reminder>CI projection check' }) } }
          $request = @{ operation = 'project'; provider = 'claude'; records = @($record) } | ConvertTo-Json -Depth 10 -Compress
          $response = $request | node tools/AIConversationCore-worker.mjs
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Projection failed: $($decoded.error)" }
          if ($decoded.projection.schema_version -ne 2) { throw 'Unexpected projection schema.' }
          if ($decoded.projection.units.Count -ne 1) { throw 'Expected one projected unit.' }
          if ($decoded.projection.units[0].source_record_id -ne 'ci-user') { throw 'Source identity was not preserved.' }
          if ($decoded.projection.units[0].block.text -ne 'CI projection check') { throw 'Interactive Claude cleanup was not applied.' }
          if ($decoded.projection.presentation.schema_version -ne 2) { throw 'Unexpected presentation schema.' }
          if ($decoded.projection.presentation.split_policy -ne 'presentation-tree') { throw 'Unexpected presentation split policy.' }
          if ($decoded.projection.presentation.tree.kind -ne 'conversation') { throw 'Canonical presentation tree is missing.' }

      - name: Verify structured Codex lifecycle projection
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          $userText = "context`n## My request for Codex:`nActual request"
          $records = @(
            @{ type = 'event_msg'; timestamp = '2026-09-05T00:00:00Z'; payload = @{ type = 'user_message'; message = $userText } },
            @{ type = 'event_msg'; timestamp = '2026-09-05T00:00:01Z'; payload = @{ type = 'task_complete' } }
          )
          $request = @{ operation = 'project'; provider = 'codex'; records = $records } | ConvertTo-Json -Depth 10 -Compress
          $response = $request | node tools/AIConversationCore-worker.mjs
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Projection failed: $($decoded.error)" }
          $user = $decoded.projection.events | Where-Object { $_.content_type -eq 'user_message' }
          $completion = $decoded.projection.events | Where-Object { $_.content_type -eq 'task_complete' }
          if ($user.blocks[0].text -ne $userText) { throw 'Recorded Codex IDE/request context was not preserved verbatim.' }
          if ($completion.lifecycle.timestamp -ne '2026-09-05T00:00:01Z') { throw 'Task completion timestamp was not preserved.' }

      - name: Validate canonical transcript display
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Verify clean validated candidate
        shell: pwsh
        run: |
          $generated = 'dependencies/AIConversationCore/node_modules'
          if (Test-Path $generated) {
            Remove-Item -Recurse -Force $generated
          }
          $coreStatus = @(git -C dependencies/AIConversationCore status --porcelain --untracked-files=all)
          if ($coreStatus.Count -ne 0) {
            throw "AIConversationCore submodule is dirty after generated dependency cleanup: $($coreStatus -join '; ')"
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $status = @(git status --porcelain --untracked-files=all)
          if ($status.Count -ne 0) {
            throw "Validation left an unexpected dirty worktree: $($status -join '; ')"
          }

      - name: Remove issue 73 validation scaffolding and push cleanup
        shell: pwsh
        run: |
          $temporary = @(
            '.github/workflows/issue73-class-model-red.yml',
            '.github/workflows/issue73-ctrl-click-red.yml',
            '.github/workflows/issue73-green.yml',
            '.github/workflows/issue73-final-validation.yml',
            'scripts/apply-issue73-class-model-test.py',
            'scripts/apply-issue73-fix.py',
            'scripts/apply-issue73-production.py',
            'scripts/apply-issue73-production-v2.py',
            'scripts/apply-issue73-production-v3.py',
            'scripts/apply-issue73-red.py'
          )
          foreach ($path in $temporary) {
            if (Test-Path $path) {
              Remove-Item -Force $path
            }
          }
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          $unexpected = @($changed | Where-Object { $_ -notin $temporary })
          if ($unexpected.Count -ne 0) {
            throw "Cleanup changed unexpected paths: $($unexpected -join ', ')"
          }
          $missing = @($temporary | Where-Object { $_ -notin $changed })
          if ($missing.Count -ne 0) {
            throw "Expected temporary paths were not removed: $($missing -join ', ')"
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Cleanup git diff --check failed.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clean issue 73 validation scaffolding [issue73-red-finalized] [issue73-production-green] [issue73-finalized]'
          git push origin HEAD:issue-73-ctrl-click-voice-pointer
