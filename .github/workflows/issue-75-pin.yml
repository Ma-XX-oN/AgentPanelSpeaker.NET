name: Issue 75 Core pin update

on:
  push:
    branches:
      - issue-75-core-word-id-migration
    paths:
      - '.github/workflows/issue-75-pin.yml'

permissions:
  contents: write

jobs:
  pin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update verified non-workflow Core hard pins
        shell: pwsh
        run: |
          $old = '6c92799c1b14693001e8b913465f4a12' + 'b0b1e1ab'
          $new = 'c97dc6f6a0d6e2bd6d21bc145da722645b19e002'
          $files = @(
            'AgentPanelSpeaker/AIConversationCoreClient.cs',
            'tools/AIConversationCore-runtime/CORE_COMMIT',
            'tools/AIConversationCore-worker.mjs'
          )
          foreach ($file in $files) {
            $text = [IO.File]::ReadAllText($file)
            $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
            if ($count -lt 1) { throw "Expected old Core pin in $file" }
            [IO.File]::WriteAllText(
              $file,
              $text.Replace($old, $new),
              [Text.UTF8Encoding]::new($false))
            $updated = [IO.File]::ReadAllText($file)
            if ($updated.Contains($old) -or -not $updated.Contains($new)) {
              throw "Core pin replacement failed in $file"
            }
          }

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Verify worker and submodule pins
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          $expected = 'c97dc6f6a0d6e2bd6d21bc145da722645b19e002'
          $actual = (git -C dependencies/AIConversationCore rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Unexpected Core submodule: $actual" }
          $response = '{"operation":"ping"}' | node tools/AIConversationCore-worker.mjs | ConvertFrom-Json
          if (-not $response.ok) { throw $response.error }
          if ($response.core_commit -ne $expected) {
            throw "Unexpected worker Core commit: $($response.core_commit)"
          }

      - name: Commit verified Core pins
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/AIConversationCore-worker.mjs AgentPanelSpeaker/AIConversationCoreClient.cs tools/AIConversationCore-runtime/CORE_COMMIT
          git diff --cached --check
          git commit -m 'build: align Core hard pins with word separator contract (#75)'
          git push origin HEAD:issue-75-core-word-id-migration
