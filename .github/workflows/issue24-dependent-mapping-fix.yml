name: Issue 24 dependent mapping fix

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: stage issue 24 dependent mapping fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0
      - name: Apply production fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          search_path = Path('AgentPanelSpeaker/TranscriptSearchIndex.cs')
          search = search_path.read_text(encoding='utf-8')
          old = '''  public IReadOnlyList<TranscriptRecordWordMap> GetWordMaps(\n    IEnumerable<TranscriptVirtualRecord> records)\n  {\n    var result = new List<TranscriptRecordWordMap>();\n    foreach (TranscriptVirtualRecord record in records)\n    {\n      string key = MakeKey(record.RecordNumber, record.SourceId);\n      if (_wordMaps.TryGetValue(key, out TranscriptRecordWordMap? map))\n      {\n        result.Add(map);\n      }\n    }\n    return result;\n  }'''
          new = '''  public IReadOnlyList<TranscriptRecordWordMap> GetWordMaps(\n    IEnumerable<TranscriptVirtualRecord> records)\n  {\n    var result = new List<TranscriptRecordWordMap>();\n    var emittedKeys = new HashSet<string>(StringComparer.Ordinal);\n    foreach (TranscriptVirtualRecord record in records)\n    {\n      IReadOnlyList<TranscriptVirtualIdentity> identities =\n        record.Identities.Count != 0\n          ? record.Identities\n          : new[]\n          {\n            new TranscriptVirtualIdentity(record.RecordNumber, record.SourceId)\n          };\n      foreach (TranscriptVirtualIdentity identity in identities)\n      {\n        string key = MakeKey(identity.RecordNumber, identity.SourceId);\n        if (emittedKeys.Add(key) &&\n            _wordMaps.TryGetValue(key, out TranscriptRecordWordMap? map))\n        {\n          result.Add(map);\n        }\n      }\n    }\n    return result;\n  }'''
          if old not in search:
              raise SystemExit('TranscriptSearchIndex target not found')
          search_path.write_text(search.replace(old, new, 1), encoding='utf-8')

          view_path = Path('AgentPanelSpeaker/TranscriptView.cs')
          view = view_path.read_text(encoding='utf-8')
          old_keys = '''    var keys = window.Records\n      .Select(record => record.SourceId + "\\0" + record.RecordNumber)\n      .ToHashSet(StringComparer.Ordinal);'''
          new_keys = '''    var keys = window.Records\n      .SelectMany(record => record.Identities.Count != 0\n        ? record.Identities\n        : new[]\n        {\n          new TranscriptVirtualIdentity(record.RecordNumber, record.SourceId)\n        })\n      .Select(identity => identity.SourceId + "\\0" + identity.RecordNumber)\n      .ToHashSet(StringComparer.Ordinal);'''
          count = view.count(old_keys)
          if count != 2:
              raise SystemExit(f'Expected two TranscriptView key blocks, found {count}')
          view_path.write_text(view.replace(old_keys, new_keys), encoding='utf-8')
          PY
      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add AgentPanelSpeaker/TranscriptSearchIndex.cs AgentPanelSpeaker/TranscriptView.cs
          git commit -m "fix: preserve all structural-unit playback mappings"
          git push origin HEAD:feature/aiconversationcore-integration
