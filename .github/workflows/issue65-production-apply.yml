name: Issue 65 production simplification

on:
  push:
    branches:
      - issue-65-remove-redundant-transcript-identities

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue65-applied]') }}
    runs-on: windows-2025
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply production simplification
        run: python scripts/apply-issue65-production.py

      - name: Build application
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run issue 65 permanent regressions
        run: AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe --test redundancy

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit verified production changes
        shell: pwsh
        run: |
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add AgentPanelSpeaker
          if (git diff --cached --quiet) {
            throw "Issue #65 helper produced no production/test changes."
          }
          git commit -m "fix: remove redundant transcript identity layers (#65) [issue65-applied]"
          git push origin HEAD:issue-65-remove-redundant-transcript-identities
