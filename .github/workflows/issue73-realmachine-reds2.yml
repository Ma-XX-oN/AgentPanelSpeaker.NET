name: Issue 73 Real-machine REDs 2

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer

permissions:
  contents: write

jobs:
  red:
    if: ${{ contains(github.event.head_commit.message, '[issue73-realmachine-reds2]') }}
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply exact real-machine regressions
        shell: pwsh
        run: |
          python scripts/apply-issue73-realmachine-reds.py
          python scripts/fix-issue73-realmachine-red-nullable.py

      - name: Verify RED diff scope
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'RED git diff --check failed.' }
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) } | Sort-Object)
          $expected = @(
            'AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs',
            'AgentPanelSpeaker/Issue73CtrlClickVoicePointerRegressionTestRunner.cs'
          )
          if (($changed -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected RED changes: $($changed -join ', ')"
          }

      - name: Build RED candidate
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Prove both exact regressions RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          function Invoke-ExpectedRed([string]$suite, [string]$expectedFailure) {
            $stdout = Join-Path $env:RUNNER_TEMP ($suite + '-stdout.txt')
            $stderr = Join-Path $env:RUNNER_TEMP ($suite + '-stderr.txt')
            $process = Start-Process -FilePath $exe -ArgumentList @('--test', $suite) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $text = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
            Write-Host $text
            if ($process.ExitCode -eq 0) {
              throw "$suite unexpectedly passed before production repair."
            }
            $failures = @($text -split "`r?`n" | Where-Object { $_ -match '^FAIL  ' })
            if ($failures.Count -ne 1 -or $failures[0] -notmatch [regex]::Escape($expectedFailure)) {
              throw "Expected only $expectedFailure to fail in $suite; got: $($failures -join '; ')"
            }
          }
          Invoke-ExpectedRed 'ctrl-click-voice-pointer' 'punctuation-rich-browser-coordinate-matches-speech-history'
          Invoke-ExpectedRed 'user-context-speech' 'user-context-speech/live-monitor-toggle'

      - name: Permanently record REDs
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs AgentPanelSpeaker/Issue73CtrlClickVoicePointerRegressionTestRunner.cs
          git commit -m 'test: reproduce wrong Ctrl-click target and stale User Context cursor (#73) [issue73-realmachine-reds-recorded]'
          git push origin HEAD:issue-73-ctrl-click-voice-pointer
