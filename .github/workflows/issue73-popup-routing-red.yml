name: Issue 73 popup routing RED

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer

permissions:
  contents: write

jobs:
  red:
    if: ${{ contains(github.event.head_commit.message, '[issue73-popup-routing-red]') }}
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Stage popup routing regression
        shell: pwsh
        run: python scripts/apply-issue73-popup-routing-red.py
      - name: Verify RED diff scope
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Popup RED diff check failed.' }
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          if ($changed.Count -ne 1 -or $changed[0] -ne 'AgentPanelSpeaker/Issue73CtrlClickVoicePointerRegressionTestRunner.cs') {
            throw "Unexpected popup RED scope: $($changed -join ', ')"
          }
      - name: Build Release
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
      - name: Prove popup routing RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'ctrl-popup-red.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'ctrl-popup-red.err.txt'
          $p = Start-Process -FilePath $exe -ArgumentList @('--test','ctrl-click-voice-pointer') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $text = ((Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          Write-Host $text
          if ($p.ExitCode -eq 0) { throw 'Popup routing unexpectedly GREEN before production fix.' }
          $passes = ([regex]::Matches($text, '(?m)^PASS  ctrl-click-voice-pointer/')).Count
          if ($passes -ne 4 -or $text -notmatch 'FAIL: 4/8 issue #73 Ctrl\+click tests failed\.') {
            throw "Popup routing RED changed prior test state; passes=$passes."
          }
          foreach ($name in @(
            'owned-popup-focus-preserves-held-ctrl',
            'owned-popup-root-routes-ctrl-messages',
            'spoken-md-markup-split-token-is-selectable',
            'spoken-quoted-markup-split-token-is-selectable')) {
            if ($text -notmatch [regex]::Escape("FAIL  ctrl-click-voice-pointer/$name")) {
              throw "Expected #73 RED did not fail: $name"
            }
          }
      - name: Commit permanent popup routing RED
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue73CtrlClickVoicePointerRegressionTestRunner.cs
          git commit -m 'test: reproduce owned-popup Ctrl routing failure (#73) [issue73-popup-routing-red-recorded]'
          git push origin HEAD:issue-73-ctrl-click-voice-pointer
