name: Issue 23 user context HTML parity

on:
  push:
    branches:
      - feature/aiconversationcore-integration
    paths:
      - .github/workflows/issue23-user-context-html.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: windows-latest
    steps:
      - name: Check out feature branch and submodules
        uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure git identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Repin AIConversationCore and bundled runtime
        shell: pwsh
        run: |
          $old = '5f85e5e3d8ea6c7d2937b4606034101ce57fa935'
          $new = '54a70c2989de0c02f03b28a2f8d8c6986b974141'
          git -C dependencies/AIConversationCore fetch origin $new
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch target AIConversationCore revision.' }
          git -C dependencies/AIConversationCore checkout $new
          if ($LASTEXITCODE -ne 0) { throw 'Failed to check out target AIConversationCore revision.' }

          $paths = @(
            'AgentPanelSpeaker/AIConversationCoreClient.cs',
            'tools/AIConversationCore-worker.mjs',
            '.github/workflows/core-integration-validation.yml'
          )
          foreach ($path in $paths) {
            $text = Get-Content $path -Raw
            if (-not $text.Contains($old)) { throw "Expected old core SHA not found in $path" }
            Set-Content $path ($text.Replace($old, $new)) -NoNewline
          }

          if (Test-Path 'tools/AIConversationCore-runtime/src') {
            Remove-Item 'tools/AIConversationCore-runtime/src' -Recurse -Force
          }
          Copy-Item 'dependencies/AIConversationCore/src' 'tools/AIConversationCore-runtime/src' -Recurse
          Copy-Item 'dependencies/AIConversationCore/package.json' 'tools/AIConversationCore-runtime/package.json' -Force
          Set-Content 'tools/AIConversationCore-runtime/CORE_COMMIT' $new -NoNewline

      - name: Add HTML rendering and paired Markdown/HTML regression
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          formatter = Path('AgentPanelSpeaker/TranscriptPresentationHtmlFormatter.cs')
          text = formatter.read_text()
          old = '''      case "attachments":
                EmitAnchors(output, node, emittedSourceIndexes);
                RenderAttachments(output, node);
                break;
              case "reasoning":'''
          new = '''      case "attachments":
                EmitAnchors(output, node, emittedSourceIndexes);
                RenderAttachments(output, node);
                break;
              case "user_context":
                EmitAnchors(output, node, emittedSourceIndexes);
                RenderUserContext(output, node, pipeline);
                break;
              case "reasoning":'''
          if old not in text:
            raise SystemExit('RenderNode attachment anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''  private static void RenderAttachments(StringBuilder output, JsonElement node)
            {
              output.AppendLine("<div class=\\"attachments\\">");'''
          method = '''  /// <summary>
            /// Renders semantic User context as a nested blockquote/details disclosure.
            /// The surrounding User turn owns its normal outer body container; this
            /// additional quote level identifies context separately from the actual prompt.
            /// </summary>
            private static void RenderUserContext(
              StringBuilder output,
              JsonElement node,
              MarkdownPipeline pipeline)
            {
              output.AppendLine("<blockquote class=\\"user-context\\">");
              if (node.TryGetProperty("blocks", out JsonElement blocks) &&
                  blocks.ValueKind == JsonValueKind.Array)
              {
                foreach (JsonElement block in blocks.EnumerateArray())
                {
                  string summary = GetString(block, "summary");
                  if (string.IsNullOrWhiteSpace(summary))
                  {
                    summary = "# Context from my IDE setup:";
                  }
                  output.Append("<details class=\\"user-context-details\\" data-presentation-id=\\"")
                    .Append(Html(GetString(node, "id")))
                    .AppendLine("\\">");
                  output.Append("<summary>")
                    .Append(Html(summary))
                    .AppendLine("</summary>");
                  string body = GetString(block, "text");
                  if (!string.IsNullOrWhiteSpace(body))
                  {
                    output.Append(Markdown.ToHtml(body, pipeline));
                  }
                  output.AppendLine("</details>");
                }
              }
              output.AppendLine("</blockquote>");
            }

          ''' + anchor
          if anchor not in text:
            raise SystemExit('RenderAttachments anchor not found')
          formatter.write_text(text.replace(anchor, method, 1))

          runner = Path('AgentPanelSpeaker/CoreRegressionTestRunner.cs')
          text = runner.read_text()
          if not text.startswith('using System.Text.Json;'):
            raise SystemExit('Unexpected CoreRegressionTestRunner header')
          text = text.replace('using System.Text.Json;\n', 'using Markdig;\nusing System.Text.Json;\n', 1)
          old = '''      ("core/codex-revision-opt-in", TestCodexRevisionOptIn),
                ("core/codex-commentary-inside-reasoning-group",'''
          new = '''      ("core/codex-revision-opt-in", TestCodexRevisionOptIn),
                ("core/codex-user-context-markdown-html-parity", TestCodexUserContextMarkdownHtmlParity),
                ("core/codex-commentary-inside-reasoning-group",'''
          if old not in text:
            raise SystemExit('Core regression tuple anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''  /// <summary>
            /// Verifies the exact consumer boundary for Codex thought commentary: visible
          '''
          test_method = r'''  /// <summary>
            /// Verifies that one Codex IDE-context source record produces equivalent
            /// canonical Markdown and direct structural HTML: context is isolated in a
            /// quoted details disclosure, the request marker is removed, and the real
            /// prompt follows outside that disclosure. Also verifies the no-context case.
            /// </summary>
            private static void TestCodexUserContextMarkdownHtmlParity()
            {
              const string prompt = "I'm doing some testing. What time is it in Paris?";
              const string sourceMessage =
                "# Context from my IDE setup:\n\n" +
                "## Active file: sessions/example.jsonl\n\n" +
                "## Active selection of the file:\n" +
                " the repo instructions and the current transcript script first\n" +
                "## Open tabs:\n" +
                "- example.jsonl: sessions/example.jsonl\n\n" +
                "## My request for Codex:\n" +
                prompt;

              string record = JsonSerializer.Serialize(new
              {
                type = "event_msg",
                timestamp = "2026-09-06T15:17:11.000Z",
                payload = new { type = "user_message", message = sourceMessage }
              });

              using var client = new AIConversationCoreClient();
              AIConversationProjection projection = client.Project(
                AgentSource.Codex,
                new[] { record });
              string markdown = projection.Markdown;

              Require(markdown.Contains(
                  "> <details><summary># Context from my IDE setup:</summary>",
                  StringComparison.Ordinal),
                "Canonical Markdown omitted the blockquoted IDE-context details disclosure.");
              Require(!markdown.Contains("## My request for Codex:", StringComparison.Ordinal),
                "Codex request marker leaked into canonical Markdown.");
              int markdownContext = markdown.IndexOf(
                "> <details><summary># Context from my IDE setup:</summary>",
                StringComparison.Ordinal);
              int markdownContextEnd = markdown.IndexOf(
                "> </details>",
                markdownContext,
                StringComparison.Ordinal);
              int markdownPrompt = markdown.IndexOf(prompt, StringComparison.Ordinal);
              Require(markdownContext >= 0 && markdownContextEnd > markdownContext &&
                      markdownPrompt > markdownContextEnd,
                "Canonical Markdown did not place the real prompt after/outside context details.");
              Require(markdown.IndexOf("## Active file:", StringComparison.Ordinal) <
                      markdown.IndexOf("## Active selection of the file:", StringComparison.Ordinal) &&
                      markdown.IndexOf("## Active selection of the file:", StringComparison.Ordinal) <
                      markdown.IndexOf("## Open tabs:", StringComparison.Ordinal),
                "Canonical Markdown changed IDE-context section order.");

              string root = Path.Combine(
                Path.GetTempPath(),
                $"AgentPanelSpeaker-user-context-{Guid.NewGuid():N}");
              Directory.CreateDirectory(root);
              try
              {
                string path = Path.Combine(root, "context.jsonl");
                File.WriteAllText(path, record + Environment.NewLine);
                var pipeline = new MarkdownPipelineBuilder().Build();
                string html = TranscriptPresentationHtmlFormatter.Format(
                  path,
                  AgentSource.Codex,
                  pipeline);

                Require(html.Contains("<blockquote class=\"user-context\">", StringComparison.Ordinal),
                  "Direct HTML omitted the nested User-context blockquote.");
                Require(html.Contains("<details class=\"user-context-details\"", StringComparison.Ordinal),
                  "Direct HTML omitted the User-context details disclosure.");
                Require(html.Contains(
                    "<summary># Context from my IDE setup:</summary>",
                    StringComparison.Ordinal),
                  "Direct HTML changed the User-context summary.");
                Require(!html.Contains("## My request for Codex:", StringComparison.Ordinal),
                  "Codex request marker leaked into direct HTML.");
                int htmlContext = html.IndexOf(
                  "<details class=\"user-context-details\"",
                  StringComparison.Ordinal);
                int htmlContextEnd = html.IndexOf(
                  "</details>",
                  htmlContext,
                  StringComparison.Ordinal);
                int htmlQuoteEnd = html.IndexOf(
                  "</blockquote>",
                  htmlContextEnd,
                  StringComparison.Ordinal);
                int htmlPrompt = html.IndexOf(prompt, StringComparison.Ordinal);
                Require(htmlContext >= 0 && htmlContextEnd > htmlContext &&
                        htmlQuoteEnd > htmlContextEnd && htmlPrompt > htmlQuoteEnd,
                  "Direct HTML did not place the real prompt after/outside context disclosure.");
                Require(html.IndexOf("Active file:", StringComparison.Ordinal) <
                        html.IndexOf("Active selection of the file:", StringComparison.Ordinal) &&
                        html.IndexOf("Active selection of the file:", StringComparison.Ordinal) <
                        html.IndexOf("Open tabs:", StringComparison.Ordinal),
                  "Direct HTML changed IDE-context section order.");

                string plainRecord = JsonSerializer.Serialize(new
                {
                  type = "event_msg",
                  timestamp = "2026-09-06T15:18:00.000Z",
                  payload = new { type = "user_message", message = "Plain user prompt." }
                });
                string plainPath = Path.Combine(root, "plain.jsonl");
                File.WriteAllText(plainPath, plainRecord + Environment.NewLine);
                string plainHtml = TranscriptPresentationHtmlFormatter.Format(
                  plainPath,
                  AgentSource.Codex,
                  pipeline);
                Require(!plainHtml.Contains("user-context", StringComparison.Ordinal),
                  "No-context Codex User message emitted a context disclosure.");
              }
              finally
              {
                Directory.Delete(root, recursive: true);
              }
            }

          ''' + anchor
          if anchor not in text:
            raise SystemExit('Commentary test anchor not found')
          runner.write_text(text.replace(anchor, test_method, 1))
          '@ | python -

      - name: Prove the regression and implementation together
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test
          if ($LASTEXITCODE -ne 0) { throw 'Regression suite failed.' }

      - name: Run pinned AIConversationCore tests
        shell: pwsh
        run: npm test --prefix dependencies/AIConversationCore

      - name: Run core integrity and golden gates
        shell: pwsh
        run: |
          python dependencies/AIConversationCore/tests/validate-phase2-baseline.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2 baseline validation failed.' }
          python dependencies/AIConversationCore/tests/validate-canonical-golden.py
          if ($LASTEXITCODE -ne 0) { throw 'ChatGPT golden validation failed.' }
          python dependencies/AIConversationCore/tests/validate-claude-canonical-golden.py
          if ($LASTEXITCODE -ne 0) { throw 'Claude golden validation failed.' }
          python dependencies/AIConversationCore/tests/validate-codex-canonical-golden.py
          if ($LASTEXITCODE -ne 0) { throw 'Codex golden validation failed.' }

      - name: Build and run DisplayParity
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'DisplayParity build failed.' }
          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'DisplayParity validation failed.' }

      - name: Publish and retest deployed application
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-issue23-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          Push-Location $publish
          try {
            & .\AgentPanelSpeaker.exe --test
            if ($LASTEXITCODE -ne 0) { throw 'Published regression suite failed.' }
          }
          finally {
            Pop-Location
          }

      - name: Verify exact core pin everywhere
        shell: pwsh
        run: |
          $expected = '54a70c2989de0c02f03b28a2f8d8c6986b974141'
          $submodule = (git -C dependencies/AIConversationCore rev-parse HEAD).Trim()
          $marker = (Get-Content tools/AIConversationCore-runtime/CORE_COMMIT -Raw).Trim()
          if ($submodule -ne $expected) { throw "Submodule pin mismatch: $submodule" }
          if ($marker -ne $expected) { throw "Runtime marker mismatch: $marker" }
          $client = Get-Content AgentPanelSpeaker/AIConversationCoreClient.cs -Raw
          $worker = Get-Content tools/AIConversationCore-worker.mjs -Raw
          if (-not $client.Contains($expected)) { throw 'C# expected core pin mismatch.' }
          if (-not $worker.Contains($expected)) { throw 'Worker expected core pin mismatch.' }

      - name: Check whitespace and commit
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          git add dependencies/AIConversationCore `
            AgentPanelSpeaker/AIConversationCoreClient.cs `
            AgentPanelSpeaker/TranscriptPresentationHtmlFormatter.cs `
            AgentPanelSpeaker/CoreRegressionTestRunner.cs `
            tools/AIConversationCore-worker.mjs `
            tools/AIConversationCore-runtime `
            .github/workflows/core-integration-validation.yml
          git commit -m "fix: render Codex user context in HTML"
          git push origin HEAD:feature/aiconversationcore-integration
