name: Issue 37 fix once

on:
  push:
    branches:
      - issue-37-large-transcript-windowing
    paths:
      - '.github/workflows/issue-37-fix-once.yml'
      - 'scripts/issue-37-apply-fix.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-37-large-transcript-windowing
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply production fix
        shell: pwsh
        run: python scripts/issue-37-apply-fix.py

      - name: Remove one-shot scaffolding and commit
        shell: pwsh
        run: |
          Remove-Item scripts/issue-37-apply-fix.py
          Remove-Item .github/workflows/issue-37-fix-once.yml
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add -A
          git commit -m 'fix: window initial large transcript presentation'
          git push origin HEAD:issue-37-large-transcript-windowing

      - name: Install pinned AIConversationCore dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Run pinned AIConversationCore regression tests
        shell: pwsh
        run: npm test --prefix dependencies/AIConversationCore

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require issue 37 regression GREEN
        shell: pwsh
        run: dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test large-transcript-windowing

      - name: Run full built-in AgentPanelSpeaker regression suite
        shell: pwsh
        run: dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test

      - name: Publish and test deployed application
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'AgentPanelSpeaker publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          if (-not (Test-Path $exe)) { throw "Published application missing: $exe" }
          Push-Location $publish
          try {
            & $exe --test
            if ($LASTEXITCODE -ne 0) { throw 'Published regression suite failed.' }
          }
          finally {
            Pop-Location
          }

      - name: Verify bundled Core runtime
        shell: pwsh
        run: |
          Remove-Item Env:AI_CONVERSATION_CORE -ErrorAction SilentlyContinue
          $tools = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\tools'
          $worker = Join-Path $tools 'AIConversationCore-worker.mjs'
          $marker = Join-Path $tools 'AIConversationCore-runtime\CORE_COMMIT'
          if (-not (Test-Path $worker)) { throw "Built worker missing: $worker" }
          if (-not (Test-Path $marker)) { throw "Bundled core marker missing: $marker" }
          $expected = '7eb7f4fca630aa0a132e93799e878120aaf353b9'
          $actual = (Get-Content $marker -Raw).Trim()
          if ($actual -ne $expected) { throw "Unexpected bundled Core revision: $actual" }

      - name: Build display validation harness
        shell: pwsh
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release

      - name: Validate canonical transcript display
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Validate whitespace and patch integrity
        shell: pwsh
        run: |
          git fetch origin feature/aiconversationcore-integration --depth=1
          git diff --check FETCH_HEAD HEAD
