name: Issue 30 live-end fix

on:
  push:
    branches:
      - feature/aiconversationcore-integration
    paths:
      - .github/workflows/issue-30-live-end-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply minimal completion-state fix
        shell: pwsh
        run: |
          $path = 'AgentPanelSpeaker/SpeechService.cs'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $anchor = '      bool remainPaused = wasPaused || restorePause;'
          $anchorIndex = $text.IndexOf($anchor)
          if ($anchorIndex -lt 0) { throw 'EngineCompleted remainPaused anchor not found.' }
          $pauseLine = '        SetPausedLocked(true);'
          $pauseIndex = $text.IndexOf($pauseLine, $anchorIndex)
          if ($pauseIndex -lt 0) { throw 'EngineCompleted pause line not found.' }
          $elseIndex = $text.IndexOf("`n      else", $pauseIndex)
          if ($elseIndex -lt 0) { throw 'EngineCompleted else branch not found.' }
          $insert = "`n        if (_pendingHistoryIndex is null &&`n            _nextHistoryIndex >= _history.Count)`n        {`n          ReportPlaybackPositionLocked(`n            TranscriptPlaybackState.PausedAtLiveEnd);`n        }"
          $insertIndex = $pauseIndex + $pauseLine.Length
          if ($insertIndex -gt $elseIndex) { throw 'Insertion point escaped remainPaused branch.' }
          $updated = $text.Insert($insertIndex, $insert)
          Set-Content -Path $path -Value $updated -Encoding utf8NoBOM -NoNewline
          git diff --check
          git diff -- AgentPanelSpeaker/SpeechService.cs

      - name: Build
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require issue 30 regression GREEN
        shell: pwsh
        run: dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test live-end

      - name: Run full built-in regression suite
        shell: pwsh
        run: dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test

      - name: Commit production fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/SpeechService.cs
          git diff --cached --check
          git commit -m 'fix: publish paused live-end state after skip'
          git push origin HEAD:feature/aiconversationcore-integration
