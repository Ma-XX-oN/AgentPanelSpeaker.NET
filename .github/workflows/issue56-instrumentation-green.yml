name: Issue 56 window instrumentation GREEN

on:
  push:
    branches:
      - issue-56-scroll-replacement-user-intent

permissions:
  contents: write

jobs:
  green:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply guarded production instrumentation
        shell: pwsh
        run: python scripts/apply-issue56-window-instrumentation.py

      - name: Build before committing production
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run exact issue 56 real-session suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite real-session-fixes

      - name: Run startup progress suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite startup-progress

      - name: Run startup performance suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite startup-performance

      - name: Commit verified production instrumentation
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AgentPanelSpeaker/TranscriptView.cs
          git commit -m "diag: instrument virtual-window replacement phases (#56) [skip ci]"
          git push origin HEAD:issue-56-scroll-replacement-user-intent

      - name: Verify AIConversationCore pin
        shell: pwsh
        run: |
          $expected = '6c92799c1b14693001e8b913465f4a12b0b1e1ab'
          $actual = git -C dependencies/AIConversationCore rev-parse HEAD
          if ($actual.Trim() -ne $expected) { throw "Unexpected AIConversationCore submodule revision: $actual" }

      - name: Install pinned AIConversationCore dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Run AIConversationCore regression tests
        shell: pwsh
        run: npm test --prefix dependencies/AIConversationCore

      - name: Validate Phase 2 baseline
        shell: pwsh
        run: python dependencies/AIConversationCore/tests/validate-phase2-baseline.py

      - name: Verify test-runner completion guard
        shell: pwsh
        run: '& tools/Invoke-TestSuite.ps1 -SelfTest'

      - name: Run built full regression suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and run deployed full suite
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'AgentPanelSpeaker publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          if (-not (Test-Path $exe)) { throw "Published application missing: $exe" }
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Build display validation harness
        shell: pwsh
        run: dotnet build tools/DisplayParity/DisplayParity.csproj --configuration Release

      - name: Validate canonical transcript display
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'tools\DisplayParity\bin\Release\net10.0-windows10.0.22621.0\DisplayParity.exe'
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Display parity validation failed.' }

      - name: Validate whitespace
        shell: pwsh
        run: git diff --check HEAD^
