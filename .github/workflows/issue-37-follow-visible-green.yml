name: Issue 37 Follow-OFF and visible-range GREEN

on:
  push:
    branches:
      - issue-37-visible-range-red
    paths:
      - '.github/workflows/issue-37-follow-visible-green.yml'
      - 'tools/apply_issue37_follow_visible_fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  green:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Apply production fixes
        shell: pwsh
        run: |
          python tools/apply_issue37_follow_visible_fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          $changed = @(git diff --name-only)
          $expected = @(
            'AgentPanelSpeaker/TranscriptView.cs',
            'AgentPanelSpeaker/TranscriptVirtualDocument.cs'
          )
          foreach ($path in $changed) {
            if ($path -notin $expected) {
              throw "Unexpected production patch path: $path"
            }
          }
          foreach ($path in $expected) {
            if ($path -notin $changed) {
              throw "Expected production patch path was unchanged: $path"
            }
          }

      - name: Build Release
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run exact virtual-window regressions GREEN
        shell: pwsh
        timeout-minutes: 10
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          ./tools/Invoke-TestSuite.ps1 -Executable $exe -Suite virtual-window

      - name: Run Core regressions
        shell: pwsh
        timeout-minutes: 8
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          ./tools/Invoke-TestSuite.ps1 -Executable $exe -Suite core

      - name: Run rolled-back visibility regressions
        shell: pwsh
        timeout-minutes: 8
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          ./tools/Invoke-TestSuite.ps1 -Executable $exe -Suite rolled-back-visibility

      - name: Run independent output oracle
        shell: pwsh
        timeout-minutes: 8
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          ./tools/Invoke-TestSuite.ps1 -Executable $exe -Suite output-oracle

      - name: Run word-materialization regressions
        shell: pwsh
        timeout-minutes: 8
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          ./tools/Invoke-TestSuite.ps1 -Executable $exe -Suite word-materialization

      - name: Verify Core pin and patch integrity
        shell: pwsh
        run: |
          $expectedCore = '6c92799c1b14693001e8b913465f4a12b0b1e1ab'
          $submoduleCore = (git -C dependencies/AIConversationCore rev-parse HEAD).Trim()
          $runtimeCore = (Get-Content tools/AIConversationCore-runtime/CORE_COMMIT -Raw).Trim()
          if ($submoduleCore -cne $expectedCore) {
            throw "Core submodule pin mismatch: $submoduleCore"
          }
          if ($runtimeCore -cne $expectedCore) {
            throw "Runtime Core pin mismatch: $runtimeCore"
          }
          git diff --check

      - name: Commit verified production implementation
        shell: pwsh
        run: |
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/TranscriptView.cs AgentPanelSpeaker/TranscriptVirtualDocument.cs
          if (git diff --cached --quiet) { throw 'No verified production changes to commit.' }
          git commit -m 'fix: preserve visible units and honour Follow OFF (#37) [skip ci]'
          git push origin HEAD:issue-37-visible-range-red
