name: Patch issue 24 structural mapping regression

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0
          submodules: recursive
      - name: Apply test-only patch
        shell: pwsh
        run: python .github/scripts/issue24_structural_mapping_patch.py
      - name: Commit test-only change and cleanup helpers
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-24-structural-mapping-patch.yml
          git rm .github/scripts/issue24_structural_mapping_patch.py
          git add AgentPanelSpeaker/Issue24SpeechOrdinalRegressionTestRunner.cs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "test: require all structural record mappings"
          git push origin HEAD:feature/aiconversationcore-integration
