name: Structure instrumentation

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  instrument:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply structural instrumentation
        shell: pwsh
        run: python scripts/apply-structure-instrumentation.py
      - name: Build instrumentation
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release
      - name: Commit instrumentation
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AgentPanelSpeaker/TranscriptView.cs AgentPanelSpeaker/TranscriptPresentationHtmlFormatter.cs scripts/apply-direct-presentation-migration.py
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "instrument structural rendering boundaries"
          git push
