name: Issue 75 Core speech word ranges

on:
  push:
    branches:
      - issue-75-core-word-id-migration
    paths:
      - '.github/workflows/issue-75-production-wordids.yml'
      - 'tools/issue75-speech-word-ranges.py'

permissions:
  contents: write

jobs:
  production:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply Core speech word ranges
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'tools/issue75-speech-word-ranges.py'
          $text = [IO.File]::ReadAllText($path)
          $old = "paused_end = '''  /// <summary>\n  /// Returns the current navigation anchor.\n'''"
          $new = "paused_end = '''  /// <summary>\n  /// Cancels the active prompt or starts a pending request immediately.\n'''"
          if (-not $text.Contains($old)) {
            throw 'Expected stale paused_end marker was not found.'
          }
          [IO.File]::WriteAllText(
            $path,
            $text.Replace($old, $new),
            [Text.UTF8Encoding]::new($false))
          python tools/issue75-speech-word-ranges.py

          $testPath = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker/Issue75CoreWordIdMigrationRegressionTestRunner.cs'
          $testText = [IO.File]::ReadAllText($testPath)
          $usingOld = "using System.Text.Json;`n"
          $usingNew = "using System.Text.Json;`nusing System.Text.RegularExpressions;`n"
          if (-not $testText.Contains($usingOld)) {
            throw 'Expected Issue75 test using anchor was not found.'
          }
          [IO.File]::WriteAllText(
            $testPath,
            $testText.Replace($usingOld, $usingNew),
            [Text.UTF8Encoding]::new($false))

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Verify issue 75 transition
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $log = Join-Path $env:RUNNER_TEMP 'issue75-speech-word-ranges.log'
          $threw = $false
          try {
            & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite core-word-id-migration *> $log
          }
          catch {
            $threw = $true
          }
          $text = Get-Content -Raw $log
          Write-Host $text
          if (-not $threw) { throw 'Expected three remaining #75 REDs.' }
          if (-not $text.Contains('PASS  core-word-id/ordered-list-history-preserves-core-word-boundaries')) {
            throw 'Ordered-list Core boundary regression did not turn GREEN.'
          }
          $remaining = @(
            'FAIL  core-word-id/ctrl-click-posts-exact-canonical-word-id',
            'FAIL  core-word-id/speech-seek-uses-only-canonical-word-id',
            'FAIL  core-word-id/policy-is-centralized-without-per-word-eligibility-mutation'
          )
          foreach ($line in $remaining) {
            if (-not $text.Contains($line)) { throw "Missing intended remaining RED: $line" }
          }
          if ($text.Contains('FAIL  core-word-id/ordered-list-history-preserves-core-word-boundaries')) {
            throw 'Ordered-list Core boundary regression is still RED.'
          }
          if (-not $text.Contains('FAIL: 3/12 issue #75 regressions failed.')) {
            throw 'Unexpected #75 focused failure count.'
          }

      - name: Verify speech ordinal regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite speech-ordinals

      - name: Commit verified speech word ranges
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/SpeechFragment.cs AgentPanelSpeaker/JsonlSessionMonitor.cs AgentPanelSpeaker/SpeechService.cs AgentPanelSpeaker/Issue75CoreWordIdMigrationRegressionTestRunner.cs
          git diff --cached --check
          git commit -m 'feat: map speech boundaries to Core word ranges (#75)'
          git push origin HEAD:issue-75-core-word-id-migration
