name: Issue 75 Core word-id interaction boundary

on:
  push:
    branches:
      - issue-75-core-word-id-migration
    paths:
      - '.github/workflows/issue-75-production-wordids.yml'
      - 'tools/issue75-word-id-boundary.py'
      - 'tools/issue75-word-id-boundary-tests.py'

permissions:
  contents: write

jobs:
  production:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply Core word-id interaction boundary
        shell: pwsh
        run: |
          python tools/issue75-word-id-boundary.py
          python tools/issue75-word-id-boundary-tests.py

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Verify issue 75 transition
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $log = Join-Path $env:RUNNER_TEMP 'issue75-word-id-boundary.log'
          $threw = $false
          try {
            & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite core-word-id-migration *> $log
          }
          catch {
            $threw = $true
          }
          $text = Get-Content -Raw $log
          Write-Host $text
          if (-not $threw) { throw 'Expected only the policy RED to remain.' }
          $requiredGreen = @(
            'PASS  core-word-id/ctrl-click-posts-exact-canonical-word-id',
            'PASS  core-word-id/speech-seek-uses-only-canonical-word-id',
            'PASS  core-word-id/ordered-list-history-preserves-core-word-boundaries'
          )
          foreach ($line in $requiredGreen) {
            if (-not $text.Contains($line)) { throw "Required #75 transition did not turn GREEN: $line" }
          }
          if (-not $text.Contains('FAIL  core-word-id/policy-is-centralized-without-per-word-eligibility-mutation')) {
            throw 'The expected policy-only RED was not present.'
          }
          if (-not $text.Contains('FAIL: 1/12 issue #75 regressions failed.')) {
            throw 'Unexpected #75 focused failure count.'
          }

      - name: Verify speech ordinal regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite speech-ordinals

      - name: Verify User Context regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite user-context-speech

      - name: Verify Find origin regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite find-origin

      - name: Verify independent oracle regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite independent-oracles

      - name: Verify Ctrl-click regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite ctrl-click-voice-pointer

      - name: Commit verified Core word-id boundary
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/FindSeekRequestedEventArgs.cs AgentPanelSpeaker/MainForm.cs AgentPanelSpeaker/SpeechService.cs AgentPanelSpeaker/TranscriptView.cs AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs AgentPanelSpeaker/Issue46IndependentRegressionOracleTestRunner.cs AgentPanelSpeaker/Issue73CtrlClickVoicePointerRegressionTestRunner.cs
          git diff --cached --check
          git commit -m 'feat: use Core word IDs for transcript seeking (#75)'
          git push origin HEAD:issue-75-core-word-id-migration
