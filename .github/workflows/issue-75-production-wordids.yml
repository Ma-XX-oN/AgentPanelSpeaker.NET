name: Issue 75 production Core word boundaries

on:
  push:
    branches:
      - issue-75-core-word-id-migration
    paths:
      - '.github/workflows/issue-75-production-wordids.yml'
      - 'tools/issue75-production-wordids.py'

permissions:
  contents: write

jobs:
  production:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply Core-boundary history propagation
        shell: pwsh
        run: python tools/issue75-production-wordids.py

      - name: Keep User Context parity test segmentation-neutral
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker/Issue24ProductionPathRegressionTestRunner.cs'
          $text = [IO.File]::ReadAllText($path)
          $old = 'string.Equals(fragment.Text, nestedFragment, StringComparison.Ordinal)'
          $new = 'fragment.Text.Contains("Nested numbered item with a table inside it", StringComparison.Ordinal)'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) {
            throw "Expected one raw-Markdown speech-fragment lookup, found $count"
          }
          [IO.File]::WriteAllText(
            $path,
            $text.Replace($old, $new),
            [Text.UTF8Encoding]::new($false))

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Verify issue 75 transition
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $log = Join-Path $env:RUNNER_TEMP 'issue75-production-wordids.log'
          $threw = $false
          try {
            & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite core-word-id-migration *> $log
          }
          catch {
            $threw = $true
          }
          $text = Get-Content -Raw $log
          Write-Host $text
          if (-not $threw) { throw 'Expected remaining #75 REDs.' }
          if (-not $text.Contains('PASS  core-word-id/production-history-carries-core-word-ids')) {
            throw 'Ordinary production history Core IDs did not turn GREEN.'
          }
          if (-not $text.Contains('FAIL  core-word-id/ordered-list-history-preserves-core-word-boundaries')) {
            throw 'Ordered-list boundary regression unexpectedly disappeared.'
          }
          if (-not $text.Contains('Seeking the ordered-list body word did not land on Item.')) {
            throw 'Ordered-list RED did not advance to the speech-boundary defect.'
          }
          $remaining = @(
            'FAIL  core-word-id/ctrl-click-posts-exact-canonical-word-id',
            'FAIL  core-word-id/speech-seek-uses-only-canonical-word-id',
            'FAIL  core-word-id/ordered-list-history-preserves-core-word-boundaries',
            'FAIL  core-word-id/policy-is-centralized-without-per-word-eligibility-mutation'
          )
          foreach ($line in $remaining) {
            if (-not $text.Contains($line)) { throw "Missing intended remaining RED: $line" }
          }
          if (-not $text.Contains('FAIL: 4/12 issue #75 regressions failed.')) {
            throw 'Unexpected #75 focused failure count.'
          }

      - name: Verify speech ordinal regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite speech-ordinals

      - name: Commit verified Core-boundary propagation
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/ExtractionOptions.cs AgentPanelSpeaker/CanonicalProjectionExtractor.cs AgentPanelSpeaker/JsonlSessionMonitor.cs AgentPanelSpeaker/Issue24ProductionPathRegressionTestRunner.cs
          git diff --cached --check
          git commit -m 'feat: propagate Core word boundaries into history (#75)'
          git push origin HEAD:issue-75-core-word-id-migration
