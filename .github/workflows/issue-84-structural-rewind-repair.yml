name: Issue 84 structural rewind repair

on:
  push:
    branches:
      - issue-75-core-word-id-migration

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: issue-75-core-word-id-migration
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install permanent issue 84 regressions only
        shell: pwsh
        run: python tools/issue84-structural-rewind-repair.py test

      - name: Build test-only RED candidate
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Prove structural and grace-window regressions RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $output = (& $exe --test rewind-current-fragment 2>&1 | Out-String)
          $status = $LASTEXITCODE
          Write-Host $output
          if ($status -eq 0) {
            throw 'Issue #84 regressions unexpectedly passed before production repair.'
          }
          if (-not $output.Contains('Core structural navigation boundaries were not preserved as independent speech fragments.')) {
            throw 'Structural-boundary RED was not observed.'
          }
          if (-not $output.Contains('First-word rewind inside the pre-boundary grace state did not restart the current fragment.')) {
            throw 'First-word grace RED was not observed.'
          }
          git restore AgentPanelSpeaker-test-results.txt

      - name: Check out validated Core navigation-boundary candidate
        shell: pwsh
        run: |
          $core = Join-Path $env:GITHUB_WORKSPACE 'dependencies\AIConversationCore'
          git -C $core fetch origin 134d5735b44b8d131d30d5b98a6e3a06320a113f
          git -C $core checkout --detach 134d5735b44b8d131d30d5b98a6e3a06320a113f
          $actual = (git -C $core rev-parse HEAD).Trim()
          if ($actual -ne '134d5735b44b8d131d30d5b98a6e3a06320a113f') {
            throw "Unexpected Core revision: $actual"
          }

      - name: Apply AgentPanelSpeaker production repair and repin
        shell: pwsh
        run: python tools/issue84-structural-rewind-repair.py production

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Focused GREEN suites
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite rewind-current-fragment
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite ctrl-click-voice-pointer
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite core-word-id-migration
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite virtual-window
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite user-context-speech
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite settings
          git restore AgentPanelSpeaker-test-results.txt

      - name: Validate exact pinned Core completely
        shell: pwsh
        run: |
          npm test --prefix dependencies/AIConversationCore
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
          python dependencies/AIConversationCore/tests/validate-phase2-baseline.py
          python dependencies/AIConversationCore/tests/validate-canonical-golden.py
          python dependencies/AIConversationCore/tests/validate-claude-canonical-golden.py
          python dependencies/AIConversationCore/tests/validate-codex-canonical-golden.py
          python dependencies/AIConversationCore/tests/validate-provider-example-regressions.py

      - name: Run complete built application suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all
          git restore AgentPanelSpeaker-test-results.txt

      - name: Publish and run complete deployed application suite
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'AgentPanelSpeaker publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all
          git restore AgentPanelSpeaker-test-results.txt

      - name: Verify bundled Core pin and projection
        shell: pwsh
        run: |
          Remove-Item Env:AI_CONVERSATION_CORE -ErrorAction SilentlyContinue
          $worker = Join-Path $env:GITHUB_WORKSPACE 'tools\AIConversationCore-worker.mjs'
          $response = '{"operation":"ping"}' | node $worker | ConvertFrom-Json
          if (-not $response.ok) { throw "Bundled worker ping failed: $($response.error)" }
          if ($response.core_commit -ne '134d5735b44b8d131d30d5b98a6e3a06320a113f') {
            throw "Unexpected bundled Core pin: $($response.core_commit)"
          }

      - name: Validate canonical display against exact Core
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'DisplayParity build failed.' }
          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Verify repair diff and clean generated state
        shell: pwsh
        run: |
          git restore AgentPanelSpeaker-test-results.txt
          git diff --check
          Write-Host 'Changed paths before commit:'
          git status --short

      - name: Commit and push validated production candidate
        shell: pwsh
        run: |
          git restore AgentPanelSpeaker-test-results.txt
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore structural rewind navigation'
          git push origin HEAD:issue-75-core-word-id-migration
          if ((git status --porcelain).Length -ne 0) {
            throw 'Worktree is not clean after candidate push.'
          }
