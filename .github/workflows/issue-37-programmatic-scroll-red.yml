name: Issue 37 programmatic-scroll RED

on:
  push:
    branches:
      - issue-37-programmatic-scroll-window-loop

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Stage exact production regression
        shell: pwsh
        run: python tools/apply_issue37_programmatic_scroll_red.py

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Prove regression RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $output = & $exe --test virtual-window 2>&1
          $exit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exit -eq 0) {
            throw 'Expected the new #37 programmatic-scroll regression to fail before the production fix.'
          }
          $joined = $output -join "`n"
          if ($joined -notmatch 'FAIL\s+virtual-window/programmatic-playback-scroll-does-not-request-shift') {
            throw 'Virtual-window suite failed, but not for the intended programmatic-scroll regression.'
          }
          if ($joined -notmatch 'programmatic scroll emitted competing virtual-window shift') {
            throw 'The intended production failure reason was not reproduced.'
          }
          Write-Host 'RED-PROVEN issue-37 programmatic playback scroll emitted a competing window shift.'

      - name: Commit the proven RED regression
        shell: pwsh
        run: |
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue37VirtualWindowRegressionTestRunner.cs
          if (git diff --cached --quiet) {
            throw 'The RED regression patch produced no source change.'
          }
          git commit -m 'test: reproduce #37 programmatic scroll window loop [skip ci]'
          git push origin HEAD:issue-37-programmatic-scroll-window-loop
