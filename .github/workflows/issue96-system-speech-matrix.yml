name: Issue 96 System.Speech controlled matrix

on:
  push:
    branches:
      - issue-96-system-speech-matrix

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest

    steps:
      - name: Check out dependency branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-96-system-speech-matrix
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Establish issue 96 RED
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/issue96-system-speech-matrix.py red
          if ($LASTEXITCODE -ne 0) { throw 'RED applicator failed.' }
          python tools/issue96-system-speech-matrix-test-fix.py
          if ($LASTEXITCODE -ne 0) { throw 'RED oracle correction failed.' }
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'RED build failed.' }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'issue96-red-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'issue96-red-stderr.txt'
          $process = Start-Process -FilePath $exe -ArgumentList @('--test','system-speech-matrix') -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = Get-Content $stdout -Raw
          Write-Host $output
          if (Test-Path $stderr) { Write-Host (Get-Content $stderr -Raw) }
          if (-not $output.Contains('TEST-SUITE-COMPLETE system-speech-matrix exit=1')) {
            throw 'Issue #96 RED did not emit the expected failing completion marker.'
          }
          if (-not $output.Contains('FAIL  system-speech-matrix/button-is-wired')) {
            throw 'Issue #96 RED did not prove the diagnostic action is absent.'
          }
          Write-Host 'RED-PROVEN issue 96 diagnostic matrix is absent from production.'

      - name: Restore untouched production before GREEN
        shell: pwsh
        run: |
          git checkout -- AgentPanelSpeaker/Program.cs AgentPanelSpeaker-test-results.txt
          Remove-Item AgentPanelSpeaker/Issue96SystemSpeechMatrixRegressionTestRunner.cs -Force
          if (git status --porcelain | Select-String '^.[MADRCU?] AgentPanelSpeaker/') {
            git status --porcelain
            throw 'RED cleanup left application changes behind.'
          }

      - name: Apply issue 96 implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/issue96-system-speech-matrix.py green
          if ($LASTEXITCODE -ne 0) { throw 'GREEN applicator failed.' }
          python tools/issue96-system-speech-matrix-test-fix.py
          if ($LASTEXITCODE -ne 0) { throw 'GREEN oracle correction failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'GREEN patch has whitespace errors.' }

      - name: Build and run focused GREEN suites
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Issue #96 implementation failed to build.' }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          foreach ($suite in @(
            'system-speech-matrix',
            'system-speech-provenance',
            'speech-ownership',
            'preview-cursor',
            'settings',
            'core-word-id-migration',
            'rewind-current-fragment')) {
            & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite $suite
          }

      - name: Form clean candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'f4fe6d4b4cc09ad59c4caa622a66179a1b42957b'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- AgentPanelSpeaker-test-results.txt
          Remove-Item tools/issue96-system-speech-matrix.py -Force
          Remove-Item tools/issue96-system-speech-matrix-test-fix.py -Force
          Remove-Item .github/workflows/issue96-system-speech-matrix.yml -Force
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Candidate staged diff has whitespace errors.' }
          $tree = (git write-tree).Trim()
          $candidate = ('diagnostic: add System.Speech controlled SSML matrix' | git commit-tree $tree -p $base).Trim()
          if (-not $candidate) { throw 'Could not create issue #96 candidate commit.' }
          git reset --hard $candidate
          if ((git rev-parse HEAD^).Trim() -ne $base) { throw 'Candidate parent mismatch.' }
          $changed = @(git diff --name-only $base HEAD)
          $expected = @(
            'AgentPanelSpeaker/Issue96SystemSpeechMatrixRegressionTestRunner.cs',
            'AgentPanelSpeaker/MainForm.cs',
            'AgentPanelSpeaker/Program.cs',
            'AgentPanelSpeaker/SystemSpeechMatrixDiagnosticRunner.cs',
            'AgentPanelSpeaker/SystemSpeechMatrixDialog.cs'
          )
          if (@(Compare-Object ($changed | Sort-Object) ($expected | Sort-Object)).Count -ne 0) {
            throw "Unexpected clean candidate files: $($changed -join ', ')"
          }
          if ((Test-Path tools/issue96-system-speech-matrix.py) -or
              (Test-Path tools/issue96-system-speech-matrix-test-fix.py) -or
              (Test-Path .github/workflows/issue96-system-speech-matrix.yml)) {
            throw 'Temporary issue #96 scaffolding survived in candidate.'
          }
          if (git status --porcelain) { throw 'Clean candidate worktree is dirty.' }
          Write-Host "CANDIDATE_SHA=$candidate"

      - name: Verify pinned Core and Phase 2 baseline
        shell: pwsh
        run: |
          $expected = '134d5735b44b8d131d30d5b98a6e3a06320a113f'
          $actual = (git -C dependencies/AIConversationCore rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Unexpected Core pin: $actual" }
          npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Core npm ci failed.' }
          npm test --prefix dependencies/AIConversationCore
          if ($LASTEXITCODE -ne 0) { throw 'Core regression suite failed.' }
          python dependencies/AIConversationCore/tests/validate-phase2-baseline.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2 baseline failed.' }

      - name: Run complete built suite
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
          & tools/Invoke-TestSuite.ps1 -SelfTest
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Run complete published suite
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          if (-not (Test-Path $exe)) { throw "Published application missing: $exe" }
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Verify bundled runtime and canonical display
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Display validation harness failed to build.' }
          $response = '{"operation":"ping"}' | node tools/AIConversationCore-worker.mjs
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok -or $decoded.core_commit -ne '134d5735b44b8d131d30d5b98a6e3a06320a113f') {
            throw 'AIConversationCore worker pin validation failed.'
          }
          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "$env:AI_CONVERSATION_CORE" "$env:GITHUB_WORKSPACE\tools\AIConversationCore-worker.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical display validation failed.' }

      - name: Verify clean candidate and integrate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'f4fe6d4b4cc09ad59c4caa622a66179a1b42957b'
          git checkout -- AgentPanelSpeaker-test-results.txt
          $coreTracked = @(git -C dependencies/AIConversationCore status --porcelain=v1 --untracked-files=no)
          if ($coreTracked.Count -ne 0) {
            $coreTracked | ForEach-Object { Write-Host $_ }
            throw 'Core verification changed tracked files.'
          }
          $coreNodeModules = Join-Path $env:GITHUB_WORKSPACE 'dependencies\AIConversationCore\node_modules'
          if (Test-Path $coreNodeModules) { Remove-Item $coreNodeModules -Recurse -Force }
          if (git -C dependencies/AIConversationCore status --porcelain=v1 --untracked-files=all) {
            throw 'Core remains dirty after dependency cleanup.'
          }
          git diff --check $base HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Final candidate has whitespace errors.' }
          if (git status --porcelain=v1 --untracked-files=all) {
            git status --porcelain=v1 --untracked-files=all
            throw 'Final candidate worktree is dirty.'
          }
          $remote = (git ls-remote origin refs/heads/issue-75-core-word-id-migration | ForEach-Object { ($_ -split "`t")[0] }).Trim()
          if ($remote -ne $base) {
            throw "Integration branch moved while issue #96 ran: expected=$base actual=$remote"
          }
          $candidate = (git rev-parse HEAD).Trim()
          git push origin $candidate`:refs/heads/issue-75-core-word-id-migration
          if ($LASTEXITCODE -ne 0) { throw 'Verified integration push failed.' }
          Write-Host "INTEGRATED_HEAD=$candidate"
