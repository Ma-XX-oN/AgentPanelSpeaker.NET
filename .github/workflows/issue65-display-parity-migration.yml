name: Issue 65 display parity migration

on:
  push:
    branches:
      - issue-65-remove-redundant-transcript-identities

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[issue65-display-migrated]') }}
    runs-on: windows-2025
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply DisplayParity migration
        run: python scripts/patch-issue65-display-parity.py

      - name: Install pinned AIConversationCore dependencies
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build DisplayParity harness
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release

      - name: Validate canonical transcript display
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit migrated DisplayParity harness
        shell: pwsh
        run: |
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add tools/AgentPanelSpeaker.DisplayParity/Program.cs
          if (git diff --cached --quiet) {
            throw "Issue #65 DisplayParity migration produced no harness change."
          }
          git commit -m "test: align DisplayParity with record-local identity contract (#65) [issue65-display-migrated]"
          git push origin HEAD:issue-65-remove-redundant-transcript-identities
