name: Issue 73 Class Model RED

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer

permissions:
  contents: write

jobs:
  red:
    if: ${{ !contains(github.event.head_commit.message, '[issue73-class-red-finalized]') && !contains(github.event.head_commit.message, '[issue73-green]') }}
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply class-model regression
        shell: pwsh
        run: python scripts/apply-issue73-class-model-test.py

      - name: Commit permanent class-model RED
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add AgentPanelSpeaker/Issue73CtrlClickVoicePointerRegressionTestRunner.cs
            git commit -m 'test: require class-based current eligibility for ctrl-click [issue73-class-red-finalized]'
            git push origin HEAD:issue-73-ctrl-click-voice-pointer
          }

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Prove issue 73 class-model regression is RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & $exe --test ctrl-click-voice-pointer
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            throw 'Issue #73 class-model regression unexpectedly passed before production implementation.'
          }
          Write-Host "Confirmed expected RED exit code $code."
