name: Issue 75 ordered-list word-id RED

on:
  push:
    branches:
      - issue-75-core-word-id-migration
    paths:
      - '.github/workflows/issue-75-ordinal-history-red.yml'
      - 'tools/issue75-ordinal-history-red.py'

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add permanent ordered-list identity regression
        shell: pwsh
        run: python tools/issue75-ordinal-history-red.py

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Verify exact ordered-list RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $captured = @()
          $threw = $false
          try {
            $captured = @(& tools/Invoke-TestSuite.ps1 -Executable $exe -Suite core-word-id-migration 2>&1)
          }
          catch {
            $threw = $true
            $captured += $_.Exception.Message
          }
          $text = $captured -join "`n"
          Write-Host $text
          if (-not $threw) { throw 'Expected guarded RED suite to fail.' }
          if (-not $text.Contains('FAIL  core-word-id/ordered-list-history-preserves-core-word-boundaries')) {
            throw 'Ordered-list identity regression did not fail.'
          }
          if (-not $text.Contains('Production ordered-list history did not carry Core ordinal/body IDs.')) {
            throw 'Ordered-list regression failed for an unexpected reason.'
          }
          if (-not $text.Contains('TEST-SUITE-COMPLETE core-word-id-migration exit=1')) {
            throw 'Focused suite completion marker is missing.'
          }

      - name: Commit permanent RED
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue75CoreWordIdMigrationRegressionTestRunner.cs
          git diff --cached --check
          git commit -m 'test: require ordered-list Core word boundaries (#75)'
          git push origin HEAD:issue-75-core-word-id-migration
