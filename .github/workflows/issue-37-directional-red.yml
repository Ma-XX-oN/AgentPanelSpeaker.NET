name: Issue 37 physical vwindow RED

on:
  push:
    branches:
      - issue-37-directional-prefetch-blank-viewport

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Stage physical-window regressions
        shell: pwsh
        run: |
          python tools/apply_issue37_physical_window_regressions.py
          python tools/fix_issue37_physical_regression_escape.py

      - name: Validate staged test patch
        shell: pwsh
        run: git diff --check

      - name: Build AgentPanelSpeaker Release
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Prove physical-window regressions RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'issue37-physical-red.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'issue37-physical-red.stderr.txt'
          $process = Start-Process -FilePath $exe `
            -ArgumentList '--test', 'virtual-window' `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru -Wait
          $output = @()
          if (Test-Path $stdout) { $output += Get-Content $stdout }
          if (Test-Path $stderr) { $output += Get-Content $stderr }
          $output | ForEach-Object { Write-Host $_ }
          $text = $output -join "`n"
          if ($process.ExitCode -eq 0) {
            throw 'Expected physical #37 regressions to fail before production changes.'
          }
          foreach ($pass in @(
            'PASS  virtual-window/core-single-anchor-user-context-unit-is-preserved',
            'PASS  virtual-window/browser-is-bounded-convergent-and-diagnostics-are-bounded',
            'PASS  virtual-window/programmatic-playback-scroll-does-not-request-shift'
          )) {
            if (-not $text.Contains($pass)) {
              throw "Existing GREEN regression did not stay GREEN: $pass"
            }
          }
          foreach ($requiredRed in @(
            'FAIL  virtual-window/spacer-shift-restores-materialized-content',
            'FAIL  virtual-window/directional-prefetch-follows-scroll-direction',
            'FAIL  virtual-window/playback-voice-cursor-prefetches-inside-tall-turn'
          )) {
            if (-not $text.Contains($requiredRed)) {
              throw "Required physical RED regression did not fail: $requiredRed"
            }
          }
          $allowedFailNames = @(
            'virtual-window/spacer-shift-restores-materialized-content',
            'virtual-window/directional-prefetch-follows-scroll-direction',
            'virtual-window/physical-window-keeps-five-viewports-materialized',
            'virtual-window/playback-voice-cursor-prefetches-inside-tall-turn'
          )
          $unexpected = @($output | Where-Object { $_ -match '^FAIL  ' } | ForEach-Object {
            $name = $_.Substring(6)
            if ($allowedFailNames -notcontains $name) { $_ }
          })
          if ($unexpected.Count -ne 0) {
            throw "Unexpected RED failures: $($unexpected -join '; ')"
          }
          Write-Host 'RED-PROVEN issue-37 physical spacer/direction/voice-cursor requirements reproduced.'

      - name: Commit corrected RED regressions
        shell: pwsh
        run: |
          git config user.name 'chatgpt-codex-connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue37VirtualWindowRegressionTestRunner.cs
          if (git diff --cached --quiet) { throw 'Physical regression patch produced no source change.' }
          git commit -m 'test: specify physical virtual-window behaviour (#37) [skip ci]'
          git push origin HEAD:issue-37-directional-prefetch-blank-viewport
          Write-Host 'Physical RED regressions committed after intended failures were proven.'
