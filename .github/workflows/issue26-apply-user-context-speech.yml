name: Apply issue 26 user-context speech integration

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repin AIConversationCore
        shell: pwsh
        run: |
          $commit = '6c9c2eccc4df301105f4b330fb9216b90d35c5f7'
          git -C dependencies/AIConversationCore fetch origin $commit --depth=1
          git -C dependencies/AIConversationCore checkout $commit
          npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund
      - name: Apply production integration patch
        run: python scripts/run-issue26-user-context-speech-patch.py
      - name: Verify patch integrity
        shell: pwsh
        run: |
          git diff --check
          git status --short
          $pin = git -C dependencies/AIConversationCore rev-parse HEAD
          if ($pin.Trim() -ne '6c9c2eccc4df301105f4b330fb9216b90d35c5f7') {
            throw "Unexpected Core pin: $pin"
          }
      - name: Commit production integration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Core user-context speech option"
          git push origin HEAD:feature/aiconversationcore-integration
