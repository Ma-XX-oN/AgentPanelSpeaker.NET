name: Issue 44 integration timeout diagnostics

on:
  push:
    branches:
      - issue-44-integration-timeout-diagnostics

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run output oracle and always print diagnostics
        shell: pwsh
        run: |
          dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test output-oracle
          $code = $LASTEXITCODE
          Write-Host "output-oracle exit code: $code"
          $logDir = Join-Path $env:LOCALAPPDATA 'AgentPanelSpeaker\Logs'
          if (Test-Path $logDir) {
            Get-ChildItem $logDir -Filter '*.jsonl' |
              Sort-Object LastWriteTime |
              ForEach-Object {
                Write-Host "===== $($_.FullName) ====="
                Get-Content $_.FullName | Select-String -Pattern 'transcript.render_|transcript.virtual|structure|failed|app.start' | ForEach-Object { $_.Line }
              }
          }
          if ($code -ne 0) { exit $code }
