name: Issue 32 transcript settings placement RED

on:
  push:
    branches:
      - feature/aiconversationcore-integration
    paths:
      - .github/workflows/issue32-ui-placement-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
      - name: Probe Transcript Settings control placement
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'issue32-placement-probe'
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows10.0.22621.0</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -Path (Join-Path $probe 'Probe.csproj') -Encoding utf8
          @'
          using System.Reflection;
          using System.Windows.Forms;

          internal static class Program
          {
            [STAThread]
            private static int Main(string[] args)
            {
              Assembly assembly = Assembly.LoadFrom(args[0]);
              using var main = (Form)Activator.CreateInstance(
                assembly.GetType("AgentPanelSpeaker.TranscriptSettingsPopup", true)!,
                nonPublic: true)!;
              using var advanced = (Form)Activator.CreateInstance(
                assembly.GetType("AgentPanelSpeaker.TranscriptAdvancedSettingsPopup", true)!,
                nonPublic: true)!;

              string[] mainChecks = Descendants(main)
                .OfType<CheckBox>()
                .Select(control => control.Text)
                .ToArray();
              string[] advancedChecks = Descendants(advanced)
                .OfType<CheckBox>()
                .Select(control => control.Text)
                .ToArray();

              string[] expected =
              {
                "Show rolled-back Codex history",
                "Speak User / IDE context"
              };
              foreach (string text in expected)
              {
                if (!mainChecks.Contains(text, StringComparer.Ordinal))
                {
                  Console.Error.WriteLine($"Main Transcript Settings is missing: {text}");
                  return 1;
                }
                if (advancedChecks.Contains(text, StringComparer.Ordinal))
                {
                  Console.Error.WriteLine($"Advanced Transcript Settings still contains: {text}");
                  return 1;
                }
              }
              return 0;
            }

            private static IEnumerable<Control> Descendants(Control root)
            {
              foreach (Control child in root.Controls)
              {
                yield return child;
                foreach (Control descendant in Descendants(child))
                {
                  yield return descendant;
                }
              }
            }
          }
          '@ | Set-Content -Path (Join-Path $probe 'Program.cs') -Encoding utf8
          $assembly = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.dll'
          dotnet run --project (Join-Path $probe 'Probe.csproj') --configuration Release -- $assembly
