name: Fix transcript render retry loop

on:
  push:
    branches:
      - feature/aiconversationcore-integration
    paths:
      - .github/workflows/fix-bundled-core-runtime.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration

      - name: Guard failed renders from immediate identical retries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('AgentPanelSpeaker/TranscriptView.cs')
          text = path.read_text(encoding='utf-8')
          old = '''    if (generation != _renderGeneration)
          {
            return;
          }

          var cancellation = new CancellationTokenSource();
          '''
          if text.count(old) != 1:
            old = '''    if (generation != _renderGeneration)
    {
      return;
    }

    var cancellation = new CancellationTokenSource();
'''
          new = '''    if (generation != _renderGeneration)
    {
      return;
    }

    // Record the exact file generation before preparation starts.  If
    // preparation fails, the timer must not retry identical bytes in a tight
    // loop; a real file change or explicit forced refresh can retry.
    _lastWriteUtc = info.LastWriteTimeUtc;
    _lastLength = info.Length;

    var cancellation = new CancellationTokenSource();
'''
          if text.count(old) != 1:
            raise SystemExit(f'expected one render-start site, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Commit fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-bundled-core-runtime.yml
          git rm -f .github/workflows/apply-local-runtime-guards.yml
          git add AgentPanelSpeaker/TranscriptView.cs
          git commit -m "prevent repeated failed transcript renders"
          git push origin HEAD:feature/aiconversationcore-integration
