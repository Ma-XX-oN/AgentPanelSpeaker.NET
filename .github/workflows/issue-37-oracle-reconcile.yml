name: Issue 37 vwindow semantic-oracle validation

on:
  push:
    branches:
      - issue-37-shared-display-projection
    paths:
      - '.github/workflows/issue-37-oracle-reconcile.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-37-shared-display-projection
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Reconcile issue 44 oracle with intended virtualization
        shell: pwsh
        run: |
          @'
          import re
          from pathlib import Path

          path = Path('AgentPanelSpeaker/Issue44IndependentOutputOracleRegressionTestRunner.cs')
          text = path.read_text(encoding='utf-8')

          assertion = '    RequireBoolean(actual, "virtualSectionPresent", false);\n'
          if text.count(assertion) != 2:
            raise SystemExit(
              f'virtualSectionPresent assertion count={text.count(assertion)}, expected 2')
          text = text.replace(assertion, '')

          old = 'output-oracle/bounded-user-context-reproducer-is-rejected'
          new = 'output-oracle/user-context-containment-mutation-is-rejected'
          if text.count(old) != 1:
            raise SystemExit(f'negative test name count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = 'TestBoundedUserContextReproducerIsRejected'
          new = 'TestUserContextContainmentMutationIsRejected'
          if text.count(old) != 2:
            raise SystemExit(f'negative method-name count={text.count(old)}')
          text = text.replace(old, new)

          pattern = re.compile(
            r'(<h2>Active file:</h2><p>sessions/example\.jsonl</p>)\s*'
            r'(<h2>Active selection of the file:</h2><p>selected line</p>)\s*'
            r'(<h2>Open tabs:</h2><ul><li>example\.jsonl: sessions/example\.jsonl</li></ul>)\s*'
            r'(</details>)')
          text, substitutions = pattern.subn(
            r'\1\n      \4\n      \2\n      \3',
            text,
            count=1)
          if substitutions != 1:
            raise SystemExit(f'negative fixture substitution count={substitutions}')

          old_comment = (
            '  /// Replays the exact bounded-window composition that produced the issue #37\n'
            '  /// regression and proves the independent oracle rejects its browser result.\n'
            '  /// This is a negative reproducer, not an expected production output.\n')
          new_comment = (
            '  /// Applies an independently-authored structural mutation in which User\n'
            '  /// Context content escapes its details disclosure, and proves the semantic\n'
            '  /// oracle rejects the resulting browser output.\n')
          if text.count(old_comment) != 1:
            raise SystemExit(f'negative comment count={text.count(old_comment)}')
          text = text.replace(old_comment, new_comment, 1)

          old_message = (
            '      "Independent User Context oracle accepted the known-bad bounded-window " +\n'
            '      "browser composition.");')
          new_message = (
            '      "Independent User Context oracle accepted deliberately broken " +\n'
            '      "context containment.");')
          if text.count(old_message) != 1:
            raise SystemExit(f'negative failure message count={text.count(old_message)}')
          text = text.replace(old_message, new_message, 1)

          path.write_text(text, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue44IndependentOutputOracleRegressionTestRunner.cs
          git commit -m 'test: keep output oracles semantic under vwindow (#37 #44)'
          git push origin HEAD:issue-37-shared-display-projection

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require issue 44 independent output oracles GREEN
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite output-oracle

      - name: Require issue 37 initial vwindow oracle GREEN
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite virtual-window

      - name: Run pinned Core suite
        shell: pwsh
        run: npm test --prefix dependencies/AIConversationCore

      - name: Run complete built AgentPanelSpeaker suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and run complete deployed suite
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'AgentPanelSpeaker publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          if (-not (Test-Path $exe)) { throw "Published application missing: $exe" }
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Build display validation harness
        shell: pwsh
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release

      - name: Validate canonical transcript display
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Validate whitespace and branch diff
        shell: pwsh
        run: |
          git fetch origin feature/aiconversationcore-integration --depth=1
          git diff --check FETCH_HEAD HEAD

      - name: Remove temporary issue 37 validation workflows
        if: success()
        shell: pwsh
        run: |
          Remove-Item .github/workflows/issue-37-oracle-reconcile.yml
          if (Test-Path .github/workflows/issue-37-vwindow-red-green.yml) {
            Remove-Item .github/workflows/issue-37-vwindow-red-green.yml
          }
          git add -A
          git commit -m 'chore: remove issue 37 temporary validation workflows'
          git push origin HEAD:issue-37-shared-display-projection
