name: Issue 94 apply rate toggle

on:
  push:
    branches:
      - issue-94-system-speech-sample-rate

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Check out issue branch and Core dependency
        uses: actions/checkout@v4
        with:
          ref: issue-94-system-speech-sample-rate
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare supported build dependencies
        shell: pwsh
        run: '& tools/Prepare-Build.ps1'

      - name: Apply production implementation
        shell: pwsh
        run: python tools/apply_issue94_rate_toggle.py production

      - name: Build production implementation
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj -c Release

      - name: Verify version consistency
        shell: pwsh
        run: ./tools/Verify-VersionConsistency.ps1

      - name: Verify patch integrity
        shell: pwsh
        run: git diff --check

      - name: Commit production implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add AgentPanelSpeaker
          git diff --cached --check
          git commit -m "feat: add issue 94 rate-match toggle"
          git push origin HEAD:issue-94-system-speech-sample-rate
