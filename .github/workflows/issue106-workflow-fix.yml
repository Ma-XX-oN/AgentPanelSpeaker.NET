name: Correct issue 106 repair guard

on:
  push:
    branches:
      - issue-106-fragment-list-structure
    paths:
      - .github/workflows/issue106-workflow-fix.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-106-fragment-list-structure
          fetch-depth: 0
      - name: Correct exact singular-state guard
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/issue106-red.yml')
          source = path.read_text(encoding='utf-8')
          old = "          if 'currentFragmentPlaybackElement' in source:\n            raise SystemExit('Singular fragment playback state remains after migration.')"
          new = "          if 'currentFragmentPlaybackElement = ' in source:\n            raise SystemExit('Singular fragment playback state remains after migration.')"
          if source.count(old) != 1:
            raise SystemExit('Expected exactly one faulty singular-state guard.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
      - name: Commit corrected workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/issue106-red.yml
          git diff --cached --check
          git commit -m "ci: use exact issue 106 singular-state guard"
          git push origin HEAD:issue-106-fragment-list-structure
