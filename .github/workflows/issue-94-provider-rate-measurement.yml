name: Temporary issue 94 provider rate measurement

on:
  push:
    branches:
      - issue-94-system-speech-sample-rate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add temporary issue 94 suite entry point
        shell: pwsh
        run: |
          $path = 'AgentPanelSpeaker/Program.cs'
          $lines = [System.Collections.Generic.List[string]]::new()
          foreach ($line in [System.IO.File]::ReadAllLines($path)) {
            $lines.Add($line)
          }
          $match = '          string.Equals(args[1], "redundancy", StringComparison.OrdinalIgnoreCase))'
          $index = $lines.IndexOf($match)
          if ($index -lt 1 -or $lines[$index - 1] -ne '      if (args.Length == 2 &&') {
            throw 'Could not locate redundancy suite insertion point.'
          }
          $block = [string[]]@(
            '      if (args.Length == 2 &&',
            '          string.Equals(',
            '            args[1],',
            '            "system-speech-rate-timing",',
            '            StringComparison.OrdinalIgnoreCase))',
            '      {',
            '        Environment.ExitCode = RunNamedSuite(',
            '          "system-speech-rate-timing",',
            '          Issue94SystemSpeechSampleRateRegressionTestRunner.Run);',
            '        return;',
            '      }',
            ''
          )
          $lines.InsertRange($index - 1, $block)
          [System.IO.File]::WriteAllLines($path, $lines)

      - name: Build issue 94 measurement
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Measure provider rate semantics
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite system-speech-rate-timing
