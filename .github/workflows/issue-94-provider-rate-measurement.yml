name: Temporary issue 94 full validation

on:
  push:
    branches:
      - issue-94-system-speech-sample-rate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validation:
    runs-on: windows-latest

    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Persist permanent issue 94 suite entry point
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path

          path = Path("AgentPanelSpeaker/Program.cs")
          text = path.read_text(encoding="utf-8")
          original = text

          suite_marker = '''      if (args.Length == 2 &&
          string.Equals(args[1], "redundancy", StringComparison.OrdinalIgnoreCase))
      {
        Environment.ExitCode = RunNamedSuite(
          "redundancy",
          Issue65RedundancyRegressionTestRunner.Run);
        return;
      }
'''
          suite_block = '''      if (args.Length == 2 &&
          string.Equals(
            args[1],
            "system-speech-native-timing",
            StringComparison.OrdinalIgnoreCase))
      {
        Environment.ExitCode = RunNamedSuite(
          "system-speech-native-timing",
          Issue94NativeSystemSpeechTimingRegressionTestRunner.Run);
        return;
      }

'''
          if '"system-speech-native-timing"' not in text:
            if text.count(suite_marker) != 1:
              raise RuntimeError("Could not locate unique suite insertion point.")
            text = text.replace(suite_marker, suite_block + suite_marker, 1)

          all_marker = '''      int systemSpeechProvenance = RunIsolatedTestSuite(
        "system-speech-provenance");

      Environment.ExitCode = primary == 0 &&
'''
          all_replacement = '''      int systemSpeechProvenance = RunIsolatedTestSuite(
        "system-speech-provenance");
      int systemSpeechNativeTiming = RunIsolatedTestSuite(
        "system-speech-native-timing");

      Environment.ExitCode = primary == 0 &&
'''
          if 'int systemSpeechNativeTiming = RunIsolatedTestSuite(' not in text:
            if text.count(all_marker) != 1:
              raise RuntimeError("Could not locate unique all-suite insertion point.")
            text = text.replace(all_marker, all_replacement, 1)

          condition_marker = '''                             previewCursor == 0 &&
                             systemSpeechProvenance == 0
        ? 0
'''
          condition_replacement = '''                             previewCursor == 0 &&
                             systemSpeechProvenance == 0 &&
                             systemSpeechNativeTiming == 0
        ? 0
'''
          if 'systemSpeechNativeTiming == 0' not in text:
            if text.count(condition_marker) != 1:
              raise RuntimeError("Could not locate unique all-suite condition.")
            text = text.replace(condition_marker, condition_replacement, 1)

          if text != original:
            path.write_text(text, encoding="utf-8")
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP 'persist-issue94-suite.py'
          Set-Content -LiteralPath $scriptPath -Value $script -Encoding utf8
          python $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not persist issue #94 suite entry point.' }

          if (-not (git diff --quiet -- AgentPanelSpeaker/Program.cs)) {
            git diff --check -- AgentPanelSpeaker/Program.cs
            git fetch origin issue-94-system-speech-sample-rate
            $remote = (git rev-parse origin/issue-94-system-speech-sample-rate).Trim()
            if ($remote -ne $env:GITHUB_SHA) {
              throw "Branch moved concurrently before Program.cs commit: run=$env:GITHUB_SHA remote=$remote"
            }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add AgentPanelSpeaker/Program.cs
            git commit -m "test: make issue 94 timing regression permanent"
            git push origin HEAD:issue-94-system-speech-sample-rate
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify AIConversationCore submodule pin
        shell: pwsh
        run: |
          $expected = '74a96db899acacf2be7eec42a1175b733b6e7cfb'
          $actual = (git -C dependencies/AIConversationCore rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Unexpected AIConversationCore submodule revision: $actual"
          }

      - name: Install pinned AIConversationCore dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Run pinned AIConversationCore regression tests
        shell: pwsh
        run: npm test --prefix dependencies/AIConversationCore

      - name: Validate Phase 2 fixture and baseline inventory
        shell: pwsh
        run: python dependencies/AIConversationCore/tests/validate-phase2-baseline.py

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Verify application version consistency
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Verify-VersionConsistency.ps1 -Executable $exe

      - name: Verify test-runner completion guard
        shell: pwsh
        run: '& tools/Invoke-TestSuite.ps1 -SelfTest'

      - name: Run exact issue 94 regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite system-speech-native-timing

      - name: Run built AgentPanelSpeaker regression suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and test deployed application
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'AgentPanelSpeaker publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          if (-not (Test-Path $exe)) { throw "Published application missing: $exe" }
          & tools/Verify-VersionConsistency.ps1 -Executable $exe
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Verify bundled runtime from built output
        shell: pwsh
        run: |
          Remove-Item Env:AI_CONVERSATION_CORE -ErrorAction SilentlyContinue
          $outputTools = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\tools'
          $worker = Join-Path $outputTools 'AIConversationCore-worker.mjs'
          $marker = Join-Path $outputTools 'AIConversationCore-runtime\CORE_COMMIT'
          $package = Join-Path $outputTools 'AIConversationCore-runtime\package.json'
          if (-not (Test-Path $worker)) { throw "Built worker missing: $worker" }
          if (-not (Test-Path $marker)) { throw "Bundled core marker missing: $marker" }
          if (-not (Test-Path $package)) { throw "Bundled core package metadata missing: $package" }
          $corePackage = Get-Content -LiteralPath $package -Raw | ConvertFrom-Json
          $probe = 'Bundled runtime check — café 東京 😀'
          $record = @{ type = 'user'; uuid = 'bundled-ci'; timestamp = '2026-09-05T00:00:00Z'; message = @{ role = 'user'; content = @(@{ type = 'text'; text = $probe }) } }
          $request = @{ operation = 'project'; provider = 'claude'; records = @($record) } | ConvertTo-Json -Depth 10 -Compress
          $response = $request | node $worker
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Bundled worker projection failed: $($decoded.error)" }
          if ($decoded.core_commit -ne '74a96db899acacf2be7eec42a1175b733b6e7cfb') { throw "Unexpected bundled core commit: $($decoded.core_commit)" }
          if ($decoded.core_version -ne $corePackage.version) { throw "Unexpected bundled core version: $($decoded.core_version); package=$($corePackage.version)" }
          if ($decoded.projection.units[0].block.text -ne $probe) { throw 'Bundled projection corrupted Unicode text.' }
          if ($decoded.projection.presentation.schema_version -ne 2) { throw 'Bundled projection returned unexpected presentation schema.' }
          if ($decoded.projection.presentation.split_policy -ne 'presentation-tree') { throw 'Bundled projection returned unexpected presentation split policy.' }

      - name: Build display validation harness
        shell: pwsh
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release

      - name: Validate canonical transcript display
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Verify removed SSML matrix stays absent
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path

          forbidden = (
            "SSML Matrix",
            "system-speech-matrix",
            "SystemSpeechMatrix",
          )
          hits = []
          for path in Path("AgentPanelSpeaker").rglob("*.cs"):
            text = path.read_text(encoding="utf-8")
            for token in forbidden:
              if token in text:
                hits.append(f"{path}: {token}")
          if hits:
            raise SystemExit("Removed SSML matrix references remain:\n" + "\n".join(hits))
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP 'verify-no-ssml-matrix.py'
          Set-Content -LiteralPath $scriptPath -Value $script -Encoding utf8
          python $scriptPath

      - name: Validate whitespace and patch integrity
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          git diff --check FETCH_HEAD HEAD
