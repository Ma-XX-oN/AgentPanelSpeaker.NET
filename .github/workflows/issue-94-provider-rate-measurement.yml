name: Temporary issue 94 native timing RED

on:
  push:
    branches:
      - issue-94-system-speech-sample-rate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add temporary issue 94 suite entry point
        shell: pwsh
        run: |
          $path = 'AgentPanelSpeaker/Program.cs'
          $lines = [System.Collections.Generic.List[string]]::new()
          foreach ($line in [System.IO.File]::ReadAllLines($path)) {
            $lines.Add($line)
          }
          $match = '          string.Equals(args[1], "redundancy", StringComparison.OrdinalIgnoreCase))'
          $index = $lines.IndexOf($match)
          if ($index -lt 1 -or $lines[$index - 1] -ne '      if (args.Length == 2 &&') {
            throw 'Could not locate redundancy suite insertion point.'
          }
          $block = [string[]]@(
            '      if (args.Length == 2 &&',
            '          string.Equals(',
            '            args[1],',
            '            "system-speech-native-timing",',
            '            StringComparison.OrdinalIgnoreCase))',
            '      {',
            '        Environment.ExitCode = RunNamedSuite(',
            '          "system-speech-native-timing",',
            '          Issue94NativeSystemSpeechTimingRegressionTestRunner.Run);',
            '        return;',
            '      }',
            ''
          )
          $lines.InsertRange($index - 1, $block)
          [System.IO.File]::WriteAllLines($path, $lines)

      - name: Build issue 94 RED
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require native timing RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'issue94-native-red-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'issue94-native-red-err.txt'
          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList @('--test', 'system-speech-native-timing') `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          $output = Get-Content -LiteralPath $stdout -Raw
          Write-Host $output
          if (Test-Path -LiteralPath $stderr) {
            $errors = Get-Content -LiteralPath $stderr -Raw
            if ($errors) { Write-Host $errors }
          }
          if ($process.ExitCode -ne 1) {
            throw "Expected issue #94 RED exit 1; got $($process.ExitCode)."
          }
          if (-not $output.Contains('FAIL  system-speech-native-timing/native-output-and-normalized-timing')) {
            throw 'Issue #94 RED did not fail the intended native-output/timing regression.'
          }
          if (-not $output.Contains('Production System.Speech is not using the provider-default PCM rate')) {
            throw 'Issue #94 RED failed for an unexpected reason.'
          }
          if (-not $output.Contains('TEST-SUITE-COMPLETE system-speech-native-timing exit=1')) {
            throw 'Issue #94 RED completion marker is missing.'
          }
