name: Apply issue 26 non-destructive fix

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply production fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def once(text, old, new, label):
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected 1 match, got {count}')
            return text.replace(old, new, 1)

          p = Path('AgentPanelSpeaker/SettingsChangeSet.cs')
          s = p.read_text(encoding='utf-8')
          s = once(
            s,
            '      AddScalar("Transcript/Maximized", ["Transcript", "Maximized"], oldValue.Maximized, newValue.Maximized);',
            '      AddScalar("Transcript/Maximized", ["Transcript", "Maximized"], oldValue.Maximized, newValue.Maximized);\n'
            '      AddScalar("Transcript/SpeakUserContext", ["Transcript", "Speak User / IDE context"], oldValue.SpeakUserContext, newValue.SpeakUserContext);',
            'settings change tracking')
          s = once(
            s,
            '        Maximized = Pick("Transcript/Maximized", saved.Transcript.Maximized, working.Transcript.Maximized)',
            '        Maximized = Pick("Transcript/Maximized", saved.Transcript.Maximized, working.Transcript.Maximized),\n'
            '        SpeakUserContext = Pick("Transcript/SpeakUserContext", saved.Transcript.SpeakUserContext, working.Transcript.SpeakUserContext)',
            'settings selective merge')
          p.write_text(s, encoding='utf-8', newline='\n')

          p = Path('AgentPanelSpeaker/MainForm.cs')
          s = p.read_text(encoding='utf-8')
          s = once(
            s,
            '  private bool _suppressMonitorTextUntilHistoryLoaded;\n',
            '  private bool _suppressMonitorTextUntilHistoryLoaded;\n'
            '  private volatile bool _speakUserContext;\n',
            'playback policy field')
          s = once(
            s,
            '      _speech.SetPolicyProviders(\n        _settingsStore.GetProfile,',
            '      _speech.SetPolicyProviders(\n        GetPlaybackProfile,',
            'speech profile provider')
          s = once(
            s,
            '      _transcriptSettingsPopup.SetSettings(\n        settings.Transcript,\n        transcriptDark);',
            '      _transcriptSettingsPopup.SetSettings(\n        settings.Transcript,\n        transcriptDark);\n'
            '      _speakUserContext = settings.Transcript.SpeakUserContext;',
            'settings load playback policy')
          s = once(
            s,
            '        IncludeUserContext:\n          _transcriptSettingsPopup.Settings.SpeakUserContext));',
            '        IncludeUserContext: true));',
            'live monitor user context indexing')
          s = once(
            s,
            '          _transcriptSettingsPopup.Settings.ShowRolledBackHistory,\n          _transcriptSettingsPopup.Settings.SpeakUserContext));',
            '          _transcriptSettingsPopup.Settings.ShowRolledBackHistory,\n          includeUserContext: true));',
            'paused preview user context indexing')
          s = once(
            s,
            '    bool historyProjectionChanged =\n      _settingsStore.Current.Transcript.ShowRolledBackHistory !=\n        settings.ShowRolledBackHistory ||\n      _settingsStore.Current.Transcript.SpeakUserContext !=\n        settings.SpeakUserContext;',
            '    bool historyProjectionChanged =\n      _settingsStore.Current.Transcript.ShowRolledBackHistory !=\n        settings.ShowRolledBackHistory;\n'
            '    _speakUserContext = settings.SpeakUserContext;',
            'toggle as playback policy')
          signature = '  private SpeechProfileSettings GetIpaPreviewProfile()\n'
          helper = (
            '  /// <summary>\n'
            '  /// Resolves final playback eligibility without changing indexed\n'
            '  /// canonical history. User Context remains indexed so its speech\n'
            '  /// switch is an immediate policy change rather than a rebuild.\n'
            '  /// </summary>\n'
            '  private SpeechProfileSettings GetPlaybackProfile(ContentCategory category)\n'
            '  {\n'
            '    SpeechProfileSettings profile = _settingsStore.GetProfile(category);\n'
            '    return category == ContentCategory.UserContext && !_speakUserContext\n'
            '      ? profile with { VoiceName = SpeechProfileSettings.NotSpoken }\n'
            '      : profile;\n'
            '  }\n\n')
          if s.count(signature) != 1:
            raise SystemExit(f'playback helper insertion: expected 1 match, got {s.count(signature)}')
          s = s.replace(signature, helper + signature, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          '@ | python -
      - name: Focused GREEN
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test user-context-speech
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit final production fix and remove helper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-26-nondestructive-fix.yml
          git add AgentPanelSpeaker/SettingsChangeSet.cs AgentPanelSpeaker/MainForm.cs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "fix: gate user context at playback boundary"
          git push origin HEAD:feature/aiconversationcore-integration
