          new_prop = '''    RequireProperty<string?>("RevisionStatus");\n    RequireProperty<int?>("RevisionDepth");\n    RequireProperty<bool>("ProjectionVisible");\n    RequireProperty<bool>("RevisionHistoryControlled");\n    RequireProperty<bool>("HistoricalRevision");'''
          if text.count(old_prop) != 1:
            raise SystemExit('Issue35 property test anchor mismatch')
          text = text.replace(old_prop, new_prop, 1)

          marker = '''  private static string BuildRevisionJsonl()\n  {'''
          insertion = r'''  private static void TestPausedHiddenSkipsConsecutiveHistory()
  {
    using SpeechService speech = CreateSpeechService(rate: 10);
    List<TranscriptPlaybackPosition> positions = CapturePositions(speech);
    SetShowRolledBackHistory(speech, true);
    speech.LoadHistory(
      new[]
      {
        CreateRevisionFragment(10, "Historical one.", historical: true, "original", 0),
        CreateRevisionFragment(11, "Historical two.", historical: true, "superseded", 1),
        CreateRevisionFragment(12, "Visible destination.", historical: false, "edited", 2)
      },
      Array.Empty<TurnCompletion>(),
      Array.Empty<BackgroundWorkEvent>(),
      PlaybackStartMode.Beginning);

    TranscriptPlaybackPosition before = LastPosition(positions);
    Require(before.State == TranscriptPlaybackState.Paused && before.NodeId == 10,
      $"History-on paused cursor did not begin on historical node 10: {before.State}/{before.NodeId}.");

    SetShowRolledBackHistory(speech, false);
    TranscriptPlaybackPosition after = LastPosition(positions);
    Require(speech.IsPaused,
      "Hiding history while paused unexpectedly resumed playback.");
    Require(after.State == TranscriptPlaybackState.Paused && after.NodeId == 12,
      $"Paused hidden cursor did not skip to visible node 12: {after.State}/{after.NodeId}.");
  }

  private static void TestPausedHiddenWithNoDestinationGoesLiveEnd()
  {
    using SpeechService speech = CreateSpeechService(rate: 10);
    List<TranscriptPlaybackPosition> positions = CapturePositions(speech);
    SetShowRolledBackHistory(speech, true);
    speech.LoadHistory(
      new[]
      {
        CreateRevisionFragment(20, "Historical one.", historical: true, "original", 0),
        CreateRevisionFragment(21, "Historical two.", historical: true, "superseded", 1)
      },
      Array.Empty<TurnCompletion>(),
      Array.Empty<BackgroundWorkEvent>(),
      PlaybackStartMode.Beginning);

    SetShowRolledBackHistory(speech, false);
    TranscriptPlaybackPosition after = LastPosition(positions);
    Require(speech.IsPaused && after.State == TranscriptPlaybackState.PausedAtLiveEnd,
      $"Paused hidden tail ended in {after.State}, expected PausedAtLiveEnd.");
  }

  private static void TestActiveHiddenCancelsAndResumesVisible()
  {
    using SpeechService speech = CreateSpeechService(rate: -10);
    List<TranscriptPlaybackPosition> positions = CapturePositions(speech);
    SetShowRolledBackHistory(speech, true);
    speech.LoadHistory(
      new[]
      {
        CreateRevisionFragment(
          30,
          string.Join(' ', Enumerable.Repeat("historical active source", 80)),
          historical: true,
          "original",
          0),
        CreateRevisionFragment(31, "Historical skipped.", historical: true, "superseded", 1),
        CreateRevisionFragment(32, "Visible resumed destination.", historical: false, "edited", 2)
      },
      Array.Empty<TurnCompletion>(),
      Array.Empty<BackgroundWorkEvent>(),
      PlaybackStartMode.Beginning);

    Require(speech.TogglePause() == PauseToggleResult.Resumed,
      "Could not start the historical source utterance.");
    Require(SpinWait.SpinUntil(() => speech.IsSpeaking, TimeSpan.FromSeconds(3)),
      "Historical source never entered active speech.");
    int beforeCount;
    lock (positions) beforeCount = positions.Count;

    SetShowRolledBackHistory(speech, false);
    Require(SpinWait.SpinUntil(
        () =>
        {
          lock (positions)
          {
            return positions.Skip(beforeCount).Any(position =>
              position.State == TranscriptPlaybackState.Speaking && position.NodeId == 32);
          }
        },
        TimeSpan.FromSeconds(10)),
      "Active hidden source did not resume at visible node 32.");

    TranscriptPlaybackPosition[] transition;
    lock (positions) transition = positions.Skip(beforeCount).ToArray();
    Require(!transition.Any(position =>
        position.State == TranscriptPlaybackState.Speaking && position.NodeId == 31),
      "Active hidden transition spoke a consecutive historical destination.");
    Require(!transition.Any(position =>
        position.State == TranscriptPlaybackState.Speaking && position.NodeId == 30),
      "Cancelled historical source restarted after history was hidden.");
  }

  private static void TestActiveHiddenWithNoDestinationWaits()
  {
    using SpeechService speech = CreateSpeechService(rate: -10);
    List<TranscriptPlaybackPosition> positions = CapturePositions(speech);
    SetShowRolledBackHistory(speech, true);
    speech.LoadHistory(
      new[]
      {
        CreateRevisionFragment(
          40,
          string.Join(' ', Enumerable.Repeat("historical terminal source", 80)),
          historical: true,
          "original",
          0)
      },
      Array.Empty<TurnCompletion>(),
      Array.Empty<BackgroundWorkEvent>(),
      PlaybackStartMode.Beginning);

    Require(speech.TogglePause() == PauseToggleResult.Resumed,
      "Could not start terminal historical utterance.");
    Require(SpinWait.SpinUntil(() => speech.IsSpeaking, TimeSpan.FromSeconds(3)),
      "Terminal historical source never entered active speech.");
    SetShowRolledBackHistory(speech, false);
    Require(SpinWait.SpinUntil(() => !speech.IsSpeaking, TimeSpan.FromSeconds(10)),
      "Terminal historical cancellation did not settle.");
    TranscriptPlaybackPosition final = LastPosition(positions);
    Require(!speech.IsPaused && final.State == TranscriptPlaybackState.WaitingAtLiveEnd,
      $"Active hidden terminal source ended in {final.State}, expected WaitingAtLiveEnd.");
  }

  private static void TestHistoryTransitionUsesNormalPrefixPause()
  {
    MethodInfo? build = typeof(SpeechSapiXmlBuilder).GetMethods(
        BindingFlags.Static | BindingFlags.Public | BindingFlags.NonPublic)
      .Where(method => method.Name == "Build")
      .FirstOrDefault(method => method.GetParameters().Any(parameter =>
        string.Equals(parameter.Name, "pauseBefore", StringComparison.OrdinalIgnoreCase)));
    Require(build is not null,
      "SpeechSapiXmlBuilder has no normal prefix-pause option for cancel/move/resume transitions.");

    ParameterInfo[] parameters = build.GetParameters();
    object?[] arguments = parameters.Select(parameter => parameter.Name switch
    {
      "text" => "Destination.",
      "pitchSetting" => 0,
      "spelledWords" => Array.Empty<string>(),
      "pronunciations" => PronunciationRuleSet.Parse(string.Empty),
      "pauseAfter" => false,
      "pauseBefore" => true,
      _ when parameter.HasDefaultValue => parameter.DefaultValue,
      _ => throw new InvalidOperationException(
        $"Unexpected SpeechSapiXmlBuilder.Build parameter: {parameter.Name}")
    }).ToArray();
    SpeechMarkup markup = (SpeechMarkup)(build.Invoke(null, arguments) ??
      throw new InvalidOperationException("Speech markup build returned null."));
    int sapiPause = markup.SapiXml.IndexOf("<silence msec=\"250\"/>", StringComparison.Ordinal);
    int sapiText = markup.SapiXml.IndexOf("Destination.", StringComparison.Ordinal);
    int ssmlPause = markup.SsmlContent.IndexOf("<break time=\"250ms\"/>", StringComparison.Ordinal);
    int ssmlText = markup.SsmlContent.IndexOf("Destination.", StringComparison.Ordinal);
    Require(sapiPause >= 0 && sapiPause < sapiText,
      "Normal 250 ms SAPI pause is not before the resumed destination.");
    Require(ssmlPause >= 0 && ssmlPause < ssmlText,
      "Normal 250 ms SSML pause is not before the resumed destination.");
  }

  private static void RequireProperty<T>(string name)
  {
    PropertyInfo? property = typeof(SpeechFragment).GetProperty(
      name,
      BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic);
    Require(property is not null,
      $"SpeechFragment does not carry canonical {name} metadata.");
    Require(property.PropertyType == typeof(T),
      $"SpeechFragment.{name} has type {property.PropertyType}, expected {typeof(T)}.");
  }

  private static SpeechFragment CreateRevisionFragment(
    long nodeId,
    string text,
    bool historical,
    string revisionStatus,
    int revisionDepth)
  {
    ConstructorInfo constructor = typeof(SpeechFragment).GetConstructors(
        BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic)
      .OrderByDescending(item => item.GetParameters().Length)
      .First();
    object?[] arguments = constructor.GetParameters().Select(parameter =>
      parameter.Name switch
      {
        "NodeId" or "nodeId" => nodeId,
        "Category" or "category" => ContentCategory.Assistant,
        "Kind" or "kind" => SpeechFragmentKind.Prose,
        "Text" or "text" => text,
        "FenceType" or "fenceType" => string.Empty,
        "FenceBlockId" or "fenceBlockId" => -1,
        "FenceLineIndex" or "fenceLineIndex" => -1,
        "FenceLineCount" or "fenceLineCount" => 0,
        "PauseAfter" or "pauseAfter" => false,
        "NodeTimestampUtc" or "nodeTimestampUtc" => null,
        "StartsUserTurn" or "startsUserTurn" => false,
        "RevisionStatus" or "revisionStatus" => revisionStatus,
        "RevisionDepth" or "revisionDepth" => revisionDepth,
        "ProjectionVisible" or "projectionVisible" => !historical,
        "RevisionHistoryControlled" or "revisionHistoryControlled" => true,
        "HistoricalRevision" or "historicalRevision" => historical,
        _ when parameter.HasDefaultValue => parameter.DefaultValue,
        _ => throw new InvalidOperationException(
          $"Unexpected SpeechFragment constructor parameter: {parameter.Name}")
      }).ToArray();
    return (SpeechFragment)constructor.Invoke(arguments);
  }

  private static void SetShowRolledBackHistory(SpeechService speech, bool show)
  {
    MethodInfo method = typeof(SpeechService).GetMethod(
      "SetShowRolledBackHistory",
      BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic) ??
      throw new InvalidOperationException(
        "SpeechService has no in-place rolled-back history eligibility switch.");
    try
    {
      _ = method.Invoke(speech, new object[] { show });
    }
    catch (TargetInvocationException exception) when (exception.InnerException is not null)
    {
      throw exception.InnerException;
    }
  }

  private static SpeechService CreateSpeechService(int rate)
  {
    var speech = new SpeechService();
    InstalledSpeechVoice voice = speech.GetInstalledVoices().FirstOrDefault()
      ?? throw new InvalidOperationException(
        "No installed voice is available for issue #35 speech regressions.");
    var profile = new SpeechProfileSettings(voice.Name, rate, 0)
    {
      Volume = 1
    };
    speech.SetPolicyProviders(
      _ => profile,
      _ => true,
      () => Array.Empty<string>(),
      () => PronunciationRuleSet.Parse(string.Empty),
      () => AudioWakeSettings.Default with { Enabled = false });
    return speech;
  }

  private static List<TranscriptPlaybackPosition> CapturePositions(
    SpeechService speech)
  {
    var positions = new List<TranscriptPlaybackPosition>();
    speech.PlaybackPositionChanged += position =>
    {
      lock (positions) positions.Add(position);
    };
    return positions;
  }

  private static TranscriptPlaybackPosition LastPosition(
    List<TranscriptPlaybackPosition> positions)
  {
    lock (positions)
    {
      if (positions.Count == 0)
      {
        throw new InvalidOperationException(
          "SpeechService emitted no playback positions.");
      }
      return positions[^1];
    }
  }

