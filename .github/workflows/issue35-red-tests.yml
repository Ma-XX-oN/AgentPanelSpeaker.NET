name: Issue 35 RED test patch

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
      - name: Apply issue 35 RED tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
            p = Path(path)
            text = p.read_text(encoding='utf-8')
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{path}: expected one match, found {count}')
            p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
            'AgentPanelSpeaker/CoreRegressionTestRunner.cs',
            'Require(projection.Markdown.Contains("## User (edited)", StringComparison.Ordinal),\n      "Current Codex replacement is not labelled edited.");',
            'Require(projection.Markdown.Contains("## User (edited 1)", StringComparison.Ordinal),\n      "Current Codex replacement is not labelled edited with revision depth.");')
          replace_once(
            'AgentPanelSpeaker/CoreRegressionTestRunner.cs',
            '"## User (original, aborted)",',
            '"## User (original 0, aborted)",')
          replace_once(
            'AgentPanelSpeaker/CoreRegressionTestRunner.cs',
            'Require(projection.Markdown.Contains("## User (edited)", StringComparison.Ordinal),\n      "Opt-in Codex history omitted the edited label.");',
            'Require(projection.Markdown.Contains("## User (edited 1)", StringComparison.Ordinal),\n      "Opt-in Codex history omitted the edited label/depth.");')

          old = '''    Require(disabledNodes.Count == 1,\n      $"Disabled context speech emitted {disabledNodes.Count} nodes instead of one prompt.");\n    Require(disabledNodes[0].Category == nameof(ContentCategory.User),\n      "Disabled context speech changed the prompt voice category.");\n    Require(disabledNodes[0].Text == prompt,\n      "Disabled context speech did not leave the actual User prompt intact.");\n\n    Require(enabledNodes.Count == 2,\n      $"Enabled context speech emitted {enabledNodes.Count} nodes instead of context + prompt.");\n    Require(enabledNodes[0].Category == nameof(ContentCategory.UserContext),\n      "Included IDE context did not use the alternate User-context voice category.");\n    Require(enabledNodes[0].Text.Contains("## Active file:", StringComparison.Ordinal),\n      "Included IDE context lost canonical context content.");\n    Require(enabledNodes[1].Category == nameof(ContentCategory.User),\n      "Actual prompt did not retain the normal User voice category.");\n    Require(enabledNodes[1].Text == prompt,\n      "Actual prompt changed when IDE context speech was enabled.");'''
          new = '''    Require(disabledNodes.Count == 2,\n      $"Disabled context policy retained {disabledNodes.Count} nodes instead of context + prompt.");\n    Require(enabledNodes.Count == 2,\n      $"Enabled context policy retained {enabledNodes.Count} nodes instead of context + prompt.");\n    Require(disabledNodes.SequenceEqual(enabledNodes),\n      "SpeakUserContext changed indexed canonical speech history instead of final playback eligibility.");\n    Require(disabledNodes[0].Category == nameof(ContentCategory.UserContext),\n      "Retained IDE context did not use the alternate User-context voice category.");\n    Require(disabledNodes[0].Text.Contains("## Active file:", StringComparison.Ordinal),\n      "Retained IDE context lost canonical context content.");\n    Require(disabledNodes[1].Category == nameof(ContentCategory.User),\n      "Actual prompt did not retain the normal User voice category.");\n    Require(disabledNodes[1].Text == prompt,\n      "Actual User prompt changed while User Context remained indexed.");'''
          replace_once('AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs', old, new)

          runner = r'''using System.Reflection;

namespace AgentPanelSpeaker;

/// <summary>
/// Verifies issue #35 playback transitions when retained historical revisions
/// become ineligible without rebuilding speech history.
/// </summary>
internal static class Issue35SpeechTransitionRegressionTestRunner
{
  private static readonly TimeSpan CompletionTimeout = TimeSpan.FromSeconds(10);

  public static int Run()
  {
    var tests = new (string Name, Action Body)[]
    {
      ("rolled-back-speech/core-metadata-on-fragment", TestCoreMetadataOnFragment),
      ("rolled-back-speech/in-place-policy-entry-point", TestPolicyEntryPoint),
      ("rolled-back-speech/paused-skips-hidden-run", TestPausedSkipsHiddenRun),
      ("rolled-back-speech/paused-no-destination-live-end", TestPausedNoDestinationLiveEnd),
      ("rolled-back-speech/active-cancel-move-resume", TestActiveCancelMoveResume),
      ("rolled-back-speech/active-no-destination-waits", TestActiveNoDestinationWaits),
      ("rolled-back-speech/normal-prefix-pause", TestNormalPrefixPause)
    };

    int failures = 0;
    foreach ((string name, Action body) in tests)
    {
      try
      {
        body();
        Console.WriteLine($"PASS  {name}");
      }
      catch (Exception exception)
      {
        ++failures;
        Console.WriteLine($"FAIL  {name}");
        Console.WriteLine($"      {exception.GetType().Name}: {exception.Message}");
      }
    }
    Console.WriteLine(failures == 0
      ? $"PASS: {tests.Length}/{tests.Length} rolled-back speech regressions passed."
      : $"FAIL: {failures}/{tests.Length} rolled-back speech regressions failed.");
    return failures == 0 ? 0 : 1;
  }

  private static void TestCoreMetadataOnFragment()
  {
    RequireProperty<string?>("RevisionStatus");
    RequireProperty<int?>("RevisionDepth");
    RequireProperty<bool>("ProjectionVisible");
    RequireProperty<bool>("RevisionHistoryControlled");
    RequireProperty<bool>("HistoricalRevision");
  }

  private static void TestPolicyEntryPoint()
  {
    Require(ToggleMethod() is not null,
      "SpeechService has no in-place rolled-back-history policy entry point.");
  }

  private static void TestPausedSkipsHiddenRun()
  {
    using SpeechService speech = CreateSpeechService(rate: 10);
    List<TranscriptPlaybackPosition> positions = CapturePositions(speech);
    SetShowHistory(speech, true);
    speech.LoadHistory(
      new[]
      {
        Fragment(10, "Historical one.", true, "original", 0),
        Fragment(11, "Historical two.", true, "superseded", 1),
        Fragment(12, "Visible destination.", false, "edited", 2)
      },
      Array.Empty<TurnCompletion>(),
      Array.Empty<BackgroundWorkEvent>(),
      PlaybackStartMode.Beginning);
    Require(LastPosition(positions).NodeId == 10,
      "History-on paused cursor did not begin on the first historical node.");

    SetShowHistory(speech, false);
    TranscriptPlaybackPosition final = LastPosition(positions);
    Require(speech.IsPaused &&
            final.State == TranscriptPlaybackState.Paused &&
            final.NodeId == 12,
      $"Paused hidden run landed at {final.State}/{final.NodeId}, expected Paused/12.");
  }

  private static void TestPausedNoDestinationLiveEnd()
  {
    using SpeechService speech = CreateSpeechService(rate: 10);
    List<TranscriptPlaybackPosition> positions = CapturePositions(speech);
    SetShowHistory(speech, true);
    speech.LoadHistory(
      new[] { Fragment(20, "Historical tail.", true, "original", 0) },
      Array.Empty<TurnCompletion>(),
      Array.Empty<BackgroundWorkEvent>(),
      PlaybackStartMode.Beginning);
    SetShowHistory(speech, false);
    TranscriptPlaybackPosition final = LastPosition(positions);
    Require(speech.IsPaused && final.State == TranscriptPlaybackState.PausedAtLiveEnd,
      $"Paused hidden tail ended in {final.State}, expected PausedAtLiveEnd.");
  }

  private static void TestActiveCancelMoveResume()
  {
    using SpeechService speech = CreateSpeechService(rate: -10);
    List<TranscriptPlaybackPosition> positions = CapturePositions(speech);
    SetShowHistory(speech, true);
    speech.LoadHistory(
      new[]
      {
        Fragment(30, string.Join(' ', Enumerable.Repeat("historical active source", 80)), true, "original", 0),
        Fragment(31, "Historical skipped.", true, "superseded", 1),
        Fragment(32, "Visible resumed destination.", false, "edited", 2)
      },
      Array.Empty<TurnCompletion>(),
      Array.Empty<BackgroundWorkEvent>(),
      PlaybackStartMode.Beginning);
    Require(speech.TogglePause() == PauseToggleResult.Resumed,
      "Could not start historical source speech.");
    Require(SpinWait.SpinUntil(() => speech.IsSpeaking, TimeSpan.FromSeconds(3)),
      "Historical source never entered active speech.");
    int before;
    lock (positions) before = positions.Count;

    SetShowHistory(speech, false);
    Require(SpinWait.SpinUntil(() =>
      {
        lock (positions)
        {
          return positions.Skip(before).Any(position =>
            position.State == TranscriptPlaybackState.Speaking && position.NodeId == 32);
        }
      }, CompletionTimeout),
      "Active hidden source did not resume at visible node 32.");
    TranscriptPlaybackPosition[] transition;
    lock (positions) transition = positions.Skip(before).ToArray();
    Require(!transition.Any(position =>
        position.State == TranscriptPlaybackState.Speaking && position.NodeId is 30 or 31),
      "Active hidden transition restarted or spoke historical content.");
  }

  private static void TestActiveNoDestinationWaits()
  {
    using SpeechService speech = CreateSpeechService(rate: -10);
    List<TranscriptPlaybackPosition> positions = CapturePositions(speech);
    SetShowHistory(speech, true);
    speech.LoadHistory(
      new[]
      {
        Fragment(40, string.Join(' ', Enumerable.Repeat("historical terminal source", 80)), true, "original", 0)
      },
      Array.Empty<TurnCompletion>(),
      Array.Empty<BackgroundWorkEvent>(),
      PlaybackStartMode.Beginning);
    Require(speech.TogglePause() == PauseToggleResult.Resumed,
      "Could not start terminal historical source.");
    Require(SpinWait.SpinUntil(() => speech.IsSpeaking, TimeSpan.FromSeconds(3)),
      "Terminal historical source never entered active speech.");
    SetShowHistory(speech, false);
    Require(SpinWait.SpinUntil(() => !speech.IsSpeaking, CompletionTimeout),
      "Terminal historical cancellation did not settle.");
    TranscriptPlaybackPosition final = LastPosition(positions);
    Require(!speech.IsPaused && final.State == TranscriptPlaybackState.WaitingAtLiveEnd,
      $"Active hidden terminal source ended in {final.State}, expected WaitingAtLiveEnd.");
  }

  private static void TestNormalPrefixPause()
  {
    MethodInfo? build = typeof(SpeechSapiXmlBuilder).GetMethods(
        BindingFlags.Static | BindingFlags.Public | BindingFlags.NonPublic)
      .Where(method => method.Name == "Build")
      .FirstOrDefault(method => method.GetParameters().Any(parameter =>
        string.Equals(parameter.Name, "pauseBefore", StringComparison.OrdinalIgnoreCase)));
    Require(build is not null,
      "SpeechSapiXmlBuilder has no prefix form of the normal 250 ms structural pause.");
    object?[] arguments = build.GetParameters().Select(parameter => parameter.Name switch
    {
      "text" => "Destination.",
      "pitchSetting" => 0,
      "spelledWords" => Array.Empty<string>(),
      "pronunciations" => PronunciationRuleSet.Parse(string.Empty),
      "pauseAfter" => false,
      "pauseBefore" => true,
      _ when parameter.HasDefaultValue => parameter.DefaultValue,
      _ => throw new InvalidOperationException($"Unexpected Build parameter {parameter.Name}.")
    }).ToArray();
    SpeechMarkup markup = (SpeechMarkup)(build.Invoke(null, arguments) ??
      throw new InvalidOperationException("Speech markup build returned null."));
    int sapiPause = markup.SapiXml.IndexOf("<silence msec=\"250\"/>", StringComparison.Ordinal);
    int sapiText = markup.SapiXml.IndexOf("Destination.", StringComparison.Ordinal);
    int ssmlPause = markup.SsmlContent.IndexOf("<break time=\"250ms\"/>", StringComparison.Ordinal);
    int ssmlText = markup.SsmlContent.IndexOf("Destination.", StringComparison.Ordinal);
    Require(sapiPause >= 0 && sapiPause < sapiText,
      "SAPI prefix pause is missing or after destination text.");
    Require(ssmlPause >= 0 && ssmlPause < ssmlText,
      "SSML prefix pause is missing or after destination text.");
  }

  private static MethodInfo? ToggleMethod() => typeof(SpeechService).GetMethod(
    "SetShowRolledBackHistory",
    BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic);

  private static void SetShowHistory(SpeechService speech, bool show)
  {
    MethodInfo method = ToggleMethod() ?? throw new InvalidOperationException(
      "SpeechService has no in-place rolled-back-history policy entry point.");
    try
    {
      _ = method.Invoke(speech, new object[] { show });
    }
    catch (TargetInvocationException exception) when (exception.InnerException is not null)
    {
      throw exception.InnerException;
    }
  }

  private static void RequireProperty<T>(string name)
  {
    PropertyInfo? property = typeof(SpeechFragment).GetProperty(
      name, BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic);
    Require(property is not null, $"SpeechFragment does not expose {name}.");
    Require(property.PropertyType == typeof(T),
      $"SpeechFragment.{name} is {property.PropertyType}, expected {typeof(T)}.");
  }

  private static SpeechFragment Fragment(
    long nodeId, string text, bool historical, string status, int depth)
  {
    ConstructorInfo constructor = typeof(SpeechFragment).GetConstructors(
        BindingFlags.Instance | BindingFlags.Public | BindingFlags.NonPublic)
      .OrderByDescending(item => item.GetParameters().Length)
      .First();
    object?[] arguments = constructor.GetParameters().Select(parameter => parameter.Name switch
    {
      "NodeId" or "nodeId" => nodeId,
      "Category" or "category" => ContentCategory.Assistant,
      "Kind" or "kind" => SpeechFragmentKind.Prose,
      "Text" or "text" => text,
      "FenceType" or "fenceType" => string.Empty,
      "FenceBlockId" or "fenceBlockId" => -1,
      "FenceLineIndex" or "fenceLineIndex" => -1,
      "FenceLineCount" or "fenceLineCount" => 0,
      "PauseAfter" or "pauseAfter" => false,
      "NodeTimestampUtc" or "nodeTimestampUtc" => null,
      "StartsUserTurn" or "startsUserTurn" => false,
      "RevisionStatus" or "revisionStatus" => status,
      "RevisionDepth" or "revisionDepth" => depth,
      "ProjectionVisible" or "projectionVisible" => !historical,
      "RevisionHistoryControlled" or "revisionHistoryControlled" => true,
      "HistoricalRevision" or "historicalRevision" => historical,
      _ when parameter.HasDefaultValue => parameter.DefaultValue,
      _ => throw new InvalidOperationException(
        $"Unexpected SpeechFragment constructor parameter {parameter.Name}.")
    }).ToArray();
    return (SpeechFragment)constructor.Invoke(arguments);
  }

  private static SpeechService CreateSpeechService(int rate)
  {
    var speech = new SpeechService();
    InstalledSpeechVoice voice = speech.GetInstalledVoices().FirstOrDefault()
      ?? throw new InvalidOperationException("No installed voice is available.");
    var profile = new SpeechProfileSettings(voice.Name, rate, 0) { Volume = 1 };
    speech.SetPolicyProviders(
      _ => profile,
      _ => true,
      () => Array.Empty<string>(),
      () => PronunciationRuleSet.Parse(string.Empty),
      () => AudioWakeSettings.Default with { Enabled = false });
    return speech;
  }

  private static List<TranscriptPlaybackPosition> CapturePositions(SpeechService speech)
  {
    var positions = new List<TranscriptPlaybackPosition>();
    speech.PlaybackPositionChanged += position =>
    {
      lock (positions) positions.Add(position);
    };
    return positions;
  }

  private static TranscriptPlaybackPosition LastPosition(
    List<TranscriptPlaybackPosition> positions)
  {
    lock (positions)
    {
      return positions.Count == 0
        ? throw new InvalidOperationException("No playback position was emitted.")
        : positions[^1];
    }
  }

  private static void Require(bool condition, string message)
  {
    if (!condition) throw new InvalidOperationException(message);
  }
}
'''
          Path('AgentPanelSpeaker/Issue35SpeechTransitionRegressionTestRunner.cs').write_text(
            runner, encoding='utf-8')

          program = Path('AgentPanelSpeaker/Program.cs')
          text = program.read_text(encoding='utf-8')
          anchor = '''      if (args.Length == 2 &&\n          string.Equals(args[1], "rolled-back-visibility", StringComparison.OrdinalIgnoreCase))\n      {\n        Environment.ExitCode = Issue35RolledBackVisibilityRegressionTestRunner.Run();\n        return;\n      }\n'''
          addition = anchor + '''\n      if (args.Length == 2 &&\n          string.Equals(args[1], "rolled-back-speech-transition", StringComparison.OrdinalIgnoreCase))\n      {\n        Environment.ExitCode = Issue35SpeechTransitionRegressionTestRunner.Run();\n        return;\n      }\n'''
          if text.count(anchor) != 1:
            raise SystemExit('Program suite-dispatch anchor mismatch')
          text = text.replace(anchor, addition, 1)
          anchor2 = '''      int rolledBackVisibility = RunIsolatedTestSuite("rolled-back-visibility");\n'''
          addition2 = anchor2 + '''      int rolledBackSpeechTransition =\n        RunIsolatedTestSuite("rolled-back-speech-transition");\n'''
          if text.count(anchor2) != 1:
            raise SystemExit('Program full-run anchor mismatch')
          text = text.replace(anchor2, addition2, 1)
          anchor3 = '''                             liveEnd == 0 &&\n                             rolledBackVisibility == 0\n'''
          replacement3 = '''                             liveEnd == 0 &&\n                             rolledBackVisibility == 0 &&\n                             rolledBackSpeechTransition == 0\n'''
          if text.count(anchor3) != 1:
            raise SystemExit('Program aggregate anchor mismatch')
          text = text.replace(anchor3, replacement3, 1)
          program.write_text(text, encoding='utf-8')
          PY
      - name: Commit RED tests
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AgentPanelSpeaker/CoreRegressionTestRunner.cs \
            AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs \
            AgentPanelSpeaker/Issue35SpeechTransitionRegressionTestRunner.cs \
            AgentPanelSpeaker/Program.cs
          git commit -m "test: add issue 35 speech transition regressions"
          git push
