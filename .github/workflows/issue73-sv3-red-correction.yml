name: Issue 73 SV3 RED correction

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer

permissions:
  contents: write

jobs:
  red:
    if: ${{ contains(github.event.head_commit.message, '[issue73-sv3-red-correct]') }}
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Correct permanent SV3 regression harness
        shell: pwsh
        run: python scripts/fix-issue73-sv3-red.py
      - name: Verify correction scope
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'SV3 correction diff check failed.' }
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          if ($changed.Count -ne 1 -or $changed[0] -ne 'AgentPanelSpeaker/Issue37VirtualWindowRegressionTestRunner.cs') {
            throw "Unexpected SV3 correction scope: $($changed -join ', ')"
          }
      - name: Build Release
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
      - name: Prove corrected SV3 RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'virtual-sv3-red.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'virtual-sv3-red.err.txt'
          $p = Start-Process -FilePath $exe -ArgumentList @('--test','virtual-window') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $text = ((Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          Write-Host $text
          if ($p.ExitCode -eq 0) { throw 'SV3 unexpectedly GREEN before production fix.' }
          $passes = ([regex]::Matches($text, '(?m)^PASS  virtual-window/')).Count
          if ($passes -ne 10 -or $text -notmatch 'FAIL: 2/12 issue #37 virtual-window tests failed\.') {
            throw "SV3 correction changed prior test state; passes=$passes."
          }
          if ($text -notmatch 'FAIL  virtual-window/manual-scroll-preserves-disclosure-state') {
            throw 'Immediate disclosure RED missing.'
          }
          if ($text -notmatch 'FAIL  virtual-window/disclosure-open-state-survives-eviction-and-close-clears-override') {
            throw 'Eviction disclosure RED missing.'
          }
          if ($text -match 'JsonException') { throw 'SV3 still fails in the test harness instead of the product invariant.' }
          if ($text -notmatch 'An opened disclosure lost state after eviction and rematerialization') {
            throw 'SV3 eviction RED did not reach the intended product assertion.'
          }
      - name: Commit corrected permanent SV3 RED
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue37VirtualWindowRegressionTestRunner.cs
          git commit -m 'test: correct disclosure eviction regression harness (#37) [issue73-sv3-red-corrected]'
          git push origin HEAD:issue-73-ctrl-click-voice-pointer
