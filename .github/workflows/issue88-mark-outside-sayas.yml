name: Issue 88 mark outside say-as

on:
  push:
    branches:
      - issue-75-core-word-id-migration
    paths:
      - .github/workflows/issue88-mark-outside-sayas.yml

permissions:
  contents: write
  issues: write

jobs:
  repair:
    runs-on: windows-2025
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: issue-75-core-word-id-migration
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add structural RED
        shell: pwsh
        run: |
          $path = 'AgentPanelSpeaker/Issue88SpeechOwnershipRegressionTestRunner.cs'
          $text = Get-Content $path -Raw
          $old = @'
    Require(ssml.Contains("aps_", StringComparison.Ordinal),
      "Spanning spell-out token produced no canonical ownership bookmark.");
'@
          $new = @'
    Require(ssml.Contains("aps_", StringComparison.Ordinal),
      "Spanning spell-out token produced no canonical ownership bookmark.");

    var document = System.Xml.Linq.XDocument.Parse(ssml);
    System.Xml.Linq.XElement mark = document
      .Descendants()
      .Single(element =>
        element.Name.LocalName == "mark" &&
        string.Equals(
          element.Attribute("name")?.Value,
          "aps_0",
          StringComparison.Ordinal));
    System.Xml.Linq.XElement sayAs = document
      .Descendants()
      .Single(element => element.Name.LocalName == "say-as");
    Require(mark.Parent == sayAs.Parent,
      "Spell-out ownership mark is not outside the say-as element.");
    System.Xml.Linq.XElement? nextElement = mark
      .NodesAfterSelf()
      .OfType<System.Xml.Linq.XElement>()
      .FirstOrDefault();
    Require(ReferenceEquals(nextElement, sayAs),
      "Spell-out ownership mark is not immediately before say-as.");
    Require(!sayAs.Descendants().Any(element => element.Name.LocalName == "mark"),
      "Spell-out say-as still contains a nested ownership mark.");
'@
          if (-not $text.Contains($old)) {
            throw 'Issue #88 spell-out regression anchor missing.'
          }
          Set-Content $path ($text.Replace($old, $new)) -NoNewline
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'RED build failed.' }
          $exe = 'AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe'
          & $exe --test speech-ownership
          if ($LASTEXITCODE -eq 0) {
            throw 'Structural RED unexpectedly passed before production repair.'
          }

      - name: Put mark outside say-as
        shell: pwsh
        run: |
          $path = 'AgentPanelSpeaker/SapiSpeechEngine.cs'
          $text = Get-Content $path -Raw
          $old = @'
        var replacement = new List<object>();
        if (prefix.Length != 0)
        {
          replacement.Add(new XText(prefix));
        }
        replacement.Add(new XElement(
          ns + "mark",
          new XAttribute("name", $"aps_{word.WordIndex}")));
        if (spoken.Length != 0)
        {
          replacement.Add(new XText(spoken));
        }
        if (suffix.Length != 0)
        {
          replacement.Add(new XText(suffix));
        }
        node.ReplaceWith(replacement);
'@
          $new = @'
        var mark = new XElement(
          ns + "mark",
          new XAttribute("name", $"aps_{word.WordIndex}"));
        XElement? parent = node.Parent;
        bool markOutsideSayAs = local == 0 &&
          parent is not null &&
          string.Equals(
            parent.Name.LocalName,
            "say-as",
            StringComparison.OrdinalIgnoreCase);
        if (markOutsideSayAs)
        {
          parent!.AddBeforeSelf(mark);
        }

        var replacement = new List<object>();
        if (prefix.Length != 0)
        {
          replacement.Add(new XText(prefix));
        }
        if (!markOutsideSayAs)
        {
          replacement.Add(mark);
        }
        if (spoken.Length != 0)
        {
          replacement.Add(new XText(spoken));
        }
        if (suffix.Length != 0)
        {
          replacement.Add(new XText(suffix));
        }
        node.ReplaceWith(replacement);
'@
          if (-not $text.Contains($old)) {
            throw 'TryBuildBookmarkedSsml insertion anchor missing.'
          }
          Set-Content $path ($text.Replace($old, $new)) -NoNewline
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Build and verify focused suites
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          $exe = 'AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe'
          foreach ($suite in @('speech-ownership', 'core-word-id-migration', 'rewind-current-fragment')) {
            & $exe --test $suite
            if ($LASTEXITCODE -ne 0) { throw "Suite failed: $suite" }
          }

      - name: Commit verified repair
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/SapiSpeechEngine.cs AgentPanelSpeaker/Issue88SpeechOwnershipRegressionTestRunner.cs
          if (git diff --cached --quiet) { throw 'No production/test changes to commit.' }
          git commit -m 'fix: place speech bookmarks outside say-as'
          git push origin HEAD:issue-75-core-word-id-migration

      - name: Report progress
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = git rev-parse HEAD
          gh issue comment 88 --body "Tested the tag-nesting hypothesis. The new permanent regression proves the canonical bookmark is an immediate sibling before say-as (and never nested inside it), and the focused speech/Core/rewind suites are GREEN at $head. Permanent clean-branch integration validation will run after temporary workflow cleanup."
