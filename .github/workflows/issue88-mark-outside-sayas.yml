name: Issue 88 mark outside say-as

on:
  push:
    branches:
      - issue-75-core-word-id-migration
    paths:
      - .github/workflows/issue88-mark-outside-sayas.yml
      - tools/issue88-mark-outside-sayas.py

permissions:
  contents: write
  issues: write

jobs:
  repair:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: issue-75-core-word-id-migration
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Establish RED
        shell: pwsh
        run: |
          python tools/issue88-mark-outside-sayas.py red
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install RED regressions.' }
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'RED build failed.' }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'issue88-red-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'issue88-red-stderr.log'
          $process = Start-Process -FilePath $exe -ArgumentList @('--test', 'speech-ownership') -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = @(Get-Content $stdout)
          $errors = @(Get-Content $stderr)
          $output | ForEach-Object { Write-Host $_ }
          $errors | ForEach-Object { Write-Error $_ -ErrorAction Continue }
          if ($process.ExitCode -eq 0) {
            throw 'Issue #88 nesting/activity RED unexpectedly passed.'
          }
          if (-not ($output | Where-Object { $_ -match '^FAIL\s+speech-ownership/tracking-degradation-contract$' })) {
            throw 'RED did not reproduce the missing Activity warning.'
          }
          if (-not ($output | Where-Object { $_ -match '^FAIL\s+speech-ownership/spell-out-token-can-span-ssml-nodes$' })) {
            throw 'RED did not reproduce the nested say-as bookmark defect.'
          }
          if (-not ($output | Where-Object { $_ -ceq 'TEST-SUITE-COMPLETE speech-ownership exit=1' })) {
            throw 'RED test suite did not complete cleanly.'
          }

      - name: Apply production correction
        shell: pwsh
        run: |
          python tools/issue88-mark-outside-sayas.py green
          if ($LASTEXITCODE -ne 0) { throw 'Production correction failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Run focused regressions
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          foreach ($suite in @('speech-ownership', 'core-word-id-migration', 'rewind-current-fragment', 'rolled-back-speech')) {
            & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite $suite
          }

      - name: Run complete built and published suites
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          $publishedExe = Join-Path $publish 'AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $publishedExe -Suite all

      - name: Commit verified repair
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/SapiSpeechEngine.cs AgentPanelSpeaker/SpeechService.cs AgentPanelSpeaker/Issue88SpeechOwnershipRegressionTestRunner.cs
          if (git diff --cached --quiet) { throw 'No production/test changes to commit.' }
          git commit -m 'fix: keep speech bookmarks outside say-as'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
          git push origin HEAD:issue-75-core-word-id-migration
          if ($LASTEXITCODE -ne 0) { throw 'Push failed.' }
          $head = git rev-parse HEAD
          gh issue comment 88 --body "#88 tag-nesting correction GREEN. Canonical marks are now outside say-as, speech degradation is visible in Activity with its exact reason, and focused/full built/full published suites passed. Repair commit: $head"
