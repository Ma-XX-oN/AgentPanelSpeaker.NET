name: Issue 67 query-edit origin GREEN

on:
  push:
    branches:
      - issue-67-find-origin

permissions:
  contents: write

jobs:
  green:
    if: ${{ !contains(github.event.head_commit.message, '[issue67-origin-applied]') }}
    runs-on: windows-2025
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply production fix
        run: python scripts/apply-issue67-origin-crawl-fix.py

      - name: Build application
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run issue 67 regressions
        shell: pwsh
        run: |
          $exe = Resolve-Path "AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe"
          & $exe --test find-origin
          if ($LASTEXITCODE -ne 0) { throw 'Issue #67 regressions failed.' }

      - name: Run word-materialization regressions
        shell: pwsh
        run: |
          $exe = Resolve-Path "AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe"
          & $exe --test word-materialization
          if ($LASTEXITCODE -ne 0) { throw 'Word-materialization regressions failed.' }

      - name: Run virtual-window regressions
        shell: pwsh
        run: |
          $exe = Resolve-Path "AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe"
          & $exe --test virtual-window
          if ($LASTEXITCODE -ne 0) { throw 'Virtual-window regressions failed.' }

      - name: Run issue 65 redundancy regressions
        shell: pwsh
        run: |
          $exe = Resolve-Path "AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe"
          & $exe --test redundancy
          if ($LASTEXITCODE -ne 0) { throw 'Issue #65 redundancy regressions failed.' }

      - name: Validate whitespace
        run: git diff --check

      - name: Commit verified production fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AgentPanelSpeaker/TranscriptView.cs
          git commit -m "fix: keep Find origin stable while editing query (#67) [issue67-origin-applied]"
          git push origin HEAD:issue-67-find-origin
