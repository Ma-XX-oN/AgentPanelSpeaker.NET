name: Issue 75 pin corrected Core word identity

on:
  push:
    branches:
      - issue-75-core-word-id-migration
    paths:
      - '.github/workflows/issue-75-pin-core-prefix.yml'

permissions:
  contents: write

jobs:
  pin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pin verified Core head
        shell: pwsh
        run: |
          $expected = '169814bf407ac3b5c9f3757b724df10aeddef5de'
          git -C dependencies/AIConversationCore fetch origin $expected
          git -C dependencies/AIConversationCore checkout --detach $expected
          $actual = git -C dependencies/AIConversationCore rev-parse HEAD
          if ($actual.Trim() -ne $expected) {
            throw "Unexpected Core head: $actual"
          }

      - name: Align runtime Core guards
        shell: pwsh
        run: |
          $old = 'c97dc6f6a0d6e2bd6d21bc145da722645b19e002'
          $new = '169814bf407ac3b5c9f3757b724df10aeddef5de'
          $files = @(
            'AgentPanelSpeaker/AIConversationCoreClient.cs',
            'tools/AIConversationCore-worker.mjs',
            'tools/AIConversationCore-runtime/CORE_COMMIT'
          )
          foreach ($file in $files) {
            $path = Join-Path $env:GITHUB_WORKSPACE $file
            $text = [IO.File]::ReadAllText($path)
            $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
            if ($count -ne 1) { throw "$file expected one old Core SHA, found $count" }
            [IO.File]::WriteAllText(
              $path,
              $text.Replace($old, $new),
              [Text.UTF8Encoding]::new($false))
          }

      - name: Align canonical HTML parity assertions
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker/CoreRegressionTestRunner.cs'
          $text = [IO.File]::ReadAllText($path)
          $replacements = @(
            @('"What time is it in Paris?",', '">What</span>",', 2),
            @('"Active file:",', '">file</span>",', 1),
            @('"Active selection of the file:",', '">selection</span>",', 1),
            @('"Open tabs:",', '">tabs</span>",', 1)
          )
          foreach ($replacement in $replacements) {
            $old = [string]$replacement[0]
            $new = [string]$replacement[1]
            $expectedCount = [int]$replacement[2]
            $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
            if ($count -ne $expectedCount) {
              throw "Expected $expectedCount occurrence(s) of $old, found $count"
            }
            $text = $text.Replace($old, $new)
          }
          [IO.File]::WriteAllText(
            $path,
            $text,
            [Text.UTF8Encoding]::new($false))

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Verify corrected Core ordinal word identity
        shell: pwsh
        run: node --test dependencies/AIConversationCore/tests/canonical-list-ordinal-word-identity.test.js

      - name: Build AgentPanelSpeaker against pinned Core
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Verify APS Core bridge against exact pin
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite core

      - name: Commit complete Core pin
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dependencies/AIConversationCore AgentPanelSpeaker/AIConversationCoreClient.cs AgentPanelSpeaker/CoreRegressionTestRunner.cs tools/AIConversationCore-worker.mjs tools/AIConversationCore-runtime/CORE_COMMIT
          git diff --cached --check
          git commit -m 'build: pin corrected Core ordinal identity (#75)'
          git push origin HEAD:issue-75-core-word-id-migration
