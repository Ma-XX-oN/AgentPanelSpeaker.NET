name: Issue 67 query-edit origin RED

on:
  push:
    branches:
      - issue-67-find-origin

permissions:
  contents: read

jobs:
  red:
    runs-on: windows-2025
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build RED state
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Prove query-edit origin RED
        shell: pwsh
        run: |
          $exe = Resolve-Path "AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "issue67-origin-red.stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "issue67-origin-red.stderr.txt"
          $process = Start-Process -FilePath $exe -ArgumentList "--test", "find-origin" -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $text = ((Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw))
          Write-Host $text
          if ($process.ExitCode -eq 0) {
            throw "Issue #67 origin-crawl regression unexpectedly passed before production changes."
          }
          $expected = @(
            "PASS  find-origin/voice-cursor-rotation-remains-correct",
            "PASS  find-origin/previous-find-location-becomes-next-search-origin",
            "PASS  find-origin/find-result-origin-is-treated-as-provided",
            "FAIL  find-origin/query-edit-keeps-original-find-anchor"
          )
          foreach ($line in $expected) {
            if (-not $text.Contains($line)) {
              throw "Expected RED result missing: $line"
            }
          }

      - name: Validate whitespace
        run: git diff --check
