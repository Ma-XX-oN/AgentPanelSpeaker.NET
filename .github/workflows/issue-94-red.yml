name: Temporary issue 94 sample-rate RED

on:
  push:
    branches:
      - issue-94-system-speech-sample-rate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build issue 94 probe
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require focused sample-rate RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'issue94-red-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'issue94-red-stderr.txt'
          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList @('--test', 'system-speech-matrix') `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          $output = Get-Content -LiteralPath $stdout -Raw
          $errors = if (Test-Path -LiteralPath $stderr) {
            Get-Content -LiteralPath $stderr -Raw
          } else { '' }
          Write-Host $output
          if ($errors) { Write-Host $errors }
          if ($process.ExitCode -ne 1) {
            throw "Expected the current production sample-rate regression to exit 1; got $($process.ExitCode)."
          }
          foreach ($required in @(
            'PASS: 6/6 issue #96 tests passed.',
            'PASS  system-speech-sample-rate/provider-default-format-is-measured',
            'FAIL  system-speech-sample-rate/production-matches-provider-default-format',
            'FAIL  system-speech-sample-rate/production-preserves-provider-default-duration',
            'PASS  system-speech-sample-rate/provider-default-resample-preserves-duration',
            'PASS  system-speech-sample-rate/provider-progress-fits-native-pcm-timeline',
            'TEST-SUITE-COMPLETE system-speech-matrix exit=1'
          )) {
            if (-not $output.Contains($required)) {
              throw "Focused RED output is missing: $required"
            }
          }
