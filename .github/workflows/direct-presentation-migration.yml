name: Apply direct presentation migration

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pin canonical presentation core
        shell: pwsh
        run: |
          git -C dependencies/AIConversationCore fetch origin feature/canonical-presentation-html
          git -C dependencies/AIConversationCore checkout 2255b6603ef5f2ccbd4111a891375c9c4c246d3e
      - name: Apply runtime migration
        shell: pwsh
        run: python scripts/apply-direct-presentation-migration.py
      - name: Build and test migration
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          npm test --prefix dependencies/AIConversationCore
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release
      - name: Commit migration
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AgentPanelSpeaker/TranscriptView.cs AgentPanelSpeaker/TranscriptVirtualDocument.cs AgentPanelSpeaker/AIConversationCoreClient.cs tools/AIConversationCore-worker.mjs tools/AIConversationCore-runtime/CORE_COMMIT dependencies/AIConversationCore .github/workflows/core-integration-validation.yml
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "render canonical presentation tree directly"
          git push
