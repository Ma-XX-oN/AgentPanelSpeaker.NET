name: Temporary issue 154 direct RepoWorkflow verify

on:
  push:
    branches:
      - tmp-issue-154-local-verify
    paths:
      - .github/workflows/_temporary_issue_154_local_verify.yml

permissions:
  contents: read

jobs:
  verify-local-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 01274255be2c90ab98fc5fa81ea0e434e4e0a8c3
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Put exact candidate on its named issue branch locally
        shell: pwsh
        run: git switch -C issue-154-repoworkflow-adoption 01274255be2c90ab98fc5fa81ea0e434e4e0a8c3
      - name: Execute shared local authoritative path
        run: python RepoWorkflow/repo_workflow.py verify
