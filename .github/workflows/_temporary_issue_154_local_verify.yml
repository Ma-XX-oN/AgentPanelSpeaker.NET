name: Temporary issue 154 direct RepoWorkflow verify

on:
  push:
    branches:
      - tmp-issue-154-local-verify
    paths:
      - .github/workflows/_temporary_issue_154_local_verify.yml

permissions:
  contents: read

jobs:
  verify-local-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a305b688b7cd47fd9b017388bc1058c08b330eb7
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Put exact integration candidate on main locally
        shell: pwsh
        run: git switch -C main a305b688b7cd47fd9b017388bc1058c08b330eb7
      - name: Execute shared local authoritative path
        run: python RepoWorkflow/repo_workflow.py verify
