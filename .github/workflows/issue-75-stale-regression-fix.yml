name: Issue 75 stale canonical HTML regression correction

on:
  push:
    branches:
      - issue-75-core-word-id-migration
    paths:
      - '.github/workflows/issue-75-stale-regression-fix.yml'
      - 'tools/issue75-fix-stale-html-regressions.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply canonical projection regression corrections
        shell: pwsh
        run: python tools/issue75-fix-stale-html-regressions.py

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Verify presentation suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite presentation

      - name: Verify regression suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite regression

      - name: Verify rolled-back visibility suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite rolled-back-visibility

      - name: Commit verified regression corrections
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/RegressionTestRunner.cs AgentPanelSpeaker/Issue35RolledBackVisibilityRegressionTestRunner.cs
          git diff --cached --check
          git commit -m 'test: follow canonical word markup in legacy regressions (#75)'
          git push origin HEAD:issue-75-core-word-id-migration
