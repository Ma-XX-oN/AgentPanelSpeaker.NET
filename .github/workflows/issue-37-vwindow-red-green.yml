name: Issue 37 vwindow RED GREEN validation

on:
  push:
    branches:
      - issue-37-shared-display-projection
    paths:
      - '.github/workflows/issue-37-vwindow-red-green.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-37-shared-display-projection
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wire issue 37 virtual-window suite before production change
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('AgentPanelSpeaker/Program.cs')
          text = path.read_text(encoding='utf-8')

          generic = '''      if (args.Length == 2)
                {
                  string suite = args[1];
          '''
          named = '''      if (args.Length == 2 &&
                    string.Equals(args[1], "virtual-window", StringComparison.OrdinalIgnoreCase))
                {
                  Environment.ExitCode = RunNamedSuite(
                    "virtual-window",
                    () => RunWithWinFormsMessageLoop(
                      Issue37VirtualWindowRegressionTestRunner.Run));
                  return;
                }

          '''
          if named.strip() not in text:
            if text.count(generic) != 1:
              raise SystemExit(f'generic named-suite anchor count={text.count(generic)}')
            text = text.replace(generic, named + generic, 1)

          isolated = '      int independentOracles = RunIsolatedTestSuite("independent-oracles");\n'
          isolated_new = isolated + '      int virtualWindow = RunIsolatedTestSuite("virtual-window");\n'
          if 'int virtualWindow = RunIsolatedTestSuite("virtual-window");' not in text:
            if text.count(isolated) != 1:
              raise SystemExit(f'isolated-suite anchor count={text.count(isolated)}')
            text = text.replace(isolated, isolated_new, 1)

          condition = '                             independentOracles == 0\n        ? 0\n'
          condition_new = '                             independentOracles == 0 &&\n                             virtualWindow == 0\n        ? 0\n'
          if '                             virtualWindow == 0\n        ? 0\n' not in text:
            if text.count(condition) != 1:
              raise SystemExit(f'completion-condition anchor count={text.count(condition)}')
            text = text.replace(condition, condition_new, 1)

          path.write_text(text, encoding='utf-8')
          '@ | python -

          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add AgentPanelSpeaker/Program.cs AgentPanelSpeaker/Issue37VirtualWindowRegressionTestRunner.cs
          git commit -m 'test: wire issue 37 initial vwindow acceptance (#37)'
          git push origin HEAD:issue-37-shared-display-projection

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build RED regression
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Prove current full-DOM initial path is RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'issue37-red-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'issue37-red-err.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--test','virtual-window' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $text = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          Write-Host $text
          if ($process.ExitCode -eq 0) {
            throw 'Issue #37 regression unexpectedly passed before production fix.'
          }
          if ($text -notmatch 'virtualization did not bound first paint|contains no virtual-record containers') {
            throw 'Issue #37 RED failed for an unexpected reason.'
          }
          if ($text -notmatch 'TEST-SUITE-COMPLETE virtual-window exit=1') {
            throw 'Issue #37 RED run did not reach its completion sentinel.'
          }

      - name: Apply bounded initial window through the production window renderer
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('AgentPanelSpeaker/TranscriptView.cs')
          text = path.read_text(encoding='utf-8')

          old = '''      int focalIndex = ResolveInitialWindowIndex(payload.Document, payload.Identities);
                TranscriptWindow window = payload.Document.CreateFullWindow();
                TranscriptStructureSnapshot virtualStructure =
                  TranscriptStructureProbe.CaptureHtml(
                    structureProbeId,
                    "dom-model-serialized-html",
                    window.Html);
                TranscriptStructureProbe.Compare(
                  payload.RendererStructure,
                  virtualStructure);
                string script = BuildReplaceDomScript(
                  window,
                  payload.DomNodes,
                  preserve: !force,
                  structureProbeId: structureProbeId,
                  expectedStructure: virtualStructure);
          '''
          new = '''      int focalIndex = ResolveInitialWindowIndex(payload.Document, payload.Identities);
                TranscriptWindow window = payload.Document.CreateWindow(focalIndex);
                TranscriptStructureSnapshot virtualStructure =
                  TranscriptStructureProbe.CaptureHtml(
                    structureProbeId,
                    "initial-virtual-window-html",
                    window.Html);
                DiagnosticLog.Write("transcript.initial_window_selected", new
                {
                  focalIndex,
                  window.StartIndex,
                  window.EndIndex,
                  recordCount = window.Records.Count,
                  totalRecordCount = payload.Document.Count,
                  htmlCharacters = window.Html.Length,
                  window.TopSpacerHeight,
                  window.BottomSpacerHeight,
                  preparationMilliseconds
                });
                string script = BuildReplaceWindowScript(
                  window,
                  preserve: !force,
                  focusVirtualIndex: force ? focalIndex : null,
                  structureProbeId: structureProbeId,
                  expectedStructure: virtualStructure);
          '''
          if text.count(old) != 1:
            raise SystemExit(f'initial full-window block count={text.count(old)}')
          text = text.replace(old, new, 1)

          old_mode = '''      _windowStartIndex = window.StartIndex;
                _windowEndIndex = window.EndIndex;
                _domPresentationMode = true;
          '''
          new_mode = '''      _windowStartIndex = window.StartIndex;
                _windowEndIndex = window.EndIndex;
                _domPresentationMode = false;
          '''
          if text.count(old_mode) != 1:
            raise SystemExit(f'initial DOM-mode block count={text.count(old_mode)}')
          text = text.replace(old_mode, new_mode, 1)

          path.write_text(text, encoding='utf-8')
          '@ | python -

          git add AgentPanelSpeaker/TranscriptView.cs
          git commit -m 'fix: restore bounded initial transcript vwindow (#37)'
          git push origin HEAD:issue-37-shared-display-projection

      - name: Rebuild GREEN implementation
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require same issue 37 regression GREEN
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite virtual-window

      - name: Run pinned Core suite
        shell: pwsh
        run: npm test --prefix dependencies/AIConversationCore

      - name: Run complete built AgentPanelSpeaker suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and run complete deployed suite
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'AgentPanelSpeaker publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          if (-not (Test-Path $exe)) { throw "Published application missing: $exe" }
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Build display validation harness
        shell: pwsh
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release

      - name: Validate canonical transcript display
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Validate whitespace and branch diff
        shell: pwsh
        run: |
          git fetch origin feature/aiconversationcore-integration --depth=1
          git diff --check FETCH_HEAD HEAD

      - name: Remove temporary issue 37 workflows after validation
        if: success()
        shell: pwsh
        run: |
          Remove-Item .github/workflows/issue-37-vwindow-red-green.yml
          if (Test-Path .github/workflows/issue-37-red-single-projection.yml) {
            Remove-Item .github/workflows/issue-37-red-single-projection.yml
          }
          git add -A
          git commit -m 'chore: remove issue 37 temporary validation workflows'
          git push origin HEAD:issue-37-shared-display-projection
