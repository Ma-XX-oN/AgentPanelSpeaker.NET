name: Issue 44 independent output oracle validation

on:
  push:
    branches:
      - issue-44-revert-windowing-independent-oracles

permissions:
  contents: write

jobs:
  validation:
    runs-on: windows-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply staged Core test correction
        shell: pwsh
        run: |
          if (Test-Path 'scripts/issue-44-correct-core-test.py') {
            python scripts/issue-44-correct-core-test.py
            Remove-Item scripts/issue-44-correct-core-test.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add AgentPanelSpeaker/CoreRegressionTestRunner.cs scripts/issue-44-correct-core-test.py
            git commit -m 'test: correct user-context test scope and oracle boundary'
            git push origin HEAD:issue-44-revert-windowing-independent-oracles
          }

      - name: Install pinned AIConversationCore dependencies
        working-directory: dependencies/AIConversationCore
        run: npm ci --no-audit --no-fund

      - name: Run pinned AIConversationCore regression tests
        run: npm test --prefix dependencies/AIConversationCore

      - name: Validate Phase 2 fixture and baseline inventory
        run: python dependencies/AIConversationCore/tests/validate-phase2-baseline.py

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run independent browser output oracles
        shell: pwsh
        run: >-
          & 'AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe'
          --test output-oracle

      - name: Run Core boundary regressions
        shell: pwsh
        run: >-
          & 'AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe'
          --test core

      - name: Run full AgentPanelSpeaker regression suite
        shell: pwsh
        run: >-
          & 'AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe'
          --test

      - name: Publish and test deployed application
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'AgentPanelSpeaker publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          if (-not (Test-Path $exe)) { throw "Published application missing: $exe" }
          Push-Location $publish
          try {
            & $exe --test
            if ($LASTEXITCODE -ne 0) { throw 'Published regression suite failed.' }
          }
          finally {
            Pop-Location
          }

      - name: Build display validation harness
        shell: pwsh
        run: >-
          dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj
          --configuration Release

      - name: Validate canonical transcript display
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: >-
          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj
          --configuration Release --no-build --
          "${{ github.workspace }}\dependencies\AIConversationCore"
          "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Validate whitespace and patch integrity
        shell: pwsh
        run: |
          git fetch origin feature/aiconversationcore-integration --depth=1
          git diff --check FETCH_HEAD HEAD
