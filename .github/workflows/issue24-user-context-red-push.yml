name: Issue 24 user-context node ID RED push

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  add-red-regression:
    if: "github.event.head_commit.message == 'chore trigger issue 24 user-context RED'"
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Add exact user-context node-ID divergence regression
        shell: pwsh
        run: python .github/scripts/issue24_user_context_red.py
      - name: Build and require the exact regression to be RED
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          $output = dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test 2>&1 | Out-String
          $code = $LASTEXITCODE
          $output | Write-Host
          if ($code -eq 0) { throw 'Expected the new issue #24 regression to fail before the production fix.' }
          if ($output -notmatch 'production-path-user-context-node-id-parity') {
            throw 'Regression failed, but not at the required user-context node-ID parity seam.'
          }
          if ($output -notmatch 'assigned different node IDs') {
            throw 'Regression did not report the demonstrated speech/display node-ID mismatch.'
          }
          git diff --check
      - name: Commit RED regression
        shell: bash
        run: |
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add AgentPanelSpeaker/Issue24ProductionPathRegressionTestRunner.cs
          git commit -m "test: reproduce user-context node ID divergence"
          git push origin HEAD:feature/aiconversationcore-integration

# trigger production-shaped RED fixture
