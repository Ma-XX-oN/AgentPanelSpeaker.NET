name: Temporary issue 84 CSharp repair

on:
  push:
    branches:
      - issue-75-core-word-id-migration

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'ci: apply issue 84 repair v2' }}"
    runs-on: windows-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: issue-75-core-word-id-migration
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply CSharp-only issue 84 repair
        run: python .github/scripts/issue84-repair.py

      - name: Validate patch whitespace
        shell: pwsh
        run: git diff --check

      - name: Build repaired application
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run focused issue 84 GREEN
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite rewind-current-fragment

      - name: Run complete built regression suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Commit verified repair
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- `
            AgentPanelSpeaker/SpeechService.cs `
            AgentPanelSpeaker/SpeechWordBoundary.cs `
            AgentPanelSpeaker/TranscriptPlaybackPosition.cs `
            AgentPanelSpeaker/SpeechFragment.cs `
            AgentPanelSpeaker/Issue35SpeechTransitionRegressionTestRunner.cs
          git diff --cached --check
          if (git diff --cached --quiet) {
            throw 'Issue #84 repair produced no staged changes.'
          }
          git commit -m 'fix: make CSharp sole owner of rewind grace'
          git push origin HEAD:issue-75-core-word-id-migration
