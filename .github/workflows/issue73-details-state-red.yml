name: Issue73 details state RED

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer
    paths:
      - '.github/workflows/issue73-details-state-red.yml'
      - 'scripts/apply-issue73-cause-independent-details-red.py'

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply cause-independent disclosure regression
        run: python scripts/apply-issue73-cause-independent-details-red.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prove exact RED
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj -c Release
          $exe = 'AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe'
          $output = & $exe --test virtual-window 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Host $output
          if ($exit -eq 0) { throw 'Regression unexpectedly passed before production repair.' }
          if ($output -notmatch 'Programmatically opened disclosure lost state after eviction/rematerialization') {
            throw 'Expected cause-independent disclosure RED was not observed.'
          }
          Write-Host 'RED confirmed: programmatic disclosure state is not retained by current production.'
          exit 0
      - name: Commit permanent RED regression
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue37VirtualWindowRegressionTestRunner.cs
          git commit -m 'test: require cause-independent disclosure state (#37) [issue73-details-state-red]'
          git push origin HEAD:issue-73-ctrl-click-voice-pointer
