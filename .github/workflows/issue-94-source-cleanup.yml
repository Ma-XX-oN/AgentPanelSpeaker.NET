name: Issue 94 source cleanup

on:
  push:
    branches:
      - issue-94-system-speech-sample-rate

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Correct source layout
        shell: pwsh
        run: |
          $path = 'AgentPanelSpeaker/SapiSpeechEngine.cs'
          $text = [IO.File]::ReadAllText($path)

          $oldHeader = @'
            /// <summary>
            /// Renders System.Speech SSML into an in-memory WAVE file.
            /// </summary>
            /// <summary>
            /// Maps the provider-neutral application rate onto System.Speech's
            /// coarser integer rate scale.  Issue #94 measurements show that
            /// one System.Speech step is approximately two application-rate
            /// steps over the supported UI range.
            /// </summary>
            private static int MapSystemSpeechRate(int applicationRate)
            {
              Debug.Assert(applicationRate is >= -10 and <= 10);
              return (int)Math.Round(
                applicationRate / 2.0,
                MidpointRounding.AwayFromZero);
            }
            private static PcmWaveData RenderSystemSpeech(
          '@
          $oldHeader = ($oldHeader -replace '(?m)^          ', '').TrimEnd()
          $newHeader = @'
            /// <summary>
            /// Maps the provider-neutral application rate onto System.Speech's
            /// coarser integer rate scale.  Issue #94 measurements show that
            /// one System.Speech step is approximately two application-rate
            /// steps over the supported UI range.
            /// </summary>
            private static int MapSystemSpeechRate(int applicationRate)
            {
              Debug.Assert(applicationRate is >= -10 and <= 10);
              return (int)Math.Round(
                applicationRate / 2.0,
                MidpointRounding.AwayFromZero);
            }

            /// <summary>
            /// Renders System.Speech SSML into an in-memory WAVE file.
            /// </summary>
            private static PcmWaveData RenderSystemSpeech(
          '@
          $newHeader = ($newHeader -replace '(?m)^          ', '').TrimEnd()
          $headerMatches = [regex]::Matches(
            $text,
            [regex]::Escape($oldHeader)).Count
          if ($headerMatches -ne 1) {
            throw "Expected exactly one malformed System.Speech header; found $headerMatches."
          }
          $text = $text.Replace($oldHeader, $newHeader)

          $oldRate = @'
                int providerRate = MapSystemSpeechRate(profile.Rate);
                synthesizer.Rate = providerRate;
                DiagnosticLog.Write("speech.system_speech_rate_mapped", new
                {
                  applicationRate = profile.Rate,
                  providerRate
                });
          '@
          $oldRate = ($oldRate -replace '(?m)^            ', '').TrimEnd()
          $newRate = @'
              int providerRate = MapSystemSpeechRate(profile.Rate);
              synthesizer.Rate = providerRate;
              DiagnosticLog.Write("speech.system_speech_rate_mapped", new
              {
                applicationRate = profile.Rate,
                providerRate
              });
          '@
          $newRate = ($newRate -replace '(?m)^        ', '').TrimEnd()
          $rateMatches = [regex]::Matches(
            $text,
            [regex]::Escape($oldRate)).Count
          if ($rateMatches -ne 1) {
            throw "Expected exactly one over-indented rate block; found $rateMatches."
          }
          $text = $text.Replace($oldRate, $newRate)

          [IO.File]::WriteAllText(
            $path,
            $text,
            [Text.UTF8Encoding]::new($false))

      - name: Build Release
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run issue 94 focused regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Verify-VersionConsistency.ps1 -Executable $exe
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite system-speech-native-timing

      - name: Commit source cleanup
        if: success()
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/SapiSpeechEngine.cs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --cached --check failed.' }
          git commit -m 'style: clean issue 94 rate mapping source'
          if ($LASTEXITCODE -ne 0) { throw 'Source cleanup commit failed.' }
          git push origin HEAD:issue-94-system-speech-sample-rate
          if ($LASTEXITCODE -ne 0) { throw 'Source cleanup push failed.' }
