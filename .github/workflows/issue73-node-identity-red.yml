name: Issue73 stable-node playback RED

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer
    paths:
      - '.github/workflows/issue73-node-identity-red.yml'
      - 'scripts/apply-issue73-node-identity-red.py'

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact stable-node regression
        run: python scripts/apply-issue73-node-identity-red.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Release
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj -c Release
      - name: Prove exact RED
        shell: pwsh
        run: |
          $exe = 'AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe'
          $output = & $exe --test virtual-window 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -eq 0) {
            throw 'Stable-node regression unexpectedly passed before production repair.'
          }
          if ($output -notmatch 'Retained voice cursor rebound to duplicate text in another node') {
            throw "Expected stable-node RED was not observed. Exit=$code"
          }
          Write-Host 'CONFIRMED RED: retained playback rebound to duplicate text in another node.'
      - name: Commit permanent RED regression
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue37VirtualWindowRegressionTestRunner.cs
          git commit -m 'test: prevent retained playback duplicate-text rebinding (#73 #37) [issue73-stable-node-red]'
          git push origin HEAD:issue-73-ctrl-click-voice-pointer
