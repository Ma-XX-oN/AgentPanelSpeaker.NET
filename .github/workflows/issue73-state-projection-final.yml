name: Issue73 state projection final

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer
    paths:
      - '.github/workflows/issue73-state-projection-final.yml'

permissions:
  contents: write

jobs:
  final:
    runs-on: windows-latest
    steps:
      - name: Checkout candidate and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production candidate
        shell: pwsh
        run: |
          $expectedProduction = 'ac8a5cc85e1c21179f1943e19ccda3711b27a3e9'
          git merge-base --is-ancestor $expectedProduction HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Expected production candidate is not an ancestor of final-validation trigger."
          }
          $afterProduction = @(git diff --name-only $expectedProduction HEAD)
          $allowedAfterProduction = @('.github/workflows/issue73-state-projection-final.yml')
          $unexpected = @($afterProduction | Where-Object { $_ -notin $allowedAfterProduction })
          if ($unexpected.Count -ne 0) {
            throw "Non-validation files changed after production candidate: $($unexpected -join ', ')"
          }
          $core = (git -C dependencies/AIConversationCore rev-parse HEAD).Trim()
          if ($core -ne '6c92799c1b14693001e8b913465f4a12b0b1e1ab') {
            throw "Unexpected AIConversationCore submodule revision: $core"
          }

      - name: Remove issue 73 validation scaffolding locally
        shell: pwsh
        run: |
          $temporary = @(
            '.github/workflows/issue73-scroll-marker-red.yml',
            '.github/workflows/issue73-details-state-red.yml',
            '.github/workflows/issue73-state-projection-green.yml',
            '.github/workflows/issue73-state-projection-final.yml',
            'scripts/apply-issue73-scroll-marker-red.py',
            'scripts/apply-issue73-cause-independent-details-red.py',
            'scripts/apply-issue73-state-projection-fix.py'
          )
          foreach ($path in $temporary) {
            if (-not (Test-Path $path)) { throw "Expected temporary file is missing before cleanup: $path" }
            git rm -- $path
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove temporary file: $path" }
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove issue 73 validation scaffolding [issue73-state-projection-clean]'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create local cleanup commit.' }

      - name: Verify cleaned candidate before validation
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) { throw "Cleaned candidate is not clean before validation:`n$status" }
          $workflows = @(Get-ChildItem '.github/workflows' -File | Select-Object -ExpandProperty Name)
          $expected = @('core-integration-validation.yml')
          if (Compare-Object $expected $workflows) {
            throw "Unexpected workflow files remain after cleanup: $($workflows -join ', ')"
          }
          if (Test-Path scripts) {
            $scriptFiles = @(Get-ChildItem scripts -File -ErrorAction SilentlyContinue)
            if ($scriptFiles.Count -ne 0) {
              throw "Unexpected temporary scripts remain: $($scriptFiles.Name -join ', ')"
            }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install pinned AIConversationCore dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Run pinned AIConversationCore regression tests
        shell: pwsh
        run: npm test --prefix dependencies/AIConversationCore

      - name: Validate Phase 2 fixture and baseline inventory
        shell: pwsh
        run: python dependencies/AIConversationCore/tests/validate-phase2-baseline.py

      - name: Build AgentPanelSpeaker Release
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run exact issue regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          foreach ($suite in @('virtual-window','ctrl-click-voice-pointer','redundancy','user-context-speech')) {
            & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite $suite
          }

      - name: Verify test-runner completion guard
        shell: pwsh
        run: '& tools/Invoke-TestSuite.ps1 -SelfTest'

      - name: Run complete built application suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and run complete deployed suite
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'AgentPanelSpeaker publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          if (-not (Test-Path $exe)) { throw "Published application missing: $exe" }
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Verify bundled runtime from built output
        shell: pwsh
        run: |
          Remove-Item Env:AI_CONVERSATION_CORE -ErrorAction SilentlyContinue
          $outputTools = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\tools'
          $worker = Join-Path $outputTools 'AIConversationCore-worker.mjs'
          $marker = Join-Path $outputTools 'AIConversationCore-runtime\CORE_COMMIT'
          $package = Join-Path $outputTools 'AIConversationCore-runtime\package.json'
          if (-not (Test-Path $worker)) { throw "Built worker missing: $worker" }
          if (-not (Test-Path $marker)) { throw "Bundled core marker missing: $marker" }
          if (-not (Test-Path $package)) { throw "Bundled core package metadata missing: $package" }
          $probe = 'Bundled runtime check — café 東京 😀'
          $record = @{ type = 'user'; uuid = 'bundled-ci'; timestamp = '2026-09-05T00:00:00Z'; message = @{ role = 'user'; content = @(@{ type = 'text'; text = $probe }) } }
          $request = @{ operation = 'project'; provider = 'claude'; records = @($record) } | ConvertTo-Json -Depth 10 -Compress
          $response = $request | node $worker
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Bundled worker projection failed: $($decoded.error)" }
          if ($decoded.core_commit -ne '6c92799c1b14693001e8b913465f4a12b0b1e1ab') { throw "Unexpected bundled core commit: $($decoded.core_commit)" }
          if ($decoded.projection.units[0].block.text -ne $probe) { throw 'Bundled projection corrupted Unicode text.' }
          if ($decoded.projection.presentation.schema_version -ne 2) { throw 'Bundled projection returned unexpected presentation schema.' }
          if ($decoded.projection.presentation.split_policy -ne 'presentation-tree') { throw 'Bundled projection returned unexpected presentation split policy.' }

      - name: Build display validation harness
        shell: pwsh
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release

      - name: Verify AIConversationCore worker pin
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          $request = '{"operation":"ping"}'
          $response = $request | node tools/AIConversationCore-worker.mjs
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Worker ping failed: $($decoded.error)" }
          if ($decoded.core_commit -ne '6c92799c1b14693001e8b913465f4a12b0b1e1ab') { throw "Unexpected core commit: $($decoded.core_commit)" }

      - name: Verify structured Claude projection
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          $record = @{ type = 'user'; uuid = 'ci-user'; timestamp = '2026-09-05T00:00:00Z'; message = @{ role = 'user'; content = @(@{ type = 'text'; text = '<system-reminder>generated</system-reminder>CI projection check' }) } }
          $request = @{ operation = 'project'; provider = 'claude'; records = @($record) } | ConvertTo-Json -Depth 10 -Compress
          $response = $request | node tools/AIConversationCore-worker.mjs
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Projection failed: $($decoded.error)" }
          if ($decoded.projection.schema_version -ne 2) { throw 'Unexpected projection schema.' }
          if ($decoded.projection.units.Count -ne 1) { throw 'Expected one projected unit.' }
          if ($decoded.projection.units[0].source_record_id -ne 'ci-user') { throw 'Source identity was not preserved.' }
          if ($decoded.projection.units[0].block.text -ne 'CI projection check') { throw 'Interactive Claude cleanup was not applied.' }
          if ($decoded.projection.presentation.schema_version -ne 2) { throw 'Unexpected presentation schema.' }
          if ($decoded.projection.presentation.split_policy -ne 'presentation-tree') { throw 'Unexpected presentation split policy.' }
          if ($decoded.projection.presentation.tree.kind -ne 'conversation') { throw 'Canonical presentation tree is missing.' }

      - name: Verify structured Codex lifecycle projection
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          $userText = "context`n## My request for Codex:`nActual request"
          $records = @(
            @{ type = 'event_msg'; timestamp = '2026-09-05T00:00:00Z'; payload = @{ type = 'user_message'; message = $userText } },
            @{ type = 'event_msg'; timestamp = '2026-09-05T00:00:01Z'; payload = @{ type = 'task_complete' } }
          )
          $request = @{ operation = 'project'; provider = 'codex'; records = $records } | ConvertTo-Json -Depth 10 -Compress
          $response = $request | node tools/AIConversationCore-worker.mjs
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Projection failed: $($decoded.error)" }
          $user = $decoded.projection.events | Where-Object { $_.content_type -eq 'user_message' }
          $completion = $decoded.projection.events | Where-Object { $_.content_type -eq 'task_complete' }
          if ($user.blocks[0].text -ne $userText) { throw 'Recorded Codex IDE/request context was not preserved verbatim.' }
          if ($completion.lifecycle.timestamp -ne '2026-09-05T00:00:01Z') { throw 'Task completion timestamp was not preserved.' }

      - name: Validate canonical transcript display
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Validate cleaned tree and patch integrity
        shell: pwsh
        run: |
          $expectedCore = '6c92799c1b14693001e8b913465f4a12b0b1e1ab'
          $coreBeforeCleanup = (git -C dependencies/AIConversationCore rev-parse HEAD).Trim()
          if ($coreBeforeCleanup -ne $expectedCore) {
            throw "Validation changed Core revision before cleanup: $coreBeforeCleanup"
          }
          git -C dependencies/AIConversationCore reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Failed to restore Core submodule tracked files.' }
          git -C dependencies/AIConversationCore clean -fdx
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clean Core submodule validation artifacts.' }
          $coreAfterCleanup = (git -C dependencies/AIConversationCore rev-parse HEAD).Trim()
          if ($coreAfterCleanup -ne $expectedCore) {
            throw "Core revision changed during cleanup: $coreAfterCleanup"
          }
          $coreStatus = git -C dependencies/AIConversationCore status --porcelain
          if ($coreStatus) {
            throw "Core submodule is still dirty after validation cleanup:`n$coreStatus"
          }
          git fetch origin feature/aiconversationcore-integration --depth=1
          git diff --check FETCH_HEAD HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Patch integrity validation failed.' }
          $status = git status --porcelain
          if ($status) { throw "Validation changed tracked source tree:`n$status" }

      - name: Push validated cleanup commit
        shell: pwsh
        run: |
          git push origin HEAD:issue-73-ctrl-click-voice-pointer
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push validated cleaned candidate.' }
