name: Issue 106 fragment-list RED

on:
  push:
    branches:
      - issue-106-fragment-list-structure
    paths:
      - .github/workflows/issue106-red.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-106-fragment-list-structure
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Correct target-unit selection
        shell: python
        run: |
          from pathlib import Path

          path = Path('AgentPanelSpeaker/Issue75CoreWordIdMigrationRegressionTestRunner.cs')
          source = path.read_text(encoding='utf-8')
          old = '''    CanonicalHtmlUnitProjection unit = RequireHtmlUnits(projection)
              .Single(item => item.Html.Contains(
                "Nested item after the table",
                StringComparison.Ordinal));
          '''
          new = '''    CanonicalHtmlUnitProjection unit = RequireHtmlUnits(projection)
              .Single(item => ReadSpeechWords(item).Any(word =>
                string.Equals(word.Text, "strikethrough", StringComparison.Ordinal)));
          '''
          if source.count(old) != 1:
            raise SystemExit('Could not isolate issue #106 target-unit selector.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Commit corrected target-unit selection
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AgentPanelSpeaker/Issue75CoreWordIdMigrationRegressionTestRunner.cs
          git diff --cached --check
          git commit -m "test: select issue 106 unit by Core word identity"
          git push origin HEAD:issue-106-fragment-list-structure

      - name: Build RED candidate
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run exact RED regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite core-word-id-migration
