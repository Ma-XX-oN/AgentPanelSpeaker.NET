name: Temporary issue 84 pending-race RED

on:
  push:
    branches:
      - issue-75-core-word-id-migration

permissions:
  contents: write

jobs:
  record-red:
    if: "${{ github.event.head_commit.message == 'ci: record issue 84 pending-race RED' }}"
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: issue-75-core-word-id-migration
          submodules: recursive

      - name: Add proven permanent RED regression
        run: python .github/scripts/issue84-pending-race-red.py

      - name: Validate test patch
        shell: pwsh
        run: git diff --check

      - name: Commit permanent RED regression
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AgentPanelSpeaker/Issue84RewindCurrentFragmentRegressionTestRunner.cs
          git diff --cached --check
          git commit -m 'test: reproduce pending cursor rewind race'
          git push origin HEAD:issue-75-core-word-id-migration
