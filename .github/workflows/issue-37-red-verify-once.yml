name: Issue 37 RED verify once

on:
  push:
    branches:
      - issue-37-large-transcript-windowing
    paths:
      - '.github/workflows/issue-37-red-verify-once.yml'

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-37-large-transcript-windowing
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Remove one-shot workflow from branch
        shell: pwsh
        run: |
          Remove-Item .github/workflows/issue-37-red-verify-once.yml
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove issue 37 RED verifier'
          git push origin HEAD:issue-37-large-transcript-windowing

      - name: Build RED state
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require expected RED failure
        shell: pwsh
        run: |
          $output = (& dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test large-transcript-windowing 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($exitCode -eq 0) {
            throw 'Issue #37 regression unexpectedly passed before the production fix.'
          }
          if ($output -notmatch 'Initial production presentation materialized') {
            throw 'Issue #37 regression failed for an unexpected reason.'
          }
          Write-Host 'EXPECTED RED: production initial presentation still materializes the complete transcript.'
