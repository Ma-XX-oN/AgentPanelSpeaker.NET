name: Repository task

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to check out. Blank uses the selected workflow ref.
        required: false
        type: string
      task:
        description: Checked-in task name under tools/tasks (for example verify or robot).
        required: true
        default: verify
        type: string
  pull_request:
    branches:
      - main
      - feature/aiconversationcore-integration
  push:
    branches:
      - 'issue-*'

permissions:
  contents: write

jobs:
  task:
    runs-on: windows-latest

    steps:
      - name: Check out selected repository ref and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply issue 138 production fix
        if: ${{ github.event_name == 'push' && github.ref_name == 'issue-138-live-tail-dom-preservation' }}
        shell: pwsh
        run: |
          $entry = git ls-files -s -- AgentPanelSpeaker/TranscriptView.cs
          $sourceSha = ($entry -split '\s+')[1]
          if ($sourceSha -ne 'd8ea574e8b31c21702a14e84f92f58dba8960414') {
            throw "Unexpected TranscriptView.cs blob: $sourceSha"
          }

          @'
          from pathlib import Path

          path = Path('AgentPanelSpeaker/TranscriptView.cs')
          text = path.read_text(encoding='utf-8')

          def replace_once(label: str, old: str, new: str) -> None:
            global text
            count = text.count(old)
            if count != 1:
              raise RuntimeError(
                f'{label}: expected exactly one source match, found {count}')
            text = text.replace(old, new, 1)

          replace_once(
            'canonical playback refresh gate',
            """    if (!_initialized || _refreshInProgress)
    {
      return;
    }

    // A Core-backed word is resolved directly by the WebView when materialized.
""",
            """    if (!_initialized)
    {
      return;
    }

    // A Core-backed word is resolved directly by the WebView when materialized.
""")

          replace_once(
            'legacy playback refresh gate',
            """      PostPlaybackPosition(position);
      return;
    }

    // Non-canonical synthesized narration retains the pre-migration node path
""",
            """      PostPlaybackPosition(position);
      return;
    }

    if (_refreshInProgress)
    {
      return;
    }

    // Non-canonical synthesized narration retains the pre-migration node path
""")

          replace_once(
            'virtual record source state',
            """const openDisclosureOverrides = new Set();
let discardDisclosureStateOnNextReplacement = false;
""",
            """const openDisclosureOverrides = new Set();
let discardDisclosureStateOnNextReplacement = false;
const virtualRecordSourceHtml = new WeakMap();
""")

          replace_once(
            'virtual reconciliation helpers',
            """function wrapWords(nodeMap = null) {
  words = [];
  lexicalWords = [];
  ensureCoreOrdinalSpeechMaps();
  wrapWordsForRecordKeys(
    nodeMap === null ? null : nodeRecordKeys(nodeMap),
    false);
}

