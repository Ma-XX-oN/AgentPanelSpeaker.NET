name: Repository task

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to check out. Blank uses the selected workflow ref.
        required: false
        type: string
      task:
        description: Checked-in task name under tools/tasks (for example verify or robot).
        required: true
        default: verify
        type: string
  pull_request:
    branches:
      - main
      - feature/aiconversationcore-integration
  push:
    branches:
      - 'issue-*'

permissions:
  contents: write

jobs:
  task:
    runs-on: windows-latest

    steps:
      - name: Check out selected repository ref and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply issue 138 production fix
        shell: pwsh
        run: |
          $entry = git ls-files -s -- AgentPanelSpeaker/TranscriptView.cs
          $sourceSha = ($entry -split '\s+')[1]
          if ($sourceSha -ne 'd8ea574e8b31c21702a14e84f92f58dba8960414') {
            throw "Unexpected TranscriptView.cs blob: $sourceSha"
          }
          python -m py_compile tools/Issue138Patch.py
          python tools/Issue138Patch.py --check
          python tools/Issue138Patch.py
          git diff --check
          git checkout c899c879525ceaa8d50fafb0610e01deb37545c5 -- .github/workflows/repository-task.yml
          git rm tools/Issue138Patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/TranscriptView.cs .github/workflows/repository-task.yml
          git diff --cached --check
          git commit -m 'fix: preserve live-tail playback DOM identity'
          git push origin HEAD:issue-138-live-tail-dom-preservation

      - name: Run checked-in repository task
        shell: pwsh
        env:
          REPOSITORY_TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || 'verify' }}
        run: '& tools/Invoke-RepositoryTask.ps1 -Task $env:REPOSITORY_TASK'
