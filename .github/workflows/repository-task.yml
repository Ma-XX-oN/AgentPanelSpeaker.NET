name: Repository task

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to check out. Blank uses the selected workflow ref.
        required: false
        type: string
      task:
        description: Checked-in task name under tools/tasks (for example verify or robot).
        required: true
        default: verify
        type: string
  pull_request:
    branches:
      - main
      - feature/aiconversationcore-integration
  push:
    branches:
      - 'issue-*'

permissions:
  contents: write

jobs:
  task:
    runs-on: windows-latest

    steps:
      - name: Check out selected repository ref and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply issue 138 reconciliation follow-up
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $entry = git ls-files -s -- AgentPanelSpeaker/TranscriptView.cs
          $sourceSha = ($entry -split '\s+')[1]
          if ($sourceSha -ne '52e08ef3e4fe6595c43882226d340dcb2a7b05a2') {
            throw "Unexpected TranscriptView.cs blob: $sourceSha"
          }
          python -m py_compile tools/Issue138FollowupPatch.py
          if ($LASTEXITCODE -ne 0) { throw 'Follow-up patcher compilation failed.' }
          python tools/Issue138FollowupPatch.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Follow-up patch dry-run failed.' }
          python tools/Issue138FollowupPatch.py
          if ($LASTEXITCODE -ne 0) { throw 'Follow-up patch application failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Follow-up patch whitespace validation failed.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/TranscriptView.cs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged follow-up patch validation failed.' }
          git commit -m 'fix: reconcile all incoming transcript units'
          if ($LASTEXITCODE -ne 0) { throw 'Follow-up patch commit failed.' }
          git push origin HEAD:issue-138-live-tail-dom-preservation
          if ($LASTEXITCODE -ne 0) { throw 'Follow-up patch push failed.' }

      - name: Run checked-in repository task
        shell: pwsh
        env:
          REPOSITORY_TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || 'verify' }}
        run: '& tools/Invoke-RepositoryTask.ps1 -Task $env:REPOSITORY_TASK'
