name: Issue 37 selective word materialization RED

on:
  push:
    branches:
      - issue-37-selective-word-materialization
    paths:
      - '.github/workflows/issue-37-word-materialization-red.yml'

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-37-selective-word-materialization
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wire selective-word-materialization suite
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('AgentPanelSpeaker/Program.cs')
          text = path.read_text(encoding='utf-8')

          anchor = '''      if (args.Length == 2 &&
                    string.Equals(args[1], "virtual-window", StringComparison.OrdinalIgnoreCase))
                {
                  Environment.ExitCode = RunNamedSuite(
                    "virtual-window",
                    () => RunWithWinFormsMessageLoop(
                      Issue37VirtualWindowRegressionTestRunner.Run));
                  return;
                }
          '''
          addition = anchor + '''

                if (args.Length == 2 &&
                    string.Equals(args[1], "word-materialization", StringComparison.OrdinalIgnoreCase))
                {
                  Environment.ExitCode = RunNamedSuite(
                    "word-materialization",
                    () => RunWithWinFormsMessageLoop(
                      Issue37WordMaterializationRegressionTestRunner.Run));
                  return;
                }
          '''
          if 'Issue37WordMaterializationRegressionTestRunner.Run' not in text:
            if text.count(anchor) != 1:
              raise SystemExit(f'named suite anchor count={text.count(anchor)}')
            text = text.replace(anchor, addition, 1)

          child = '      int virtualWindow = RunIsolatedTestSuite("virtual-window");\n'
          child_new = child + '      int wordMaterialization = RunIsolatedTestSuite("word-materialization");\n'
          if 'int wordMaterialization = RunIsolatedTestSuite("word-materialization");' not in text:
            if text.count(child) != 1:
              raise SystemExit(f'child suite anchor count={text.count(child)}')
            text = text.replace(child, child_new, 1)

          condition = '                             virtualWindow == 0\n        ? 0\n'
          condition_new = '                             virtualWindow == 0 &&\n                             wordMaterialization == 0\n        ? 0\n'
          if '                             wordMaterialization == 0\n        ? 0\n' not in text:
            if text.count(condition) != 1:
              raise SystemExit(f'completion condition anchor count={text.count(condition)}')
            text = text.replace(condition, condition_new, 1)

          path.write_text(text, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add AgentPanelSpeaker/Program.cs AgentPanelSpeaker/Issue37WordMaterializationRegressionTestRunner.cs
          git commit -m 'test: wire issue 37 selective word-materialization oracle (#37)'
          git push origin HEAD:issue-37-selective-word-materialization

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build RED regression
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require meaningful RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'issue37-word-red-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'issue37-word-red-err.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--test','word-materialization' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $text = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          Write-Host $text
          if ($process.ExitCode -eq 0) {
            throw 'Issue #37 word-materialization regression unexpectedly passed before the fix.'
          }
          if ($text -notmatch 'Large unvoiced record was eagerly expanded into word spans') {
            throw 'Issue #37 RED failed for an unexpected reason.'
          }
          if ($text -notmatch 'TEST-SUITE-COMPLETE word-materialization exit=1') {
            throw 'Issue #37 RED did not reach the suite completion sentinel.'
          }
