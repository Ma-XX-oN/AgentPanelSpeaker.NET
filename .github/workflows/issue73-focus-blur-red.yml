name: Issue 73 WebView Blur RED

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer

permissions:
  contents: write

jobs:
  red:
    if: ${{ contains(github.event.head_commit.message, '[issue73-focus-blur-red]') }}
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply permanent blur regression only
        shell: pwsh
        run: python scripts/apply-issue73-focus-blur-red.py

      - name: Build regression candidate
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require exact regression to fail pre-fix
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & $exe --test ctrl-click-voice-pointer
          if ($LASTEXITCODE -eq 0) {
            throw 'Issue #73 WebView-blur regression unexpectedly passed before production fix.'
          }

      - name: Commit permanent RED
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'RED git diff --check failed.' }
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) })
          if ($changed.Count -ne 1 -or $changed[0] -ne 'AgentPanelSpeaker/Issue73CtrlClickVoicePointerRegressionTestRunner.cs') {
            throw "Unexpected RED changes: $($changed -join ', ')"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue73CtrlClickVoicePointerRegressionTestRunner.cs
          git commit -m 'test: preserve Ctrl mode across WebView focus loss (#73) [issue73-focus-blur-red-recorded]'
          git push origin HEAD:issue-73-ctrl-click-voice-pointer
