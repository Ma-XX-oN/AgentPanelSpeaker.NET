name: Run quoted provenance repair

on:
  push:
    branches:
      - feature/aiconversationcore-integration
    paths:
      - .github/workflows/fix-quoted-provenance-run.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0

      - name: Apply repair
        run: python scripts/fix-quoted-provenance.py

      - name: Validate diff
        run: git diff --check

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/TranscriptMarkdownFormatter.cs tools/AgentPanelSpeaker.DisplayParity/Program.cs
          git commit -m 'preserve quoted provenance structure'
          git push origin HEAD:feature/aiconversationcore-integration
