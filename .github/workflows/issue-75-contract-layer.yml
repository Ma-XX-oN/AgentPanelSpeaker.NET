name: Issue 75 Core contract layer

on:
  push:
    branches:
      - issue-75-core-word-id-migration
    paths:
      - '.github/workflows/issue-75-contract-layer.yml'
      - 'tools/issue75-contract-migration.py'

permissions:
  contents: write

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply exact contract migration
        shell: pwsh
        run: python tools/issue75-contract-migration.py

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Verify expected partial issue 75 transition
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $output = (& $exe --test core-word-id-migration 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($exitCode -ne 1) {
            throw "Expected focused suite to remain RED during the contract layer; exit=$exitCode"
          }
          $requiredPasses = @(
            'PASS  core-word-id/decimal-is-one-selectable-canonical-word',
            'PASS  core-word-id/markup-split-keeps-one-canonical-word',
            'PASS  core-word-id/duplicate-text-lookup-is-id-exact',
            'PASS  core-word-id/off-window-lookup-materializes-core-unit'
          )
          foreach ($line in $requiredPasses) {
            if (-not $output.Contains($line)) { throw "Missing expected partial GREEN: $line" }
          }
          $requiredFailures = @(
            'FAIL  core-word-id/ctrl-click-posts-exact-canonical-word-id',
            'FAIL  core-word-id/policy-is-centralized-without-per-word-eligibility-mutation'
          )
          foreach ($line in $requiredFailures) {
            if (-not $output.Contains($line)) { throw "Missing expected remaining RED: $line" }
          }
          if (-not $output.Contains('TEST-SUITE-COMPLETE core-word-id-migration exit=1')) {
            throw 'Focused suite completion marker is missing.'
          }

      - name: Commit verified contract layer
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/AIConversationCoreClient.cs AgentPanelSpeaker/TranscriptVirtualDocument.cs tools/AIConversationCore-worker.mjs
          git diff --cached --check
          git commit -m 'feat: consume Core word lookup and unit identity (#75)'
          git push origin HEAD:issue-75-core-word-id-migration
