name: Issue 35 compile fix

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
      - name: Fix escaped revision attribute literal
        shell: python
        run: |
          from pathlib import Path
          path = Path('AgentPanelSpeaker/TranscriptVirtualDocument.cs')
          text = path.read_text(encoding='utf-8')
          old = '        "data-revision-historical="true"",'
          new = '        "data-revision-historical=\\"true\\"",'
          if text.count(old) != 1:
            raise SystemExit(f'expected one malformed literal, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AgentPanelSpeaker/TranscriptVirtualDocument.cs
          git diff --cached --check
          git commit -m "fix: escape historical revision attribute literal"
          git push origin HEAD:feature/aiconversationcore-integration
