name: Issue 73 Focus GREEN

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer

permissions:
  contents: write

jobs:
  green:
    if: ${{ contains(github.event.head_commit.message, '[issue73-focus-green]') }}
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply production focus fix
        shell: pwsh
        run: python scripts/apply-issue73-focus-fix.py

      - name: Verify production diff scope
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Production git diff --check failed.' }
          $changed = @(git status --porcelain | ForEach-Object { $_.Substring(3) } | Sort-Object)
          $expected = @(
            'AgentPanelSpeaker/MainForm.cs',
            'AgentPanelSpeaker/TranscriptView.cs'
          )
          if (($changed -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected production changes: $($changed -join ', ')"
          }

      - name: Build Release
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run exact issue 73 regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--test', 'ctrl-click-voice-pointer') -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Issue #73 exact regression failed.' }

      - name: Run focused navigation and playback regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          foreach ($suite in @('find-origin', 'virtual-window', 'speech-ordinals', 'rolled-back-speech')) {
            $process = Start-Process -FilePath $exe -ArgumentList @('--test', $suite) -NoNewWindow -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$suite regression failed." }
          }

      - name: Commit production fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/MainForm.cs AgentPanelSpeaker/TranscriptView.cs
          git commit -m 'fix: route Ctrl selection mode from host window (#73) [issue73-focus-green-recorded]'
          git push origin HEAD:issue-73-ctrl-click-voice-pointer