name: Acceptance production repair validation

on:
  push:
    branches:
      - acceptance-fixes-20260912
    paths:
      - '.github/workflows/acceptance-fixes.yml'
      - '.tmp/apply-acceptance-fixes-v6.py'

permissions:
  contents: write

jobs:
  validate-fixes:
    runs-on: windows-latest

    steps:
      - name: Check out repair branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Install exact permanent RED set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git checkout d00e6903a5fdb80c7633883ebbd5ed9ed2ba580a -- AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs
          git checkout a37bc7c49e59f54438a555388e92285b44fff500 -- AgentPanelSpeaker/Issue46IndependentRegressionOracleTestRunner.cs
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Permanent RED synchronization failed whitespace validation.' }

      - name: Apply production repairs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .tmp/apply-acceptance-fixes-v6.py
          if ($LASTEXITCODE -ne 0) { throw 'Production repair generator failed.' }

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Production repair whitespace validation failed.' }

          $changed = @(git diff HEAD --name-only)
          $expected = @(
            'AgentPanelSpeaker/InputDiagnosticTracker.cs',
            'AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs',
            'AgentPanelSpeaker/Issue46IndependentRegressionOracleTestRunner.cs',
            'AgentPanelSpeaker/Issue54RealSessionRegressionTestRunner.cs',
            'AgentPanelSpeaker/JsonlSessionMonitor.cs',
            'AgentPanelSpeaker/MainForm.cs',
            'AgentPanelSpeaker/SpeechService.cs',
            'AgentPanelSpeaker/TranscriptView.cs',
            'README.md'
          )
          if (@(Compare-Object $changed $expected).Count -ne 0) {
            throw "Unexpected production/test changed files: $($changed -join ', ')"
          }

      - name: Build repaired application
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run exact six RED suites GREEN
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $suites = @(
            'independent-oracles',
            'core-word-id-migration',
            'real-session-fixes'
          )
          foreach ($suite in $suites) {
            & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite $suite
          }

      - name: Run directly impacted regression suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $suites = @(
            'user-context-speech',
            'rolled-back-speech',
            'virtual-window',
            'word-materialization',
            'ctrl-click-voice-pointer'
          )
          foreach ($suite in $suites) {
            & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite $suite
          }

      - name: Commit verified production repairs
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/InputDiagnosticTracker.cs
          git add AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs
          git add AgentPanelSpeaker/Issue46IndependentRegressionOracleTestRunner.cs
          git add AgentPanelSpeaker/Issue54RealSessionRegressionTestRunner.cs
          git add AgentPanelSpeaker/JsonlSessionMonitor.cs
          git add AgentPanelSpeaker/MainForm.cs
          git add AgentPanelSpeaker/SpeechService.cs
          git add AgentPanelSpeaker/TranscriptView.cs
          git add README.md
          git commit -m 'fix: repair real-machine acceptance regressions'
          $fixed = git rev-parse HEAD
          "Verified production repair commit: $fixed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          git push origin HEAD:acceptance-fixes-20260912
