name: Temporary issue 96 remove SSML matrix

on:
  push:
    branches:
      - issue-94-system-speech-sample-rate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Remove issue 96 diagnostic feature
        shell: pwsh
        run: |
          $script = @'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
              raise RuntimeError(f"{label}: expected exactly one match, found {count}")
            return text.replace(old, new, 1)

          main_path = Path("AgentPanelSpeaker/MainForm.cs")
          main = main_path.read_text(encoding="utf-8")
          main = replace_once(main,
            "  private readonly Button _systemSpeechMatrixButton = new();\n",
            "",
            "matrix button field")
          main = replace_once(main,
            "  private bool _systemSpeechMatrixActive;\n",
            "",
            "matrix active field")
          main = replace_once(main,
            "    ConfigureButton(_systemSpeechMatrixButton, \"SSML Matrix...\");\n"
            "    _toolTip.SetToolTip(\n"
            "      _systemSpeechMatrixButton,\n"
            "      \"Run the controlled System.Speech SSML provider diagnostic\");\n",
            "",
            "matrix button configuration")
          main = replace_once(main,
            "      _pronunciationsButton, _systemSpeechMatrixButton,\n",
            "      _pronunciationsButton,\n",
            "matrix options layout")
          main = replace_once(main,
            "      _systemSpeechMatrixButton,\n",
            "",
            "matrix tab order")
          main = replace_once(main,
            "    MatchButtonHeight(_systemSpeechMatrixButton, _fenceTypesTextBox.PreferredHeight);\n",
            "",
            "matrix height normalization")
          main = replace_once(main,
            "    _systemSpeechMatrixButton.Click += SystemSpeechMatrixButtonClicked;\n",
            "",
            "matrix click wiring")
          method_pattern = re.compile(
            r"\n  /// <summary>\n"
            r"  /// Runs the isolated System\.Speech SSML provider matrix\.\n"
            r"  /// </summary>\n"
            r"  private async void SystemSpeechMatrixButtonClicked\([\s\S]*?"
            r"\n  }\n\n(?=  /// <summary>\n"
            r"  /// Opens the spelling and pronunciation-rule editor\.)")
          main, count = method_pattern.subn("\n", main, count=1)
          if count != 1:
            raise RuntimeError(f"matrix click handler: expected one match, found {count}")
          main = replace_once(main,
            "    _systemSpeechMatrixButton.Enabled =\n"
            "      !_systemSpeechMatrixActive &&\n"
            "      !_monitor.IsRunning &&\n"
            "      !_playPauseTransitioning &&\n"
            "      !_speech.IsSpeaking &&\n"
            "      _installedVoices.Any(voice =>\n"
            "        voice.Provider == SpeechVoiceProvider.SystemSpeech);\n",
            "",
            "matrix enabled state")
          main_path.write_text(main, encoding="utf-8")

          program_path = Path("AgentPanelSpeaker/Program.cs")
          program = program_path.read_text(encoding="utf-8")
          program = replace_once(program,
            "      if (args.Length == 2 &&\n"
            "          string.Equals(\n"
            "            args[1],\n"
            "            \"system-speech-matrix\",\n"
            "            StringComparison.OrdinalIgnoreCase))\n"
            "      {\n"
            "        Environment.ExitCode = RunNamedSuite(\n"
            "          \"system-speech-matrix\",\n"
            "          Issue96SystemSpeechMatrixRegressionTestRunner.Run);\n"
            "        return;\n"
            "      }\n\n",
            "",
            "matrix CLI suite")
          program = replace_once(program,
            "      int systemSpeechMatrix = RunIsolatedTestSuite(\n"
            "        \"system-speech-matrix\");\n",
            "",
            "matrix all-suite child")
          program = replace_once(program,
            "                             systemSpeechProvenance == 0 &&\n"
            "                             systemSpeechMatrix == 0\n",
            "                             systemSpeechProvenance == 0\n",
            "matrix all-suite result")
          program_path.write_text(program, encoding="utf-8")
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP 'remove-issue96.py'
          Set-Content -LiteralPath $scriptPath -Value $script -Encoding utf8
          python $scriptPath
          if ($LASTEXITCODE -ne 0) { throw 'Targeted issue #96 source removal failed.' }

          git rm -f --ignore-unmatch `
            AgentPanelSpeaker/Issue96SystemSpeechMatrixRegressionTestRunner.cs `
            AgentPanelSpeaker/SystemSpeechMatrixDiagnosticRunner.cs `
            AgentPanelSpeaker/SystemSpeechMatrixDialog.cs

          $verify = @'
          from pathlib import Path
          import re

          pattern = re.compile(r"systemSpeechMatrix|SystemSpeechMatrix|SSML Matrix|system-speech-matrix")
          hits = []
          for path in Path("AgentPanelSpeaker").rglob("*"):
            if not path.is_file():
              continue
            try:
              text = path.read_text(encoding="utf-8")
            except UnicodeDecodeError:
              continue
            for index, line in enumerate(text.splitlines(), 1):
              if pattern.search(line):
                hits.append(f"{path}:{index}:{line}")
          if hits:
            raise RuntimeError("SSML matrix implementation/wiring remains:\n" + "\n".join(hits))
          '@
          $verifyPath = Join-Path $env:RUNNER_TEMP 'verify-issue96-removed.py'
          Set-Content -LiteralPath $verifyPath -Value $verify -Encoding utf8
          python $verifyPath
          if ($LASTEXITCODE -ne 0) { throw 'Issue #96 removal verification failed.' }

      - name: Build after removal
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run System.Speech provenance regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite system-speech-provenance

      - name: Commit removal
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (-not (git status --porcelain)) { throw 'Issue #96 removal produced no changes.' }
          git commit -m "cleanup: remove SSML matrix diagnostic"
          git push origin HEAD:issue-94-system-speech-sample-rate
