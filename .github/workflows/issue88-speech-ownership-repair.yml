name: Issue 88 speech ownership repair

on:
  push:
    branches:
      - issue-75-core-word-id-migration
    paths:
      - .github/workflows/issue88-speech-ownership-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: issue-75-core-word-id-migration
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Establish permanent RED
        shell: pwsh
        run: |
          python tools/issue88-apply.py red
          if ($LASTEXITCODE -ne 0) { throw 'Failed to wire the issue #88 RED.' }
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'RED build failed; regression must compile before production repair.' }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & $exe --test speech-ownership
          if ($LASTEXITCODE -eq 0) {
            throw 'Issue #88 regression unexpectedly passed before the production repair.'
          }
          Write-Host 'Expected RED reproduced.'

      - name: Apply production repair
        shell: pwsh
        run: |
          python tools/issue88-apply.py green
          if ($LASTEXITCODE -ne 0) { throw 'Issue #88 production applicator failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed after repair.' }

      - name: Build repaired application
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Repaired application failed to build.' }

      - name: Run focused speech ownership regression
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & $exe --test speech-ownership
          if ($LASTEXITCODE -ne 0) { throw 'Issue #88 focused regression failed.' }

      - name: Run adjacent regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & $exe --test core-word-id-migration
          if ($LASTEXITCODE -ne 0) { throw 'Issue #75 Core WordId regression failed.' }
          & $exe --test rewind-current-fragment
          if ($LASTEXITCODE -ne 0) { throw 'Issue #84 rewind regression failed.' }

      - name: Run complete built application suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and run complete deployed suite
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Commit verified repair
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker
          if (git diff --cached --quiet) {
            throw 'Repair produced no production/test changes to commit.'
          }
          git commit -m 'fix: preserve exact speech ownership'
          git push origin HEAD:issue-75-core-word-id-migration
