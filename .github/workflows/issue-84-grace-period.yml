name: Temporary issue 84 one-second grace

on:
  push:
    branches:
      - issue-75-core-word-id-migration

permissions:
  contents: write

jobs:
  validate:
    if: "${{ github.event.head_commit.message == 'ci: validate issue 84 one-second grace' }}"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-75-core-word-id-migration
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python .github/scripts/issue84-grace-period.py test
      - run: python .github/scripts/issue84-grace-period.py production
      - shell: pwsh
        run: git diff --check
      - shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
      - shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite rewind-current-fragment
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all
      - shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/SpeechService.cs AgentPanelSpeaker/Issue84RewindCurrentFragmentRegressionTestRunner.cs
          git commit -m 'fix: extend rewind grace to one second'
          git push origin HEAD:issue-75-core-word-id-migration
