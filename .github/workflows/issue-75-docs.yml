name: Issue 75 architecture docs

on:
  push:
    branches:
      - issue-75-core-word-id-migration
    paths:
      - '.github/workflows/issue-75-docs.yml'
      - 'tools/issue75-docs.py'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply architecture documentation
        run: python tools/issue75-docs.py

      - name: Verify documented invariants
        shell: bash
        run: |
          grep -F '## Canonical transcript word identity' DESIGN.md
          grep -F 'AIConversationCoreClient.LocateRetainedWord()' DESIGN.md
          grep -F 'Core is therefore the sole semantic word-to-unit resolver' DESIGN.md
          grep -F '169814bf407ac3b5c9f3757b724df10aeddef5de' DESIGN.md
          ! grep -F 'a6fd322aece692cd0c90bc89f11228b3a4e83520' DESIGN.md
          git diff --check

      - name: Commit architecture documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DESIGN.md
          git commit -m 'docs: define Core word-ID playback boundary (#75)'
          git push origin HEAD:issue-75-core-word-id-migration
