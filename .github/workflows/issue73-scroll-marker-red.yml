name: Issue73 scroll marker RED

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer
    paths:
      - '.github/workflows/issue73-scroll-marker-red.yml'
      - 'scripts/apply-issue73-scroll-marker-red.py'

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact real-machine regression
        run: python scripts/apply-issue73-scroll-marker-red.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prove exact RED
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj -c Release
          $exe = 'AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.exe'
          $output = & $exe --test virtual-window 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Host $output
          if ($exit -eq 0) { throw 'Regression unexpectedly passed before production repair.' }
          if ($output -notmatch 'Paused voice cursor disappeared after manual-scroll eviction and rematerialization') {
            throw 'Expected real-machine marker-rematerialization RED was not observed.'
          }
          Write-Host 'RED confirmed: exact real-machine marker-rematerialization regression failed as required.'
          exit 0
      - name: Commit permanent RED regression
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue37VirtualWindowRegressionTestRunner.cs
          git commit -m 'test: reproduce scroll-evicted voice cursor loss (#73) [issue73-scroll-marker-red]'
          git push origin HEAD:issue-73-ctrl-click-voice-pointer
