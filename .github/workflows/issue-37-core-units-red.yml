name: Issue 37 Core-unit containment RED

on:
  push:
    branches:
      - issue-37-vwindow-convergence-containment
    paths:
      - '.github/workflows/issue-37-core-units-red.yml'

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-37-vwindow-convergence-containment
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Replace caller-inference containment oracle with Core-unit oracle
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from textwrap import dedent

          path = Path('AgentPanelSpeaker/Issue37VirtualWindowRegressionTestRunner.cs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
            '("virtual-window/single-anchor-details-is-atomic",\n        TestSingleAnchorDetailsIsAtomic),',
            '("virtual-window/core-single-anchor-user-context-unit-is-preserved",\n        TestCoreSingleAnchorUserContextUnitIsPreserved),',
            1)

          start_marker = '  /// <summary>\n  /// A details element that owns even one canonical record anchor is an atomic\n'
          end_marker = '  /// <summary>\n  /// Loads a transcript large enough to exceed one virtual window through the\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
            raise SystemExit('single-anchor test replacement markers did not match exactly')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = dedent('''\
            /// <summary>
            /// A complete Core-rendered User Context turn containing one source anchor
            /// must remain one virtual unit.  AgentPanelSpeaker receives the legal cut
            /// and source identities from Core; this test deliberately does not infer
            /// atomicity from the unit's details markup.
            /// </summary>
            private static void TestCoreSingleAnchorUserContextUnitIsPreserved()
            {
              const string html = """
            <section class="transcript-turn" data-presentation-id="turn:user-context">
              <h2>User</h2>
              <blockquote class="transcript-turn-body">
                <blockquote class="user-context">
                  <details class="user-context-details" data-presentation-id="context:1">
                    <summary># Context from my IDE setup:</summary>
                    <span class="record-anchor" data-jsonl-record="11" data-source-id="context"></span>
                    <h2>Active file:</h2><p>sessions/example.jsonl</p>
                    <h2>Active selection of the file:</h2><p>selected line</p>
                    <h2>Open tabs:</h2><ul><li>example.jsonl: sessions/example.jsonl</li></ul>
                  </details>
                </blockquote>
                <div class="presentation-content"><p>Actual prompt.</p></div>
              </blockquote>
            </section>
            """;

              CanonicalHtmlUnitProjection[] units =
              {
                new(
                  "turn:user-context",
                  "turn",
                  true,
                  new[]
                  {
                    new CanonicalHtmlSourceProjection(
                      "event:user-context",
                      "codex",
                      "context",
                      10,
                      new[] { 0, 1 })
                  },
                  html)
              };

              MethodInfo? build = typeof(TranscriptVirtualDocument).GetMethod(
                "Build",
                BindingFlags.Static | BindingFlags.Public | BindingFlags.NonPublic,
                binder: null,
                types: new[] { typeof(IReadOnlyList<CanonicalHtmlUnitProjection>) },
                modifiers: null);
              Require(
                build is not null,
                "TranscriptVirtualDocument has no Core-unit Build overload; " +
                "the production path still discovers boundaries from completed HTML.");

              object? built = build!.Invoke(null, new object[] { units });
              TranscriptVirtualDocument document = built as TranscriptVirtualDocument ??
                throw new InvalidOperationException(
                  "Core-unit Build overload did not return a TranscriptVirtualDocument.");
              Require(document.Count == 1,
                $"Expected one Core unit to remain one virtual record, got {document.Count}.");
              Require(
                document.TryGetIndex(11, "context", out int contextIndex),
                "Virtual document did not map Core source metadata to the one-based record identity.");
              TranscriptVirtualRecord contextRecord = document.Records[contextIndex];
              Require(
                string.Equals(contextRecord.Html, html, StringComparison.Ordinal),
                "Virtualization changed or split the already-rendered Core HTML unit.");
              Require(
                contextRecord.Html.Contains("Actual prompt.", StringComparison.Ordinal),
                "Core User Context turn lost its prompt while entering virtualization.");
            }

          ''')
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue37VirtualWindowRegressionTestRunner.cs
          git diff --cached --check
          git commit -m 'test: make #37 containment oracle consume Core units'
          git push origin HEAD:issue-37-vwindow-convergence-containment

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build RED implementation
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require Core-unit containment regression to reproduce
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'red-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'red-err.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--test','virtual-window' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $text = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          Write-Host $text
          if ($p.ExitCode -eq 0) { throw 'Expected #37 Core-unit containment regression to be RED before integration.' }
          if ($text -notmatch 'FAIL  virtual-window/core-single-anchor-user-context-unit-is-preserved') {
            throw 'Core-unit containment regression did not reproduce.'
          }
          if ($text -notmatch 'TranscriptVirtualDocument has no Core-unit Build overload') {
            throw 'Core-unit RED failed for an unexpected reason.'
          }
          if ($text -notmatch 'TEST-SUITE-COMPLETE virtual-window exit=1') {
            throw 'Virtual-window RED suite did not reach completion sentinel.'
          }
          Write-Host 'RED-PROVEN issue-37 core-unit-containment'
