name: Finish Codex history integration

on:
  push:
    branches:
      - feature/aiconversationcore-integration
    paths:
      - .github/workflows/finish-codex-history.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0
      - name: Apply monitor fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('AgentPanelSpeaker/JsonlSessionMonitor.cs')
          text = path.read_text(encoding='utf-8')
          old = '''        SpeechHistorySnapshot initialHistory = LoadExistingHistory(
          session,
          settings.SpeakExistingLatestTurn,
          ref nextNodeId,
          recentFingerprintQueue,
          recentFingerprintSet,
          preview,
          pendingInputRequests);'''
          new = '''        SpeechHistorySnapshot initialHistory = LoadExistingHistory(
          session,
          settings.SpeakExistingLatestTurn,
          ref nextNodeId,
          recentFingerprintQueue,
          recentFingerprintSet,
          preview,
          pendingInputRequests,
          settings.IncludeRolledBackTurns);'''
          if text.count(old) != 1:
            raise SystemExit('initial history call did not match exactly once')
          text = text.replace(old, new, 1)
          text = text.replace(
            '''              preview,
              pendingInputRequests,
            settings.IncludeRolledBackTurns);''',
            '''              preview,
              pendingInputRequests,
              settings.IncludeRolledBackTurns);''',
            1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add AgentPanelSpeaker/JsonlSessionMonitor.cs
          git commit -m "fix: pass Codex history visibility at monitor startup"
          git push origin HEAD:feature/aiconversationcore-integration
