name: Finish Codex history integration

on:
  push:
    branches:
      - feature/aiconversationcore-integration
    paths:
      - .github/workflows/finish-codex-history.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0
      - name: Apply monitor fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('AgentPanelSpeaker/JsonlSessionMonitor.cs')
          text = path.read_text(encoding='utf-8')
          start = text.index('SpeechHistorySnapshot initialHistory = LoadExistingHistory(')
          end = text.index(');', start) + 2
          call = text[start:end]
          if 'settings.IncludeRolledBackTurns' in call:
            raise SystemExit('initial history call is already fixed')
          if 'pendingInputRequests' not in call:
            raise SystemExit('initial history call has unexpected shape')
          fixed = call.replace(
            'pendingInputRequests);',
            'pendingInputRequests,\n          settings.IncludeRolledBackTurns);')
          if fixed == call:
            raise SystemExit('initial history syntax anchor was not found')
          text = text[:start] + fixed + text[end:]
          text = re.sub(
            r'(\n\s+pendingInputRequests,\n)\s{12}(settings\.IncludeRolledBackTurns\);)',
            lambda match: match.group(1) + '              ' + match.group(2),
            text,
            count=1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add AgentPanelSpeaker/JsonlSessionMonitor.cs
          git commit -m "fix: pass Codex history visibility at monitor startup"
          git push origin HEAD:feature/aiconversationcore-integration
