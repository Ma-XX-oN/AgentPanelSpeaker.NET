name: Issue 73 Ctrl-click RED

on:
  push:
    branches:
      - issue-73-ctrl-click-voice-pointer

permissions:
  contents: write

jobs:
  red:
    if: ${{ !contains(github.event.head_commit.message, '[issue73-red-finalized]') }}
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Register permanent issue 73 regression suite
        shell: pwsh
        run: python scripts/apply-issue73-red.py

      - name: Commit permanent RED registration
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add AgentPanelSpeaker/Program.cs
            git commit -m 'test: register issue 73 regression suite [issue73-red-finalized]'
            git push origin HEAD:issue-73-ctrl-click-voice-pointer
          }

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run issue 73 regression suite expecting RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & $exe --test ctrl-click-voice-pointer
