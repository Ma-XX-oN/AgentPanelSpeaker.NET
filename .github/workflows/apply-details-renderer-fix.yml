name: Apply details renderer fix

on:
  push:
    branches:
      - feature/aiconversationcore-integration
    paths:
      - .github/workflows/apply-details-renderer-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          submodules: recursive

      - name: Apply patch
        run: python tools/apply-details-renderer-fix.py

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AgentPanelSpeaker/TranscriptView.cs tools/AgentPanelSpeaker.DisplayParity/Program.cs
          git commit -m "render details bodies inside disclosure"
          git push origin HEAD:feature/aiconversationcore-integration
