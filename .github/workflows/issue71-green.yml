name: Issue 71 stale Find GREEN

on:
  push:
    branches:
      - issue-71-stale-find-materialization

permissions:
  contents: write

jobs:
  green:
    if: ${{ !contains(github.event.head_commit.message, '[issue71-green-verified]') }}
    runs-on: windows-2025
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply production fix
        run: python scripts/apply-issue71-fix.py

      - name: Build Release
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run exact real-session regression suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite real-session-fixes

      - name: Run Find-origin regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite find-origin

      - name: Run virtual-window regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite virtual-window

      - name: Validate whitespace
        run: git diff --check

      - name: Commit verified production fix
        shell: pwsh
        run: |
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add AgentPanelSpeaker/TranscriptView.cs
          if (git diff --cached --quiet) { throw 'Issue #71 helper produced no production change.' }
          git commit -m 'fix: invalidate stale Find materialization before install (#71) [issue71-green] [issue71-green-verified]'
          git push origin HEAD:issue-71-stale-find-materialization
