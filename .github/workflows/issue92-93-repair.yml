name: Issue 92 93 preview and provenance repair

on:
  push:
    branches:
      - issue-75-core-word-id-migration

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest

    steps:
      - name: Check out integration branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-75-core-word-id-migration
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Establish issue 92 and 93 RED
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/issue92-93-apply.py red
          if ($LASTEXITCODE -ne 0) { throw 'RED applicator failed.' }
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'RED test build failed.' }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'

          $previewFailed = $false
          try {
            & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite preview-cursor
          }
          catch {
            $previewFailed = $true
            Write-Host "Expected issue #92 RED: $($_.Exception.Message)"
          }

          $provenanceFailed = $false
          try {
            & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite system-speech-provenance
          }
          catch {
            $provenanceFailed = $true
            Write-Host "Expected issue #93 RED: $($_.Exception.Message)"
          }

          if (-not $previewFailed) {
            throw 'Issue #92 RED unexpectedly passed on old production code.'
          }
          if (-not $provenanceFailed) {
            throw 'Issue #93 RED unexpectedly passed on old production code.'
          }
          Write-Host 'RED proven for both #92 and #93.'

      - name: Restore untouched production before GREEN
        shell: pwsh
        run: |
          git checkout -- AgentPanelSpeaker/Program.cs
          Remove-Item AgentPanelSpeaker/Issue92PreviewCursorRegressionTestRunner.cs -Force
          Remove-Item AgentPanelSpeaker/Issue93SystemSpeechProvenanceRegressionTestRunner.cs -Force
          if (git status --porcelain | Select-String 'AgentPanelSpeaker/') {
            throw 'RED cleanup left application changes behind.'
          }

      - name: Apply issue 92 and 93 production repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/issue92-93-applicator-fix.py
          if ($LASTEXITCODE -ne 0) { throw 'Applicator correction failed.' }
          python tools/issue92-93-apply.py green
          if ($LASTEXITCODE -ne 0) { throw 'GREEN applicator failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'GREEN patch has whitespace errors.' }

      - name: Build repaired application
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Repaired application failed to build.' }

      - name: Run focused repaired regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          foreach ($suite in @(
            'preview-cursor',
            'system-speech-provenance',
            'speech-ownership',
            'core-word-id-migration',
            'rewind-current-fragment',
            'rolled-back-speech')) {
            & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite $suite
          }

      - name: Commit clean production candidate
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue92-93-repair.yml
          git rm tools/issue92-93-apply.py
          git rm tools/issue92-93-applicator-fix.py
          git add AgentPanelSpeaker
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Candidate staged diff has whitespace errors.' }
          git commit -m 'fix: preserve Zira provenance and preview cursor'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate commit failed.' }
          if (git status --porcelain) { throw 'Candidate commit is not a clean tree.' }
          Write-Host "Clean candidate: $(git rev-parse HEAD)"

      - name: Install pinned AIConversationCore dependencies at clean candidate
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Verify pinned AIConversationCore at clean candidate
        shell: pwsh
        run: |
          $expected = '134d5735b44b8d131d30d5b98a6e3a06320a113f'
          $actual = git -C dependencies/AIConversationCore rev-parse HEAD
          if ($actual.Trim() -ne $expected) {
            throw "Unexpected AIConversationCore submodule revision: $actual"
          }
          npm test --prefix dependencies/AIConversationCore
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Core regression tests failed.' }
          python dependencies/AIConversationCore/tests/validate-phase2-baseline.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2 baseline validation failed.' }

      - name: Rebuild exact clean candidate
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Clean candidate failed to build.' }
          & tools/Invoke-TestSuite.ps1 -SelfTest

      - name: Run complete built suite at clean candidate
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and run complete deployed suite at clean candidate
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          if (-not (Test-Path $exe)) { throw "Published application missing: $exe" }
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Verify bundled runtime and display harness at clean candidate
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Display validation harness failed to build.' }
          $request = '{"operation":"ping"}'
          $response = $request | node tools/AIConversationCore-worker.mjs
          $decoded = $response | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Worker ping failed: $($decoded.error)" }
          if ($decoded.core_commit -ne '134d5735b44b8d131d30d5b98a6e3a06320a113f') {
            throw "Unexpected core commit: $($decoded.core_commit)"
          }
          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical display validation failed.' }

      - name: Verify clean candidate patch integrity
        shell: pwsh
        run: |
          git diff --check HEAD^ HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Final commit has whitespace errors.' }
          if (git status --porcelain) { throw 'Verification dirtied the clean candidate.' }

      - name: Push verified clean candidate
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          git push origin HEAD:issue-75-core-word-id-migration
          if ($LASTEXITCODE -ne 0) { throw 'Verified candidate push failed.' }
          Write-Host "Pushed verified clean head: $head"
