name: Apply Codex history integration

on:
  push:
    paths:
      - .github/workflows/apply-codex-history-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply tracked changes
        env:
          CORE_COMMIT: 9ab9e4f5bd5f4e4a02653267ed118c378912617f
        run: |
          set -euo pipefail
          git -C dependencies/AIConversationCore fetch origin "$CORE_COMMIT"
          git -C dependencies/AIConversationCore checkout --detach "$CORE_COMMIT"
          python .github/scripts/apply_codex_history.py
          printf '%s\n' "$CORE_COMMIT" > tools/AIConversationCore-runtime/CORE_COMMIT
          rsync -a dependencies/AIConversationCore/src/ tools/AIConversationCore-runtime/src/
          cp dependencies/AIConversationCore/package.json tools/AIConversationCore-runtime/package.json
          git diff --check
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add AgentPanelSpeaker tools dependencies/AIConversationCore \
            .github/workflows/core-integration-validation.yml
          git commit -m "feat: integrate Codex revision history through core"
          git push origin HEAD:feature/aiconversationcore-integration
