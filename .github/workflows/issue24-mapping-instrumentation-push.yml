name: Issue 24 mapping instrumentation push

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  instrument:
    if: github.event.head_commit.message == 'chore: trigger issue 24 mapping instrumentation'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply targeted mapping diagnostics
        shell: pwsh
        run: python .github/scripts/issue24_mapping_instrumentation_patch.py
      - name: Validate instrumentation build and acceptance tests
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test
          git diff --check
      - name: Commit instrumentation
        shell: bash
        run: |
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add AgentPanelSpeaker/TranscriptView.cs AgentPanelSpeaker/Issue24ProductionPathRegressionTestRunner.cs
          git commit -m "diag: capture issue 24 mapping failure state"
          git push origin HEAD:feature/aiconversationcore-integration
