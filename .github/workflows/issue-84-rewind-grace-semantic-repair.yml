name: Temporary issue 84 rewind grace semantic repair

on:
  push:
    branches:
      - issue-84-rewind-grace-semantic-fix

permissions:
  contents: write

jobs:
  finalize-comments:
    if: "${{ github.event.head_commit.message == 'ci: finalize issue 84 rewind comments' }}"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-84-rewind-grace-semantic-fix
          fetch-depth: 0

      - name: Correct reaction-window comments
        run: python .github/scripts/issue84-final-comments.py

      - name: Validate comment-only patch
        shell: pwsh
        run: |
          git diff --check
          $changed = git diff --name-only
          if ($changed.Count -ne 1 -or $changed[0] -ne 'AgentPanelSpeaker/SpeechService.cs') {
            throw "Unexpected files changed: $($changed -join ', ')"
          }

      - name: Commit corrected comments
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/SpeechService.cs
          git commit -m 'docs: clarify rewind reaction timing'
          git push origin HEAD:issue-84-rewind-grace-semantic-fix
