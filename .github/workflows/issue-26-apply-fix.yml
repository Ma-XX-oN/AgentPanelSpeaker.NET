name: Apply issue 26 production fix

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Patch production path
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected 1 match, got {count}')
            return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label):
            text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
            if count != 1:
              raise SystemExit(f'{label}: expected 1 match, got {count}')
            return text

          p = Path('AgentPanelSpeaker/SettingsChangeSet.cs')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
            s,
            '      AddScalar("Transcript/Maximized", ["Transcript", "Maximized"], oldValue.Maximized, newValue.Maximized);',
            '      AddScalar("Transcript/Maximized", ["Transcript", "Maximized"], oldValue.Maximized, newValue.Maximized);\n'
            '      AddScalar("Transcript/ShowRolledBackHistory", ["Transcript", "Show rolled-back Codex history"], oldValue.ShowRolledBackHistory, newValue.ShowRolledBackHistory);\n'
            '      AddScalar("Transcript/SpeakUserContext", ["Transcript", "Speak User / IDE context"], oldValue.SpeakUserContext, newValue.SpeakUserContext);',
            'SettingsChangeSet.GetChanges')
          s = replace_once(
            s,
            '        Maximized = Pick("Transcript/Maximized", saved.Transcript.Maximized, working.Transcript.Maximized)',
            '        Maximized = Pick("Transcript/Maximized", saved.Transcript.Maximized, working.Transcript.Maximized),\n'
            '        ShowRolledBackHistory = Pick("Transcript/ShowRolledBackHistory", saved.Transcript.ShowRolledBackHistory, working.Transcript.ShowRolledBackHistory),\n'
            '        SpeakUserContext = Pick("Transcript/SpeakUserContext", saved.Transcript.SpeakUserContext, working.Transcript.SpeakUserContext)',
            'SettingsChangeSet.MergeSelected')
          p.write_text(s, encoding='utf-8', newline='\n')

          p = Path('AgentPanelSpeaker/MainForm.cs')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
            s,
            '  private async Task StartMonitoringAsync()\n',
            '  private async Task StartMonitoringAsync(bool resumePreindexedHistory = true)\n',
            'StartMonitoringAsync signature')
          s = replace_once(
            s,
            '      if (reusePausedHistory)\n'
            '      {\n'
            '        PauseToggleResult result = _speech.TogglePause(allowIdlePause: true);\n'
            '        AppendLog(result == PauseToggleResult.Resumed\n'
            '          ? "Monitoring started; playback resumed from indexed history."\n'
            '          : "Monitoring started, but indexed playback could not resume.");\n'
            '      }\n'
            '      else\n'
            '      {\n'
            '        AppendLog("Monitoring started; existing history is being indexed.");\n'
            '      }',
            '      if (reusePausedHistory && resumePreindexedHistory)\n'
            '      {\n'
            '        PauseToggleResult result = _speech.TogglePause(allowIdlePause: true);\n'
            '        AppendLog(result == PauseToggleResult.Resumed\n'
            '          ? "Monitoring started; playback resumed from indexed history."\n'
            '          : "Monitoring started, but indexed playback could not resume.");\n'
            '      }\n'
            '      else if (reusePausedHistory)\n'
            '      {\n'
            '        AppendLog("Monitoring restarted with refreshed paused history.");\n'
            '      }\n'
            '      else\n'
            '      {\n'
            '        AppendLog("Monitoring started; existing history is being indexed.");\n'
            '      }',
            'StartMonitoringAsync reuse')
          s = replace_once(
            s,
            '    if (historyProjectionChanged && !_monitor.IsRunning &&\n',
            '    if (historyProjectionChanged &&\n',
            'running projection gate')
          s = sub_once(
            s,
            r'^\s*_selectedSessionHistory = null;\n\s*_selectedSessionHistoryPath = null;\n\s*_ = LoadPausedHistoryPreviewAsync\(session\);$',
            '        _ = RefreshHistoryProjectionAsync(session);',
            'history reload')
          marker = '  private async Task LoadPausedHistoryPreviewAsync(LocatedSession session)\n'
          helper = (
            '  /// <summary>\n'
            '  /// Reprojects the selected session after a Core-owned history/speech\n'
            '  /// option changes. A running monitor is restarted around the same\n'
            '  /// canonical history load so indexed and future records use the same\n'
            '  /// projection options.\n'
            '  /// </summary>\n'
            '  private async Task RefreshHistoryProjectionAsync(LocatedSession session)\n'
            '  {\n'
            '    bool restartMonitor = _monitor.IsRunning;\n'
            '    bool resumePlayback = restartMonitor && !_speech.IsPaused;\n'
            '    if (restartMonitor)\n'
            '    {\n'
            '      Interlocked.Increment(ref _monitorSession);\n'
            '      _monitor.Stop("transcript projection settings changed");\n'
            '      _speech.CancelAll();\n'
            '    }\n\n'
            '    _selectedSessionHistory = null;\n'
            '    _selectedSessionHistoryPath = null;\n'
            '    await LoadPausedHistoryPreviewAsync(session);\n\n'
            '    if (!restartMonitor || _closing || IsDisposed ||\n'
            '        _selectedSessionHistory is null ||\n'
            '        !PathsReferToSameFile(_selectedSessionHistoryPath, session.Path))\n'
            '    {\n'
            '      return;\n'
            '    }\n\n'
            '    await StartMonitoringAsync(\n'
            '      resumePreindexedHistory: resumePlayback);\n'
            '  }\n\n')
          s = replace_once(s, marker, helper + marker, 'history refresh helper')
          p.write_text(s, encoding='utf-8', newline='\n')

          p = Path('AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
            s,
            '      if (form is not null)\n'
            '      {\n'
            '        GetField<JsonlSessionMonitor>(form, "_monitor").Stop(\n'
            '          "issue26-regression-cleanup");\n'
            '        form.Dispose();\n'
            '      }',
            '      if (form is not null && !form.IsDisposed)\n'
            '      {\n'
            '        GetField<JsonlSessionMonitor>(form, "_monitor").Stop(\n'
            '          "issue26-regression-cleanup");\n'
            '        MethodInfo closing = typeof(MainForm).GetMethod(\n'
            '          "MainFormClosing",\n'
            '          BindingFlags.Instance | BindingFlags.NonPublic) ??\n'
            '          throw new InvalidOperationException(\n'
            '            "MainFormClosing cleanup method was not found.");\n'
            '        _ = closing.Invoke(\n'
            '          form,\n'
            '          new object?[]\n'
            '          {\n'
            '            form,\n'
            '            new FormClosingEventArgs(\n'
            '              CloseReason.TaskManagerClosing,\n'
            '              cancel: false)\n'
            '          });\n'
            '        form.Dispose();\n'
            '        Application.DoEvents();\n'
            '      }',
            'regression cleanup')
          p.write_text(s, encoding='utf-8', newline='\n')
          '@ | python -

      - name: Focused GREEN
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test user-context-speech
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit and remove helper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-26-apply-fix.yml
          git add AgentPanelSpeaker/SettingsChangeSet.cs AgentPanelSpeaker/MainForm.cs AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "fix: wire live user context toggle"
          git push origin HEAD:feature/aiconversationcore-integration
