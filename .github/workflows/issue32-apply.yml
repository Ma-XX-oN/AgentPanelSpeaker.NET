name: Apply issue 32 transcript settings move

on:
  push:
    branches:
      - feature/aiconversationcore-integration
    paths:
      - .github/workflows/issue32-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply production and permanent regression changes
        shell: pwsh
        run: |
          python .github/scripts/issue32_patch.py
          git diff -- AgentPanelSpeaker/TranscriptSettingsPopup.cs AgentPanelSpeaker/TranscriptAdvancedSettingsPopup.cs AgentPanelSpeaker/AdditionalRegressionTestRunner.cs
      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
      - name: Run all built-in regressions
        shell: pwsh
        run: dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test
      - name: Validate patch integrity
        shell: pwsh
        run: git diff --check
      - name: Commit and push implementation
        shell: pwsh
        run: |
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add AgentPanelSpeaker/TranscriptSettingsPopup.cs AgentPanelSpeaker/TranscriptAdvancedSettingsPopup.cs AgentPanelSpeaker/AdditionalRegressionTestRunner.cs
          git commit -m "fix: move ordinary transcript settings out of advanced"
          git push origin HEAD:feature/aiconversationcore-integration
