name: Apply issue 56 production fix

on:
  push:
    branches:
      - issue-54-real-session-fixes
    paths:
      - scripts/apply-issue-56-production.py
      - .github/workflows/issue-56-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-54-real-session-fixes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply production patch
        shell: pwsh
        run: |
          python -m py_compile scripts/apply-issue-56-production.py
          python scripts/apply-issue-56-production.py
          git diff --check
      - name: Commit production patch
        shell: pwsh
        run: |
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/TranscriptView.cs
          git diff --cached --check
          if (git diff --cached --quiet) {
            throw 'Issue #56 patch produced no production diff.'
          }
          git commit -m 'fix: keep replacement scrolls out of manual navigation (#56)'
          git push origin HEAD:issue-54-real-session-fixes
