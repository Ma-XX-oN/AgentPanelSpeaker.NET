name: Issue 37 convergence RED

on:
  push:
    branches:
      - issue-37-vwindow-convergence-containment
    paths:
      - '.github/workflows/issue-37-convergence-red.yml'

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-37-vwindow-convergence-containment
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Make convergence trigger deterministic
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('AgentPanelSpeaker/Issue37VirtualWindowRegressionTestRunner.cs')
          text = path.read_text(encoding='utf-8')
          old = '''      ExecuteVoidScript(webView, "requestVirtualShift(-1);");
                PumpUntil(
                  () =>
                    ReadField<int>(view, "_windowStartIndex") != initialStart ||
                    ReadField<int>(view, "_windowEndIndex") != initialEnd,
                  "manual scroll window to replace the initial playback window");
          '''
          new = '''      Task shiftTask = InvokeTask(
                view,
                "RenderWindowForIndexAsync",
                0,
                "scroll-up",
                null,
                string.Empty,
                null);
              PumpUntilCompleted(
                shiftTask,
                "manual scroll window to replace the initial playback window");
              Require(
                ReadField<int>(view, "_windowStartIndex") != initialStart ||
                ReadField<int>(view, "_windowEndIndex") != initialEnd,
                "Manual scroll render did not leave the initial playback window.");
          '''
          if text.count(old) != 1:
            raise SystemExit(f'convergence trigger anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          marker = '''  private static T ReadField<T>(object target, string fieldName)
          '''
          helper = '''  private static Task InvokeTask(
            object target,
            string methodName,
            params object?[] arguments)
          {
            MethodInfo method = target.GetType().GetMethod(
              methodName,
              BindingFlags.Instance | BindingFlags.NonPublic) ??
              throw new InvalidOperationException(
                $"Method '{methodName}' was not found on {target.GetType().Name}.");
            return method.Invoke(target, arguments) as Task ??
              throw new InvalidOperationException(
                $"Method '{methodName}' did not return a Task.");
          }

          '''
          if helper.strip() not in text:
            if text.count(marker) != 1:
              raise SystemExit(f'helper insertion anchor count={text.count(marker)}')
            text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue37VirtualWindowRegressionTestRunner.cs
          git commit -m 'test: make vwindow convergence oracle deterministic (#37)'
          git push origin HEAD:issue-37-vwindow-convergence-containment

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build RED implementation
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require virtual-window oracle to reproduce known defects
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'red-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'red-err.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--test','virtual-window' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $text = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          Write-Host $text
          if ($p.ExitCode -eq 0) { throw 'Expected issue #37 virtual-window regressions to be RED before production fix.' }
          if ($text -notmatch 'FAIL  virtual-window/single-anchor-details-is-atomic') { throw 'Containment regression did not reproduce.' }
          if ($text -notmatch 'FAIL  virtual-window/browser-is-bounded-convergent-and-diagnostics-are-bounded') { throw 'Convergence/diagnostic regression did not reproduce.' }
          if ($text -notmatch 'Manual scroll window did not converge|per-node diagnostic') { throw 'Convergence/diagnostic RED failed for an unexpected reason.' }
          if ($text -notmatch 'TEST-SUITE-COMPLETE virtual-window exit=1') { throw 'RED suite did not reach completion sentinel.' }
