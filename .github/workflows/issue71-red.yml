name: Issue 71 stale Find RED

on:
  push:
    branches:
      - issue-71-stale-find-materialization

permissions:
  contents: write

jobs:
  red:
    if: ${{ !contains(github.event.head_commit.message, '[issue71-red-proven]') && !contains(github.event.head_commit.message, '[issue71-green]') }}
    runs-on: windows-2025
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply permanent regression
        run: python scripts/apply-issue71-red.py

      - name: Build RED state
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Prove exact RED
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'issue71-red-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'issue71-red-stderr.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--test','real-session-fixes' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          Write-Host $output
          if ($process.ExitCode -ne 1) {
            throw "Expected real-session-fixes RED exit 1, got $($process.ExitCode)."
          }
          $failures = @($output -split "`r?`n" | Where-Object { $_ -match '^FAIL  ' })
          if ($failures.Count -ne 1 -or $failures[0] -notmatch 'real-session/stale-find-materialization-is-cancelled-before-install') {
            throw "Expected only the issue #71 regression to fail. Failures: $($failures -join '; ')"
          }
          if ($output -notmatch 'TEST-SUITE-COMPLETE real-session-fixes exit=1') {
            throw 'RED suite did not emit the required completion marker.'
          }
          Write-Host 'RED-PROVEN issue #71 stale Find materialization installs after browser invalidation.'

      - name: Validate whitespace
        run: git diff --check

      - name: Commit permanent RED regression
        shell: pwsh
        run: |
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue54RealSessionRegressionTestRunner.cs
          if (git diff --cached --quiet) { throw 'No permanent issue #71 regression change to commit.' }
          git commit -m 'test: reproduce stale Find materialization race (#71) [issue71-red-proven]'
          git push origin HEAD:issue-71-stale-find-materialization
