name: Issue 37 selective word materialization RED v2

on:
  push:
    branches:
      - issue-37-selective-word-materialization
    paths:
      - '.github/workflows/issue-37-word-materialization-red2.yml'

permissions:
  contents: write

jobs:
  red:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-37-selective-word-materialization
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Harden production payload-builder lifecycle
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('AgentPanelSpeaker/Issue37WordMaterializationRegressionTestRunner.cs')
          text = path.read_text(encoding='utf-8')
          old = '''    using var productionView = new TranscriptView();
              FieldInfo identitiesField = typeof(TranscriptView).GetField(
          '''
          new = '''    using var host = new Form
              {
                Width = 320,
                Height = 240,
                ShowInTaskbar = false,
                StartPosition = FormStartPosition.Manual,
                Location = new Point(-32000, -32000)
              };
              using var productionView = new TranscriptView { Dock = DockStyle.Fill };
              host.Controls.Add(productionView);
              host.Show();
              Application.DoEvents();
              FieldInfo webViewField = typeof(TranscriptView).GetField(
                "_webView",
                BindingFlags.NonPublic | BindingFlags.Instance) ??
                throw new InvalidOperationException("TranscriptView._webView was not found.");
              var productionWebView = (WebView2?)webViewField.GetValue(productionView) ??
                throw new InvalidOperationException("TranscriptView WebView was unavailable.");
              PumpUntilCompleted(
                productionWebView.EnsureCoreWebView2Async(),
                "production payload-builder WebView initialization");

              FieldInfo identitiesField = typeof(TranscriptView).GetField(
          '''
          if old not in text:
            raise SystemExit('payload-builder lifecycle anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue37WordMaterializationRegressionTestRunner.cs
          git commit -m 'test: host issue 37 payload builder through real WebView lifecycle (#37)'
          git push origin HEAD:issue-37-selective-word-materialization

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build RED regression
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Require meaningful RED with bounded process wait
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'issue37-word-red-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'issue37-word-red-err.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--test','word-materialization' -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(90000)) {
            try { $process.Kill($true) } catch {}
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Issue #37 RED test process did not exit within 90 seconds.'
          }
          $text = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          Write-Host $text
          if ($process.ExitCode -eq 0) {
            throw 'Issue #37 word-materialization regression unexpectedly passed before the fix.'
          }
          if ($text -notmatch 'Large unvoiced record was eagerly expanded into word spans') {
            throw 'Issue #37 RED failed for an unexpected reason.'
          }
          if ($text -notmatch 'TEST-SUITE-COMPLETE word-materialization exit=1') {
            throw 'Issue #37 RED did not reach the suite completion sentinel.'
          }
