name: Issue 95 report routing GREEN

on:
  push:
    branches:
      - issue-95-ci-report-routing
    paths:
      - tools/issue95-patch.py
      - .github/workflows/issue-95-red-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: windows-latest

    steps:
      - name: Check out dependency branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-95-ci-report-routing
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install pinned Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Configure commit identity
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Verify permanent RED regression is present
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath AgentPanelSpeaker/RegressionTestRunner.cs -Raw
          if (-not $source.Contains('"ci-report-routing", TestReportRouting')) {
            throw 'Permanent issue 95 RED regression is missing.'
          }
          if ($source.Contains('Environment.GetEnvironmentVariable("RUNNER_TEMP")')) {
            throw 'Production repair is already present before the GREEN phase.'
          }

      - name: Apply production repair
        shell: pwsh
        run: |
          python tools/issue95-patch.py production
          git diff --check
          git add AgentPanelSpeaker/RegressionTestRunner.cs
          git commit -m 'fix: route CI regression reports to runner temp'
          git push origin HEAD:issue-95-ci-report-routing

      - name: Build GREEN candidate
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Prove issue 95 focused GREEN
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite regression

      - name: Run complete built application suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Verify physical clean tree after tests
        shell: pwsh
        run: |
          git diff --check
          $dirty = @(git status --porcelain)
          if ($dirty.Count -ne 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw 'Regression execution dirtied the tracked working tree.'
          }

      - name: Remove temporary issue 95 scaffolding
        shell: pwsh
        run: |
          git rm tools/issue95-patch.py .github/workflows/issue-95-red-green.yml
          git commit -m 'chore: remove issue 95 verification scaffolding'
          git push origin HEAD:issue-95-ci-report-routing
