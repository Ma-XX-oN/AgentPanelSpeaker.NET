name: Issue 95 clean-tree completion

on:
  push:
    branches:
      - issue-95-ci-report-routing
    paths:
      - .github/workflows/issue-95-red-green.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: windows-latest

    steps:
      - name: Check out dependency branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-95-ci-report-routing
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure commit identity
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Reproduce dependency-artifact dirtiness
        shell: pwsh
        run: |
          npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund
          $coreDirty = @(git -C dependencies/AIConversationCore status --porcelain=v1 --untracked-files=all)
          if ($coreDirty.Count -eq 0) {
            throw 'Expected npm ci to create dependency artifacts in the Core submodule.'
          }
          $unexpected = @($coreDirty | Where-Object { -not $_.StartsWith('?? node_modules/') })
          if ($unexpected.Count -ne 0) {
            $unexpected | ForEach-Object { Write-Host $_ }
            throw 'Core submodule contains changes other than generated node_modules artifacts.'
          }
          $rootDirty = @(git status --porcelain=v1)
          if ($rootDirty.Count -ne 1 -or $rootDirty[0].Trim() -ne 'M dependencies/AIConversationCore') {
            $rootDirty | ForEach-Object { Write-Host $_ }
            throw 'Parent worktree dirtiness is not limited to the generated Core dependency artifacts.'
          }

      - name: Remove generated dependency artifacts and verify clean tree
        shell: pwsh
        run: |
          Remove-Item -LiteralPath dependencies/AIConversationCore/node_modules -Recurse -Force
          $coreDirty = @(git -C dependencies/AIConversationCore status --porcelain=v1 --untracked-files=all)
          if ($coreDirty.Count -ne 0) {
            $coreDirty | ForEach-Object { Write-Host $_ }
            throw 'Core submodule remains dirty after generated dependency cleanup.'
          }
          git diff --check
          $rootDirty = @(git status --porcelain=v1)
          if ($rootDirty.Count -ne 0) {
            $rootDirty | ForEach-Object { Write-Host $_ }
            throw 'Parent worktree remains dirty after generated dependency cleanup.'
          }

      - name: Remove temporary issue 95 scaffolding
        shell: pwsh
        run: |
          git rm tools/issue95-patch.py .github/workflows/issue-95-red-green.yml
          git commit -m 'chore: remove issue 95 verification scaffolding'
          if (git status --porcelain=v1) {
            throw 'Final issue 95 dependency-branch worktree is not clean.'
          }
          git push origin HEAD:issue-95-ci-report-routing
