name: Issue 37 Core-unit integration GREEN

on:
  push:
    branches:
      - issue-37-vwindow-convergence-containment
    paths:
      - '.github/workflows/issue-37-core-units-green.yml'
      - 'scripts/issue-37-core-unit-integration.py'
      - 'scripts/issue-37-core-unit-constructor-compat.py'
      - 'scripts/issue-37-core-runtime-pin.py'
      - 'scripts/issue-37-core-parity-html-entity-test.py'
      - 'scripts/issue-37-search-deadlock-fix.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          ref: issue-37-vwindow-convergence-containment
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply Core-unit consumer integration
        shell: pwsh
        run: |
          python scripts/issue-37-core-unit-integration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/issue-37-core-unit-constructor-compat.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/issue-37-core-runtime-pin.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/issue-37-core-parity-html-entity-test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/issue-37-search-deadlock-fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pin verified AIConversationCore
        shell: pwsh
        run: |
          git -C dependencies/AIConversationCore fetch origin 6c92799c1b14693001e8b913465f4a12b0b1e1ab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C dependencies/AIConversationCore checkout --detach 6c92799c1b14693001e8b913465f4a12b0b1e1ab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (git -C dependencies/AIConversationCore rev-parse HEAD).Trim()
          if ($actual -ne '6c92799c1b14693001e8b913465f4a12b0b1e1ab') {
            throw "Core pin mismatch: $actual"
          }
          $runtimePin = (Get-Content tools/AIConversationCore-runtime/CORE_COMMIT -Raw).Trim()
          if ($runtimePin -ne $actual) {
            throw "Deployed Core runtime pin mismatch: submodule=$actual runtime=$runtimePin"
          }

      - name: Install Core dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Build integration
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run Core boundary regressions
        timeout-minutes: 8
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite core

      - name: Run rolled-back visibility regressions
        timeout-minutes: 8
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite rolled-back-visibility

      - name: Run independent output oracle
        timeout-minutes: 8
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite output-oracle

      - name: Run word-materialization regressions
        timeout-minutes: 8
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite word-materialization

      - name: Require Core-unit containment GREEN with only known browser defect remaining
        timeout-minutes: 8
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'virtual-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'virtual-err.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--test','virtual-window' -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $text = (Get-Content $stdout -Raw) + "`n" + (Get-Content $stderr -Raw)
          Write-Host $text
          if ($text -notmatch 'PASS  virtual-window/core-single-anchor-user-context-unit-is-preserved') {
            throw 'Core-unit containment regression did not turn GREEN.'
          }
          if ($text -match 'FAIL  virtual-window/core-single-anchor-user-context-unit-is-preserved') {
            throw 'Core-unit containment regression is still RED.'
          }
          if ($text -notmatch 'FAIL  virtual-window/browser-is-bounded-convergent-and-diagnostics-are-bounded') {
            throw 'Expected remaining #37 browser convergence/diagnostic RED was not observed.'
          }
          if ($text -notmatch 'TEST-SUITE-COMPLETE virtual-window exit=1') {
            throw 'Virtual-window suite did not reach its expected phased completion sentinel.'
          }
          Write-Host 'GREEN-PROVEN issue-37 core-unit-containment'

      - name: Validate patch integrity
        shell: pwsh
        run: git diff --check

      - name: Commit verified Core-unit integration
        shell: pwsh
        run: |
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add `
            dependencies/AIConversationCore `
            AgentPanelSpeaker/AIConversationCoreClient.cs `
            AgentPanelSpeaker/CoreRegressionTestRunner.cs `
            AgentPanelSpeaker/TranscriptPresentationDomFormatter.cs `
            AgentPanelSpeaker/TranscriptPresentationHtmlFormatter.cs `
            AgentPanelSpeaker/TranscriptVirtualDocument.cs `
            AgentPanelSpeaker/TranscriptView.cs `
            AgentPanelSpeaker/TranscriptSearchIndex.cs `
            tools/AIConversationCore-worker.mjs `
            tools/AIConversationCore-runtime/CORE_COMMIT
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'fix: consume Core-owned HTML virtualization units (#37)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:issue-37-vwindow-convergence-containment
