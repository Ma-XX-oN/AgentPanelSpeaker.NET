name: Update canonical integration documentation

on:
  push:
    branches:
      - feature/aiconversationcore-integration
    paths:
      - .github/workflows/update-integration-docs.yml

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration

      - name: Update documentation
        run: python tools/update-integration-docs.py

      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-integration-docs.yml
          git rm tools/update-integration-docs.py
          git add README.md DESIGN.md
          git commit -m "document AIConversationCore integration boundary"
          git push origin HEAD:feature/aiconversationcore-integration
