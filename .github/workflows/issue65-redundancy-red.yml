name: Issue 65 redundancy regression

on:
  push:
    branches:
      - issue-65-remove-redundant-transcript-identities
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build application
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Inventory redundant identity paths
        shell: pwsh
        run: |
          git grep -n -E 'SourceId|sourceId|WordId|wordId|GetWordMaps|displayWordsById|availableWordMapsByRecord|TryResolveSpeechWord' -- 'AgentPanelSpeaker/*.cs' | Write-Output

      - name: Run permanent issue 65 regression suite
        shell: pwsh
        run: |
          $hostRoot = Join-Path $env:RUNNER_TEMP 'issue65-host'
          New-Item -ItemType Directory -Force -Path $hostRoot | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows10.0.22621.0</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $hostRoot 'Issue65Host.csproj')
          @'
          using System.Reflection;

          string assemblyPath = Path.GetFullPath(args[0]);
          Assembly assembly = Assembly.LoadFrom(assemblyPath);
          Type type = assembly.GetType(
            "AgentPanelSpeaker.Issue65RedundancyRegressionTestRunner",
            throwOnError: true)!;
          MethodInfo method = type.GetMethod(
            "Run",
            BindingFlags.Static | BindingFlags.Public | BindingFlags.NonPublic) ??
            throw new InvalidOperationException(
              "Issue65RedundancyRegressionTestRunner.Run was not found.");
          int exitCode = (int)(method.Invoke(null, null) ?? 1);
          Environment.ExitCode = exitCode;
          '@ | Set-Content -Encoding utf8 (Join-Path $hostRoot 'Program.cs')
          $assemblyPath = Resolve-Path 'AgentPanelSpeaker/bin/Release/net10.0-windows10.0.22621.0/AgentPanelSpeaker.dll'
          dotnet run --project (Join-Path $hostRoot 'Issue65Host.csproj') --configuration Release -- $assemblyPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate patch whitespace
        shell: pwsh
        run: git diff --check "${{ github.event.before }}" HEAD
