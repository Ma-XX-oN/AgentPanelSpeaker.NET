name: Issue 67 final validation

on:
  push:
    branches:
      - issue-67-find-origin

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[issue67-finalized]') }}
    runs-on: windows-2025
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Core pin
        shell: pwsh
        run: |
          $expected = '6c92799c1b14693001e8b913465f4a12b0b1e1ab'
          $actual = (git -C dependencies/AIConversationCore rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Unexpected Core pin: $actual" }

      - name: Install Core dependencies
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Run Core regressions
        run: npm test --prefix dependencies/AIConversationCore

      - name: Validate Phase 2 baseline
        run: python dependencies/AIConversationCore/tests/validate-phase2-baseline.py

      - name: Build Release
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run issue 67 regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite find-origin

      - name: Verify test-runner completion guard
        shell: pwsh
        run: '& tools/Invoke-TestSuite.ps1 -SelfTest'

      - name: Run complete built suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and run complete deployed suite
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          & tools/Invoke-TestSuite.ps1 -Executable (Join-Path $publish 'AgentPanelSpeaker.exe') -Suite all

      - name: Verify bundled runtime
        shell: pwsh
        run: |
          Remove-Item Env:AI_CONVERSATION_CORE -ErrorAction SilentlyContinue
          $tools = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\tools'
          $worker = Join-Path $tools 'AIConversationCore-worker.mjs'
          $marker = Join-Path $tools 'AIConversationCore-runtime\CORE_COMMIT'
          if (-not (Test-Path $worker)) { throw "Built worker missing: $worker" }
          if (-not (Test-Path $marker)) { throw "Core marker missing: $marker" }
          if ((Get-Content $marker -Raw).Trim() -ne '6c92799c1b14693001e8b913465f4a12b0b1e1ab') { throw 'Bundled Core pin mismatch.' }
          $request = '{"operation":"ping"}'
          $decoded = ($request | node $worker) | ConvertFrom-Json
          if (-not $decoded.ok) { throw "Bundled worker ping failed: $($decoded.error)" }

      - name: Build DisplayParity
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release

      - name: Validate canonical display
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Validate whitespace
        shell: pwsh
        run: |
          git fetch origin feature/aiconversationcore-integration --depth=1
          git diff --check FETCH_HEAD HEAD

      - name: Remove temporary issue 67 scaffolding
        shell: pwsh
        run: |
          $beforeApp = (git rev-parse HEAD:AgentPanelSpeaker).Trim()
          Remove-Item .github/workflows/issue67-find-origin-green.yml
          Remove-Item .github/workflows/issue67-find-origin-red.yml
          Remove-Item .github/workflows/issue67-origin-crawl-green.yml
          Remove-Item .github/workflows/issue67-origin-crawl-red.yml
          Remove-Item .github/workflows/issue67-final-validation.yml
          Remove-Item scripts/apply-issue67-find-origin-fix.py
          Remove-Item scripts/apply-issue67-origin-crawl-fix.py
          Remove-Item scripts/apply-issue67-red-wiring.py
          git config user.name 'Ma-XX-oN'
          git config user.email 'Ma-XX-oN@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clean issue 67 validation scaffolding [issue67-finalized]'
          $afterApp = (git rev-parse HEAD:AgentPanelSpeaker).Trim()
          if ($beforeApp -ne $afterApp) { throw "Cleanup changed AgentPanelSpeaker tree: $beforeApp -> $afterApp" }
          git diff --check HEAD^
          git push origin HEAD:issue-67-find-origin
