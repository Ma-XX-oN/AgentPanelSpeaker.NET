name: Apply issue 26 live-toggle fix

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply production fix and test-isolation correction
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(text, old, new, label):
            if text.count(old) != 1:
              raise SystemExit(f'{label} patch target count={text.count(old)}')
            return text.replace(old, new, 1)

          changes = Path('AgentPanelSpeaker/SettingsChangeSet.cs')
          text = changes.read_text(encoding='utf-8')
          text = replace_once(
            text,
            '      AddScalar("Transcript/Maximized", ["Transcript", "Maximized"], oldValue.Maximized, newValue.Maximized);',
            '''      AddScalar("Transcript/Maximized", ["Transcript", "Maximized"], oldValue.Maximized, newValue.Maximized);
                AddScalar("Transcript/ShowRolledBackHistory", ["Transcript", "Show rolled-back Codex history"], oldValue.ShowRolledBackHistory, newValue.ShowRolledBackHistory);
                AddScalar("Transcript/SpeakUserContext", ["Transcript", "Speak User / IDE context"], oldValue.SpeakUserContext, newValue.SpeakUserContext);''',
            'AddTranscript')
          text = replace_once(
            text,
            '        Maximized = Pick("Transcript/Maximized", saved.Transcript.Maximized, working.Transcript.Maximized)',
            '''        Maximized = Pick("Transcript/Maximized", saved.Transcript.Maximized, working.Transcript.Maximized),
                  ShowRolledBackHistory = Pick("Transcript/ShowRolledBackHistory", saved.Transcript.ShowRolledBackHistory, working.Transcript.ShowRolledBackHistory),
                  SpeakUserContext = Pick("Transcript/SpeakUserContext", saved.Transcript.SpeakUserContext, working.Transcript.SpeakUserContext)''',
            'MergeSelected Transcript')
          changes.write_text(text, encoding='utf-8', newline='\n')

          main = Path('AgentPanelSpeaker/MainForm.cs')
          text = main.read_text(encoding='utf-8')
          text = replace_once(
            text,
            '  private async Task StartMonitoringAsync()\n',
            '  private async Task StartMonitoringAsync(bool resumePreindexedHistory = true)\n',
            'StartMonitoringAsync signature')
          text = replace_once(
            text,
            '''      if (reusePausedHistory)
                {
                  PauseToggleResult result = _speech.TogglePause(allowIdlePause: true);
                  AppendLog(result == PauseToggleResult.Resumed
                    ? "Monitoring started; playback resumed from indexed history."
                    : "Monitoring started, but indexed playback could not resume.");
                }
                else
                {
                  AppendLog("Monitoring started; existing history is being indexed.");
                }''',
            '''      if (reusePausedHistory && resumePreindexedHistory)
                {
                  PauseToggleResult result = _speech.TogglePause(allowIdlePause: true);
                  AppendLog(result == PauseToggleResult.Resumed
                    ? "Monitoring started; playback resumed from indexed history."
                    : "Monitoring started, but indexed playback could not resume.");
                }
                else if (reusePausedHistory)
                {
                  AppendLog("Monitoring restarted with refreshed paused history.");
                }
                else
                {
                  AppendLog("Monitoring started; existing history is being indexed.");
                }''',
            'StartMonitoringAsync reuse')
          text = replace_once(
            text,
            '    if (historyProjectionChanged && !_monitor.IsRunning &&\n',
            '    if (historyProjectionChanged &&\n',
            'running projection gate')
          text = replace_once(
            text,
            '''        _selectedSessionHistory = null;
                _selectedSessionHistoryPath = null;
                _ = LoadPausedHistoryPreviewAsync(session);''',
            '        _ = RefreshHistoryProjectionAsync(session);',
            'projection reload call')

          marker = '  private async Task LoadPausedHistoryPreviewAsync(LocatedSession session)\n'
          helper = '''  /// <summary>
            /// Reprojects a selected session after a Core-owned history/speech
            /// option changes, restarting a live monitor around the same canonical
            /// history load so indexed and future records use identical options.
            /// </summary>
            private async Task RefreshHistoryProjectionAsync(LocatedSession session)
            {
              bool restartMonitor = _monitor.IsRunning;
              bool resumePlayback = restartMonitor && !_speech.IsPaused;
              if (restartMonitor)
              {
                Interlocked.Increment(ref _monitorSession);
                _monitor.Stop("transcript projection settings changed");
                _speech.CancelAll();
              }

              _selectedSessionHistory = null;
              _selectedSessionHistoryPath = null;
              await LoadPausedHistoryPreviewAsync(session);

              if (!restartMonitor || _closing || IsDisposed ||
                  _selectedSessionHistory is null ||
                  !PathsReferToSameFile(_selectedSessionHistoryPath, session.Path))
              {
                return;
              }

              await StartMonitoringAsync(
                resumePreindexedHistory: resumePlayback);
            }

          '''
          text = replace_once(text, marker, helper + marker, 'projection helper insertion')
          main.write_text(text, encoding='utf-8', newline='\n')

          test = Path('AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs')
          text = test.read_text(encoding='utf-8')
          text = replace_once(
            text,
            '''      if (form is not null)
                {
                  GetField<JsonlSessionMonitor>(form, "_monitor").Stop(
                    "issue26-regression-cleanup");
                  form.Dispose();
                }''',
            '''      if (form is not null && !form.IsDisposed)
                {
                  GetField<JsonlSessionMonitor>(form, "_monitor").Stop(
                    "issue26-regression-cleanup");
                  MethodInfo closing = typeof(MainForm).GetMethod(
                    "MainFormClosing",
                    BindingFlags.Instance | BindingFlags.NonPublic) ??
                    throw new InvalidOperationException(
                      "MainFormClosing cleanup method was not found.");
                  _ = closing.Invoke(
                    form,
                    new object?[]
                    {
                      form,
                      new FormClosingEventArgs(
                        CloseReason.TaskManagerClosing,
                        cancel: false)
                    });
                  form.Dispose();
                  Application.DoEvents();
                }''',
            'Issue26 cleanup')
          test.write_text(text, encoding='utf-8', newline='\n')
          '@ | python -

      - name: Build and run focused regression
        shell: pwsh
        run: |
          dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test user-context-speech
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --no-build -- --test environment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit production fix and remove helper workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-26-live-toggle-fix.yml
          git add AgentPanelSpeaker/SettingsChangeSet.cs AgentPanelSpeaker/MainForm.cs AgentPanelSpeaker/Issue26UserContextSpeechRegressionTestRunner.cs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "fix: wire live user context toggle"
          git push origin HEAD:feature/aiconversationcore-integration
