name: Issue 35 retained visibility implementation patch

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
      - name: Apply issue 35 production implementation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
            p = Path(path)
            text = p.read_text(encoding='utf-8')
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
            p.write_text(text.replace(old, new, 1), encoding='utf-8')

