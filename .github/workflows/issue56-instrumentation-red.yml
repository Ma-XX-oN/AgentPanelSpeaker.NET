name: Issue 56 instrumentation RED

on:
  push:
    branches:
      - issue-56-scroll-replacement-user-intent

permissions:
  contents: write

jobs:
  red:
    if: github.event.head_commit.message == 'ci: run issue 56 instrumentation RED'
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply permanent instrumentation regression
        shell: pwsh
        run: python scripts/apply-issue56-instrumentation-red.py

      - name: Build regression-only head
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Commit permanent RED regression
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/Issue54RealSessionRegressionTestRunner.cs
          git commit -m 'test: add window transaction instrumentation contract (#56) [skip ci]'
          git push origin HEAD:issue-56-scroll-replacement-user-intent

      - name: Prove regression is RED before instrumentation
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          $output = (& $exe --test real-session-fixes 2>&1 | Out-String)
          $exit = $LASTEXITCODE
          Write-Host $output
          if ($exit -eq 0) {
            throw 'Instrumentation regression unexpectedly passed before production instrumentation.'
          }
          if ($output -notmatch 'FAIL  real-session/window-replacement-emits-transaction-diagnostics') {
            throw 'Expected instrumentation regression did not fail.'
          }
          if ($output -notmatch 'Timed out waiting for window replacement transaction diagnostic') {
            throw 'RED failure was not the missing transaction diagnostic contract.'
          }
          Write-Host 'RED CONFIRMED: production emits no correlated window transaction diagnostic yet.'
