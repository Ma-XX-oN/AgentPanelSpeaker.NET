name: Apply issue 26 history propagation fix

on:
  push:
    branches:
      - feature/aiconversationcore-integration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aiconversationcore-integration
          fetch-depth: 0
          submodules: recursive
      - name: Fix user-context history propagation
        shell: pwsh
        run: |
          $path = 'AgentPanelSpeaker/JsonlSessionMonitor.cs'
          $text = [IO.File]::ReadAllText($path)
          $nl = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
          $callPattern = 'EligibleHistory eligibleHistory = ReadEligibleHistory\(\r?\n      session,\r?\n      pendingInputRequests,\r?\n      includeRolledBackTurns\);'
          if ([regex]::Matches($text, $callPattern).Count -ne 1) { throw 'Expected one ReadEligibleHistory call target.' }
          $callReplacement = 'EligibleHistory eligibleHistory = ReadEligibleHistory(' + $nl + '      session,' + $nl + '      pendingInputRequests,' + $nl + '      includeRolledBackTurns,' + $nl + '      includeUserContext);'
          $text = [regex]::Replace($text, $callPattern, $callReplacement)
          $signaturePattern = 'private EligibleHistory ReadEligibleHistory\(\r?\n    LocatedSession session,\r?\n    IDictionary<string, CodexInputRequest> pendingInputRequests,\r?\n    bool includeRolledBackTurns,\r?\n    DateTime\? minimumTimestampUtc = null\)'
          if ([regex]::Matches($text, $signaturePattern).Count -ne 1) { throw 'Expected one ReadEligibleHistory signature target.' }
          $signatureReplacement = 'private EligibleHistory ReadEligibleHistory(' + $nl + '    LocatedSession session,' + $nl + '    IDictionary<string, CodexInputRequest> pendingInputRequests,' + $nl + '    bool includeRolledBackTurns,' + $nl + '    bool includeUserContext,' + $nl + '    DateTime? minimumTimestampUtc = null)'
          $text = [regex]::Replace($text, $signaturePattern, $signatureReplacement)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          git diff --check
      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AgentPanelSpeaker/JsonlSessionMonitor.cs
          git commit -m "fix: propagate user-context option through history reads"
          git push origin HEAD:feature/aiconversationcore-integration
