name: Issue 65 test migration apply

on:
  push:
    branches:
      - issue-65-remove-redundant-transcript-identities

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue65-tests-migrated]') }}
    runs-on: windows-2025
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply permanent regression migrations
        run: python scripts/patch-issue65-full-suite-regressions.py

      - name: Build application
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Run affected focused suites
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite speech-ordinals-focused
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite virtual-window
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite real-session-fixes
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite startup-performance
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite redundancy

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit migrated permanent tests
        shell: pwsh
        run: |
          git config user.name "Ma-XX-oN"
          git config user.email "Ma-XX-oN@users.noreply.github.com"
          git add AgentPanelSpeaker
          if (git diff --cached --quiet) {
            throw "Issue #65 test migration produced no permanent test changes."
          }
          git commit -m "test: align regressions with record-local identity contract (#65) [issue65-tests-migrated]"
          git push origin HEAD:issue-65-remove-redundant-transcript-identities
