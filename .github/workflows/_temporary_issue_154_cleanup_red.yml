name: Temporary issue 154 cleanup RED

on:
  push:
    branches:
      - tmp-issue-154-cleanup-red
    paths:
      - .github/workflows/_temporary_issue_154_cleanup_red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: df6b335dffe651e3c470329c690f48e90fda2d7a
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute post-equivalence cleanup contract as RED
        run: python -m unittest tests/test_repoworkflow_adoption.py
