name: Repair syntax and validate

on:
  push:
    branches:
      - issue-56-scroll-replacement-user-intent

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: windows-latest
    steps:
      - name: Check out branch and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Repair duplicated render-start statement
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("AgentPanelSpeaker/TranscriptView.cs")
          text = path.read_text(encoding="utf-8")
          bad = '    DiagnosticLog.Write("transcript.render_started", new    DiagnosticLog.Write("transcript.render_started", new'
          good = '    DiagnosticLog.Write("transcript.render_started", new'
          count = text.count(bad)
          if count != 1:
            raise RuntimeError(f"Expected exactly one duplicated render-start statement, found {count}.")
          path.write_text(text.replace(bad, good, 1), encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Syntax repair failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install pinned AIConversationCore dependencies
        shell: pwsh
        run: npm ci --prefix dependencies/AIConversationCore --no-audit --no-fund

      - name: Run AIConversationCore regression tests
        shell: pwsh
        run: npm test --prefix dependencies/AIConversationCore

      - name: Validate Phase 2 baseline
        shell: pwsh
        run: python dependencies/AIConversationCore/tests/validate-phase2-baseline.py

      - name: Build AgentPanelSpeaker
        shell: pwsh
        run: dotnet build AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release

      - name: Commit verified syntax repair
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AgentPanelSpeaker/TranscriptView.cs
          git commit -m 'fix: repair malformed render-start statement (#56 #60) [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Syntax repair commit failed.' }
          git push origin HEAD:issue-56-scroll-replacement-user-intent
          if ($LASTEXITCODE -ne 0) { throw 'Syntax repair push failed.' }

      - name: Run startup progress regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite startup-progress

      - name: Run real-session regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite real-session-fixes

      - name: Run startup performance regressions
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite startup-performance

      - name: Verify test-runner completion guard
        shell: pwsh
        run: '& tools/Invoke-TestSuite.ps1 -SelfTest'

      - name: Run built full regression suite
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'AgentPanelSpeaker\bin\Release\net10.0-windows10.0.22621.0\AgentPanelSpeaker.exe'
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Publish and run deployed full suite
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'AgentPanelSpeaker-publish'
          dotnet publish AgentPanelSpeaker/AgentPanelSpeaker.csproj --configuration Release --output $publish
          if ($LASTEXITCODE -ne 0) { throw 'AgentPanelSpeaker publish failed.' }
          $exe = Join-Path $publish 'AgentPanelSpeaker.exe'
          if (-not (Test-Path $exe)) { throw "Published application missing: $exe" }
          & tools/Invoke-TestSuite.ps1 -Executable $exe -Suite all

      - name: Build display validation harness
        shell: pwsh
        run: dotnet build tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release

      - name: Validate canonical transcript display
        shell: pwsh
        env:
          AI_CONVERSATION_CORE: ${{ github.workspace }}\dependencies\AIConversationCore
        run: |
          dotnet run --project tools/AgentPanelSpeaker.DisplayParity/AgentPanelSpeaker.DisplayParity.csproj --configuration Release --no-build -- "${{ github.workspace }}\dependencies\AIConversationCore" "${{ github.workspace }}\tools\AIConversationCore-worker.mjs"

      - name: Validate branch whitespace
        shell: pwsh
        run: git diff --check HEAD~1 HEAD
